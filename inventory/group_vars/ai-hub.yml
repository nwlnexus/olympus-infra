---
# AI Hub vars — OrbStack k8s retired; host is now Ollama-only
ansible_user: ansible

# Ollama
ollama_state: present
ollama_service_port: 11434
ollama_models:
  - glm-4.7-flash:latest
  - llama3.3:70b
  - nomic-embed-text

# LiteLLM — moved to management-hub k8s
litellm_state: absent
litellm_port: 4000
litellm_config_dest: /opt/litellm/config.yaml

# Tailscale
tailscale_state: present
tailscale_hostname: ai-hub

# Cloudflared binary present (tunnel deleted — binary kept for potential future use)
cloudflared_state: present

# Single-node cluster: the cloudflared-k8s playbook gates on `k3s_primary`.
k3s_primary: true

# --- cloudflared-k8s (GitOps mode: tunnel + DNS managed by Ansible, K8s
# Secret + Deployment + ingress config managed by Flux via ExternalSecret) ---
cloudflared_k8s_state: present
cloudflared_tunnel_name: ai-hub
cloudflared_account_id: "1b15dcdab99d4e8d5babb3dc6b1adaec"
cloudflared_domain: "nwlnexus.net"
cloudflared_bootstrap_only: true
cloudflared_ingress_hostname: "ing.ai-hub.nwlnexus.net"
cloudflared_catch_all_service: "https://traefik.traefik.svc.cluster.local:443"
cloudflared_kubeconfig_path: /var/ansible/.kube/config

# GitOps mode — push creds to 1Password instead of writing the K8s Secret.
# The repo's ExternalSecret (clusters/ai-hub/cloudflared/externalsecret.yaml)
# hydrates `cloudflared-tunnel-credentials` from this 1Password item. Token
# is read from the on-host file 1password-connect role already manages.
cloudflared_op_connect_enabled: true
cloudflared_op_connect_host: "https://connect.nwlnexus.net"
cloudflared_op_vault: "Dev"
cloudflared_op_item_title: "ai-hub-cloudflared"

# 1Password Connect — k3s via Colima; kubeconfig at non-standard path
onepassword_connect_state: present
onepassword_connect_kubeconfig: /var/ansible/.kube/config

# ESO bootstrap — seeds Connect token into ESO secret
eso_bootstrap_state: present
eso_kubeconfig_path: /var/ansible/.kube/config
