---
# AI Hub vars — OrbStack k8s retired; host is now Ollama-only
ansible_user: ansible

# Ollama
ollama_state: present
ollama_service_port: 11434
ollama_models:
  - glm-4.7-flash:latest
  - llama3.3:70b
  - nomic-embed-text

# LiteLLM — moved to management-hub k8s
litellm_state: absent
litellm_port: 4000
litellm_config_dest: /opt/litellm/config.yaml

# Tailscale
tailscale_state: present
tailscale_hostname: ai-hub

# Cloudflared binary present (tunnel deleted — binary kept for potential future use)
cloudflared_state: present

# Preserve environment (including PATH) through sudo so Homebrew helm/kubectl are found
ansible_become_flags: "-E"

# 1Password Connect — k3s via Colima; kubeconfig at non-standard path
onepassword_connect_state: present
onepassword_connect_kubeconfig: /var/ansible/.kube/config

# ESO bootstrap — seeds Connect token into ESO secret
eso_bootstrap_state: present
eso_kubeconfig_path: /var/ansible/.kube/config
