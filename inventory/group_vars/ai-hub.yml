---
# ai-hub — Mac Studio M1 Max (64 GB, 10-core, 927 GB NVMe)
# Role: data tier (PostgreSQL/Redis/ClickHouse/Ollama as macOS LaunchDaemons)
#       NOT a k8s node — Apple Silicon Metal cannot be passed to Linux containers.
#
# 2026-06-07: Zombie ansible Colima VM (memory: 48 GB, cpu: 10) killed and
#             config zeroed out. Was a retired k3s cluster consuming 39 GB of RAM
#             and causing Ollama-triggered system freezes.

ansible_user: ansible

# Ollama
ollama_state: present
ollama_service_port: 11434
ollama_models:
  # mem0/OpenMemory platform models (mnemosyne):
  - qwen3:32b          # mem0 extraction LLM (used on infer=true adds)
  - nomic-embed-text   # mem0 embedder (768-dim)
  - llama3.2:3b        # OpenMemory per-add categorization (small/fast, ~0.5s)

# LiteLLM — moved to management-hub k8s
litellm_state: absent
litellm_port: 4000
litellm_config_dest: /opt/litellm/config.yaml

# Tailscale
tailscale_state: present
tailscale_hostname: ai-hub

# Cloudflared binary present (tunnel deleted — binary kept for potential future use)
cloudflared_state: present

# ── Data Services ─────────────────────────────────────────────────────────────
data_services_state: present
data_services_tailscale_ip: "100.95.232.41"
data_services_tailscale_cidr: "100.64.0.0/10"
data_services_nvme_root: /opt/olympus
data_services_nfs_archive: /Volumes/ai-hub-data

# PostgreSQL tuning for 64 GB M1 Max — conservative to leave headroom for Ollama 70B
# ansible Colima VM (48 GB, 10 CPU) was killing the machine; it has been stopped.
# New baseline without Ollama: ~22 GB used, leaving 42 GB free for model loading.
data_services_postgres_shared_buffers: "4GB"
data_services_postgres_effective_cache: "12GB"
data_services_postgres_max_connections: 200
data_services_postgres_brew_prefix: /opt/homebrew/opt/postgresql@16
