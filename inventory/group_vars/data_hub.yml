---
# data-hub — Mac Studio M1 Max (64 GB, 10-core, 927 GB NVMe)
# Role: compute (olympus-sdk#701): the macOS CI runner and an arm64 k3s agent VM (data-hub-vm; the runner
#       and the VM are declared in nix-darwin-hm, the VM joins k3s like the minis' VMs), plus two small
#       llama-server instances (the coder-light fallback behind the A9, and an embed fallback). The Mac
#       itself is not a k8s node.
#       Postgres and the 27B instance were retired in olympus-sdk#701.
#
# These vars load because data-hub is a member of the `data_hub` inventory group
# (see inventory/olympus.yml and inventory/data-hub.yml). Before 2026-10-20 this file
# was named group_vars/data-hub.yml and no group of that name existed in any
# inventory, so it applied to nothing (the host ran on role defaults).

# ── Tailnet ───────────────────────────────────────────────────────────────────
data_hub_tailscale_ip: "100.95.232.41"

# ── Ollama (retired 2026-10-27, nwlnexus/olympus-sdk#588) ─────────────────────
# Ollama 0.30.11's MLX engine stopped completing generations for qwen3.6:27b-mlx
# (2026-10-26 23:14 UTC). Hard cutover to llama-server, no soak: the daemon, the
# Homebrew package and the models are removed. Rollback vars (reinstall + re-pull):
# olympus-sdk infra/rollback/data-hub-serving-ollama.yml. The ollama_* settings below
# are what a rollback serves with; a follow-up PR removes them with the ollama role.
ollama_state: absent
ollama_remove_package: true
ollama_purge_models: true
# Install-but-never-upgrade: an Ollama upgrade is a deliberate, separate step
# (set to `latest` for one push run), not a side effect of merging or of a pull run.
ollama_pkg_state: present
ollama_run_user: nwilliams-lucas
ollama_bind_host: "{{ data_hub_tailscale_ip }}"
ollama_service_port: 11434
ollama_keep_alive: "24h"
ollama_max_loaded_models: 2
ollama_num_parallel: 1
ollama_context_length: 32768
ollama_flash_attention: true
ollama_models:
  - nomic-embed-text     # memory-embed alias (768-dim)
  - qwen2.5:7b-instruct  # coder-light alias; fast, non-thinking
ollama_models_remove:
  - llama3.2:3b          # retired: only OpenMemory categorization used it
ollama_generate_warmup_models: []
ollama_embed_warmup_models:
  - nomic-embed-text

# ── llama-server ──────────────────────────────────────────────────────────────
# One llama.cpp llama-server per model, each its own LaunchDaemon, all resident (no
# swapper). Plan: olympus-sdk docs/plans/2026-10-27-data-hub-llama-server-cutover.md.
# Bound to the tailnet address only (no API key; the cluster LiteLLM is the client door).
# Timeouts: memory worker 300 s < LiteLLM 600 s < llama-server 900 s.
llama_server_state: present
llama_server_run_user: nwilliams-lucas
llama_server_bind_host: "{{ data_hub_tailscale_ip }}"
llama_server_models_dir: /opt/olympus/models/gguf
# Pinned Hugging Face revisions; sha256 is the LFS oid, size in bytes.
llama_server_models:
  - file: Qwen2.5-7B-Instruct-Q4_K_M.gguf
    repo: bartowski/Qwen2.5-7B-Instruct-GGUF
    revision: 8911e8a47f92bac19d6f5c64a2e2095bd2f7d031
    size: 4683074240
    sha256: 65b8fcd92af6b4fefa935c625d1ac27ea29dcb6ee14589c55a8f115ceaaa1423
  - file: nomic-embed-text-v1.5.f16.gguf
    repo: nomic-ai/nomic-embed-text-v1.5-GGUF
    revision: 0188c9bf409793f810680a5a431e7b899c46104c
    size: 274290560
    sha256: f7af6f66802f4df86eda10fe9bbcfc75c39562bed48ef6ace719a251cf1c2fdb
# Retired with the 27B fallback (olympus-sdk#701): the file is deleted on the next run.
llama_server_models_remove:
  - Qwen3.6-27B-Q5_K_M.gguf
# Flags the installed llama-server does not know go here (check `llama-server --help`).
llama_server_drop_flags: []
llama_server_instances:
  # coder-light (fallback behind the A9)
  - name: qwen25-7b
    port: 8082
    model: Qwen2.5-7B-Instruct-Q4_K_M.gguf
    alias: qwen2.5-7b-instruct
    kind: chat
    args:
      - [-c, 32768]
      - [-np, 1]
      - [-ngl, 999]
      - [-fa, "on"]
      - --jinja
      - [-n, 8192]
      - [--cache-ram, 0]
      - --metrics
      - --no-webui
      - [--timeout, 900]
  # memory-embed (768-dim; prod embeds go to the in-cluster TEI, this is the fallback)
  - name: nomic-embed
    port: 8083
    model: nomic-embed-text-v1.5.f16.gguf
    alias: nomic-embed-text
    kind: embed
    embed_dim: 768
    args:
      - --embeddings
      - [--pooling, mean]
      - [-c, 8192]
      - [-np, 4]
      - [-b, 8192]
      - [-ub, 2048]
      - [-ngl, 999]
      - --metrics
      - --no-webui
      - [--timeout, 120]

# ── LiteLLM ───────────────────────────────────────────────────────────────────
# RETIRED (olympus-sdk#569, HW11): routing moved to the cluster LiteLLM (olympus-gitops
# clusters/olympus/inference), which uses this host's llama-servers as the fallback behind the A9.
# `absent` boots out the LaunchDaemon com.litellm.proxy, uninstalls the pipx package and removes the
# plist, /usr/local/bin/litellm-serve and /opt/litellm. No rollback to it: the 27B it routed
# memory-extract and coder-heavy to is gone too (olympus-sdk#701), so no other litellm_* settings are
# kept; litellm_run_user records the account it ran as (the pipx uninstall runs as the push user).
litellm_state: absent
litellm_run_user: nwilliams-lucas

# ── iSCSI / NFS ───────────────────────────────────────────────────────────────
# No NAS mount on this host. The iscsi role defaults to `present`, which on macOS
# installs an NFS-mount LaunchDaemon; with no portal set it would mount ":/data".
# `absent` makes the role a no-op here (it has no removal tasks).
iscsi_state: absent

# ── Tailscale ─────────────────────────────────────────────────────────────────
tailscale_state: present
tailscale_hostname: data-hub

# ── Roles the hourly pull never runs on this host (olympus-sdk#703) ───────────
# The pull ended at `baseline` on macOS until #703, so these roles never ran here.
# tailscale: no push playbook manages it here either; with role defaults the pull
#   would run `tailscale set --ssh=false` (Tailscale SSH is in use on this host) and
#   retag the device to the default tags through the API.
# ddclient: the running Homebrew ddclient here is configured by hand (old host names);
#   the role would rewrite its config and seed a public A record for data-hub. Leave it
#   to an owner decision (keep, move to the role, or retire).
pull_excluded_roles:
  - tailscale
  - ddclient

# Not a k3s node (the k3s agent is the data-hub-vm guest). Keeps the cluster-scoped
# roles (1password-connect, eso-bootstrap: `k3s_primary | default(true)` in
# playbooks/pull/olympus.yml) out of this host's pull: a credentials file exists in
# /etc/olympus, so 1password-connect would otherwise run `helm upgrade --install`.
k3s_primary: false

# Cloudflared binary present (tunnel deleted — binary kept for potential future use)
cloudflared_state: present

# ── Data Services ─────────────────────────────────────────────────────────────
data_services_state: present
data_services_tailscale_ip: "{{ data_hub_tailscale_ip }}"
data_services_tailscale_cidr: "100.64.0.0/10"
data_services_nvme_root: /opt/olympus

# PostgreSQL retired (olympus-sdk#701; no client since 2026-06-27): `absent` boots out and deletes
# com.olympus.postgres, removes /usr/local/bin/postgres-serve and uninstalls Homebrew postgresql@16.
# The data directory under /opt/olympus/data/postgres is kept.
data_services_postgres_state: absent
