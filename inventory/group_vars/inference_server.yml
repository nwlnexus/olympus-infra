---
# GEEKOM A9 Mega (Ryzen AI Max+ 395, 128 GB unified memory) - the fleet's inference host.
# Ubuntu 26.04, tailnet host managed by olympus-infra, NOT a k3s node (olympus-sdk#568, H8).
# Linux twin of group_vars/data_hub.yml for the shared instances (qwen36-27b :8081, nomic-embed :8083: same
# pins, same args). Since olympus-sdk#460 the A9 also runs instances data-hub does not (coder-medium,
# a dedicated coder-heavy, a Qwen3.5 coder-light); data-hub keeps its three and is only the fallback.
#
# These vars load for hosts in the `inference_server` inventory group (inventory/inference-server.yml
# for ansible-pull, inventory/olympus.yml for push). The group holds a9-mega; runbook:
# roles/inference-server/README.md.

# The A9's tailnet address (tag:inference, joined 2026-10-27 by bootstrap-host.yml). llama-server binds here only.
inference_server_tailscale_ip: "100.89.177.55"

# present since 2026-10-28 (HW10 phase E, olympus-sdk#568).
inference_server_state: present

# ── ansible-pull (applies to the host once it is in the group) ─────────────────
ansible_pull_state: present
ansible_pull_inventory: inventory/inference-server.yml
ansible_pull_playbook: playbooks/pull/olympus.yml
# TODO(owner): set to the A9's host name (same value as in inventory/inference-server.yml);
# the pull inventory also defines `localhost`, which the implicit limit would match too.
ansible_pull_limit: a9-mega

# ── Tailscale ─────────────────────────────────────────────────────────────────
tailscale_state: present
tailscale_hostname: a9-mega
# Not a k8s node: only tag:inference (policy: olympus-tailnet; tagOwners admin + tag:infra-server).
tailscale_tags: ["tag:inference"]
tailscale_accept_dns: false
tailscale_accept_routes: false
tailscale_services: [ssh]
tailscale_oauth_client_id: "{{ lookup('community.general.onepassword', 'ansible-tailscale-oauth', field='client-id', vault='Dev') }}"
tailscale_oauth_client_secret: "{{ lookup('community.general.onepassword', 'ansible-tailscale-oauth', field='client-secret', vault='Dev') }}"

# Not a k3s node: keeps the pull playbook from running 1password-connect / eso-bootstrap.
k3s_primary: false
# `common` is skipped fleet-wide, as on compute_hub.
ansible_pull_skip_tags: common
atlas_state: present
baseline_unattended_auto_reboot: false

# ── inference-server ──────────────────────────────────────────────────────────
# llama.cpp b11795 official Ubuntu Vulkan build (default). `-e inference_server_backend=rocm`
# selects the ROCm build once the host has ROCm 7.x userspace (see the role README).
inference_server_backend: vulkan
inference_server_bind_host: "{{ inference_server_tailscale_ip }}"
inference_server_models_dir: /opt/olympus/models/gguf
# 96 of 128 GiB addressable by the GPU: ttm.pages_limit=25165824 (GRUB drop-in, reboot required).
inference_server_gpu_memory_gib: 96
# Timeouts: memory worker 300 s < LiteLLM 600 s < llama-server 900 s. At most -np + 4 requests
# are admitted per instance (nftables cap); the rest are reset immediately.
inference_server_models:
  - file: Qwen3.6-27B-Q5_K_M.gguf
    repo: unsloth/Qwen3.6-27B-GGUF
    revision: 82d411acf4a06cfb8d9b073a5211bf410bfc29bf
    size: 19509790944
    sha256: cfecab168156269f25d5ffe9e13cf2a401ca2f43a9693fa00bcd1625316ccbde
  # coder-light (olympus-sdk#460; replaces Qwen2.5-7B: the July rule is no qwen2.5 for coding).
  - file: Qwen3.5-9B-Q4_K_M.gguf
    repo: unsloth/Qwen3.5-9B-GGUF
    revision: 3885219b6810b007914f3a7950a8d1b469d598a5
    size: 5680522464
    sha256: 03b74727a860a56338e042c4420bb3f04b2fec5734175f4cb9fa853daf52b7e8
  # coder-medium: Qwen3.6-35B-A3B (MoE, 3B active), UD-Q5_K_M (olympus-sdk#460, decision doc 4.6).
  - file: Qwen3.6-35B-A3B-UD-Q5_K_M.gguf
    repo: unsloth/Qwen3.6-35B-A3B-GGUF
    revision: a483e9e6cbd595906af30beda3187c2663a1118c
    size: 26456194016
    sha256: c13ce26253ea334df472bd8fbd2d6da66d8a41195c17f6fcbf44c4d20ece0932
  - file: nomic-embed-text-v1.5.f16.gguf
    repo: nomic-ai/nomic-embed-text-v1.5-GGUF
    revision: 0188c9bf409793f810680a5a431e7b899c46104c
    size: 274290560
    sha256: f7af6f66802f4df86eda10fe9bbcfc75c39562bed48ef6ace719a251cf1c2fdb
inference_server_models_remove: []
# Flags the installed llama-server does not know go here (check `llama-server --help`).
inference_server_drop_flags: []
inference_server_instances:
  # memory-extract only since olympus-sdk#460 (coder-heavy moved to :8085). Thinking off by default (LiteLLM sends
  # enable_thinking per alias); reasoning, if any, goes to reasoning_content.
  - name: qwen36-27b
    port: 8081
    model: Qwen3.6-27B-Q5_K_M.gguf
    alias: qwen3.6-27b
    kind: chat
    args:
      - [-c, 32768]
      - [-np, 1]
      - [-ngl, 999]
      - [-fa, "on"]
      - --jinja
      - [--reasoning-format, deepseek]
      - [--chat-template-kwargs, '{"enable_thinking":false}']
      - [-n, 8192]
      - [--cache-ram, 0]
      - --metrics
      - --no-webui
      - [--timeout, 900]
  # coder-light: Qwen3.5-9B (same family and chat template as the 27B; thinking off like the others).
  - name: qwen35-9b
    port: 8082
    model: Qwen3.5-9B-Q4_K_M.gguf
    alias: qwen3.5-9b
    kind: chat
    args:
      - [-c, 32768]
      - [-np, 1]
      - [-ngl, 999]
      - [-fa, "on"]
      - --jinja
      - [--reasoning-format, deepseek]
      - [--chat-template-kwargs, '{"enable_thinking":false}']
      - [-n, 8192]
      - [--cache-ram, 0]
      - --metrics
      - --no-webui
      - [--timeout, 900]
  # coder-medium: Qwen3.6-35B-A3B MoE, 64k context (about 26.6 GiB in GTT).
  - name: qwen36-35b-a3b
    port: 8084
    model: Qwen3.6-35B-A3B-UD-Q5_K_M.gguf
    alias: qwen3.6-35b-a3b
    kind: chat
    args:
      - [-c, 65536]
      - [-np, 1]
      - [-ngl, 999]
      - [-fa, "on"]
      - --jinja
      - [--reasoning-format, deepseek]
      - [--chat-template-kwargs, '{"enable_thinking":false}']
      - [-n, 8192]
      - [--cache-ram, 0]
      - --metrics
      - --no-webui
      - [--timeout, 900]
  # coder-heavy, dedicated (olympus-sdk#460): a second process on the same GGUF as :8081 so a coding
  # turn never queues behind memory extraction. Own weights copy plus 64k KV in GTT (about 22.7 GiB).
  - name: qwen36-27b-coder
    port: 8085
    model: Qwen3.6-27B-Q5_K_M.gguf
    alias: qwen3.6-27b-coder
    kind: chat
    args:
      - [-c, 65536]
      - [-np, 1]
      - [-ngl, 999]
      - [-fa, "on"]
      - --jinja
      - [--reasoning-format, deepseek]
      - [--chat-template-kwargs, '{"enable_thinking":false}']
      - [-n, 8192]
      - [--cache-ram, 0]
      - --metrics
      - --no-webui
      - [--timeout, 900]
  # memory-embed (768-dim; prod embeds go to the in-cluster TEI, this is the fallback)
  - name: nomic-embed
    port: 8083
    model: nomic-embed-text-v1.5.f16.gguf
    alias: nomic-embed-text
    kind: embed
    embed_dim: 768
    args:
      - --embeddings
      - [--pooling, mean]
      - [-c, 8192]
      - [-np, 4]
      - [-b, 8192]
      - [-ub, 2048]
      - [-ngl, 999]
      - --metrics
      - --no-webui
      - [--timeout, 120]

# --- Connection cap (HW10 phase F, owner decision 2026-10-28: on after HW11 measured LiteLLM) ---
# Measured 2026-10-29 with the cluster LiteLLM (aiohttp pool) as the only client: 0 established
# connections per instance port at idle, 1 during a request; no idle keep-alive. Cap per port =
# slots(-np) + queue (4) + headroom (2); LiteLLM gets a TCP RST past that and fails over instead of
# queueing behind a long generation.
inference_server_connection_limit_enabled: true

# --- iSCSI: none on the inference host ---
# The iscsi role defaults to state present / host_mount with an empty portal,
# which fails target discovery ("Cannot resolve host"). The A9 has no SAN volume.
iscsi_state: absent
