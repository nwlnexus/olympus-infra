---
# naraka-01 vars for ansible-pull (inventory/management-hub.yml).
# The single-node management-hub cluster is retired: naraka-01 is now a k3s
# AGENT in the olympus cluster. Cluster-scoped roles (1password-connect,
# eso-bootstrap, qnap-csi-bootstrap, cloudflared-k8s) run only on the olympus
# primary (onode-030c31, group_vars/compute_hub.yml) and must stay disabled
# here — this node has no server kubeconfig (/etc/rancher/k3s/k3s.yaml).
ansible_user: ansible

# k3s — naraka-01 joins as agent in the unified olympus cluster.
# Control-plane is the 3 onodes (compute_hub group, kube-vip VIP 192.168.253.2).
# Apply with: playbooks/push/join-naraka-agent.yml (Plan 4 supervised cutover).
k3s_state: present
k3s_agent: true
k3s_version: "v1.32.4+k3s1"  # must match olympus control-plane version
k3s_server_url: "https://192.168.253.2:6443"
k3s_token_op_ref: "op://Dev/compute-hub-k3s-token/password"
k3s_node_labels:
  - "olympus.io/role=management-hub"
k3s_node_taints:
  - "olympus.io/role=management-hub:NoSchedule"

# Tailscale (hostname is only used on first join; the node is already
# connected as naraka-01, and `tailscale set` does not rename it)
tailscale_state: present
tailscale_hostname: naraka-01

# Cloudflared (binary only; tunnel + Deployment run in k3s via GitOps)
cloudflared_state: present

# k3s agent, not a server: keeps every `k3s_primary`-gated role in
# playbooks/pull/olympus.yml off this node.
k3s_primary: false

# --- Flux kubeconfig export to 1Password ---
# Uploads a patched kubeconfig (Tailscale IPv4 as server, proper context/cluster/user names)
# so the kubeconfig-merger can include management-hub in the Headlamp combined kubeconfig.
flux_kubeconfig_1password_item: "management-hub-kubeconfig"
flux_kubeconfig_1password_vault: "Dev"
flux_kubeconfig_context_name: "management-hub"
# External server left empty: flux role auto-resolves to Tailscale IPv4 (already in k3s TLS SAN)
flux_kubeconfig_external_server: ""
flux_kubeconfig_external_port: 6443
flux_kubeconfig_insecure_tls: false
flux_kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"

# Unifi DNS policy (media.nwlnexus.io → management-hub LAN IP) must be configured
# manually in the Unifi UI — the DNS Policy API requires Ubiquiti account session auth
# and is not accessible for server-to-server calls from the local network.

# ddclient — no extra public records needed; Plex external URL is via Tailscale Funnel
ddclient_state: present

# --- ansible-pull (pull-mode self-management) ---
ansible_pull_state: present
ansible_pull_inventory: inventory/management-hub.yml
ansible_pull_playbook: playbooks/pull/olympus.yml
# Kept out of the hourly run until fixed or pinned:
#   common      — fails (package `nc`, missing handler); see group_vars/compute_hub.yml
#   tailscale   — would run `tailscale set --advertise-exit-node=false --ssh=false`,
#                 dropping this node's exit-node routes and Tailscale SSH
#   cloudflared — Linux path calls Homebrew, which is not installed here
ansible_pull_skip_tags: common,tailscale,cloudflared
ansible_pull_interval: "1h"
ansible_pull_interval_seconds: 3600

# iSCSI host prereqs — Trident CSI driver manages login/CHAP; Ansible sets initiator name only
iscsi_state: present
iscsi_mode: csi_node

# Atlas daemon
atlas_state: present
