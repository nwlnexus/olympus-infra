---
# Management Hub vars for ansible-pull (pull-mode, health checks only)
# Secrets come from 1Password Connect via External Secrets Operator
ansible_user: ansible

# k3s
k3s_state: present
k3s_role: server

# Tailscale
tailscale_state: present
tailscale_hostname: management-hub

# Cloudflared (binary only; tunnel + Deployment run in k3s via GitOps)
cloudflared_state: present

# Single-node cluster: the cloudflared-k8s playbook gates on `k3s_primary`.
k3s_primary: true

# --- cloudflared-k8s (GitOps mode: tunnel + DNS managed by Ansible; K8s
# Secret + Deployment + ingress config owned by Flux via ExternalSecret) ---
cloudflared_k8s_state: present
cloudflared_tunnel_name: management-hub
cloudflared_account_id: "1b15dcdab99d4e8d5babb3dc6b1adaec"
cloudflared_domain: "nwlnexus.net"
cloudflared_bootstrap_only: true
cloudflared_ingress_hostname: "ing.mgmt.nwlnexus.net"
cloudflared_catch_all_service: "https://traefik.kube-system:443"

# GitOps mode — push creds to 1Password via op CLI + service-account token
# (/etc/olympus/op-service-account-token, already on every host).
cloudflared_op_enabled: true
cloudflared_op_vault: "Dev"
cloudflared_op_item_title: "management-hub-cloudflared"

# 1Password Connect — still managed by Ansible (prerequisite for ESO)
onepassword_connect_state: present
eso_bootstrap_state: present
eso_kubeconfig_path: /etc/rancher/k3s/k3s.yaml

# --- Flux kubeconfig export to 1Password ---
# Uploads a patched kubeconfig (Tailscale IPv4 as server, proper context/cluster/user names)
# so the kubeconfig-merger can include management-hub in the Headlamp combined kubeconfig.
flux_kubeconfig_1password_item: "management-hub-kubeconfig"
flux_kubeconfig_1password_vault: "Dev"
flux_kubeconfig_context_name: "management-hub"
# External server left empty: flux role auto-resolves to Tailscale IPv4 (already in k3s TLS SAN)
flux_kubeconfig_external_server: ""
flux_kubeconfig_external_port: 6443
flux_kubeconfig_insecure_tls: false
flux_kubeconfig_path: "/etc/rancher/k3s/k3s.yaml"

# Unifi DNS policy (media.nwlnexus.io → management-hub LAN IP) must be configured
# manually in the Unifi UI — the DNS Policy API requires Ubiquiti account session auth
# and is not accessible for server-to-server calls from the local network.

# ddclient — no extra public records needed; Plex external URL is via Tailscale Funnel
ddclient_state: present

# --- ansible-pull (pull-mode self-management) ---
ansible_pull_state: present
ansible_pull_inventory: inventory/management-hub.yml
ansible_pull_playbook: playbooks/pull/olympus.yml
ansible_pull_interval: "1h"
ansible_pull_interval_seconds: 3600

# iSCSI host prereqs — Trident CSI driver manages login/CHAP; Ansible sets initiator name only
iscsi_state: present
iscsi_mode: csi_node

# Atlas daemon
atlas_state: present
