---
# mmini-01-vm - Linux arm64 VM on the Mac mini mmini-01 (olympus-sdk#694, H20).
# Group vars: group_vars/k3s_mac_agents.yml.
#
k3s_node_ip: "192.168.253.17"
k3s_mac_host: mmini-01

# atlas converge manages these roles here; baseline skips exactly the tasks each replaces
# (map: roles/baseline/tasks/linux.yml). Group rollout of the converge takeover, olympus-sdk#341.
converge_managed_roles:
  - sshd
  - unattended-upgrades
  - fail2ban
  - timesync
  - base-packages
  - base-sysctl
  - motd
  - ansible-account
