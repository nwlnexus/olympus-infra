---
# naraka-01 — k3s agent (most of its vars: group_vars/management-hub.yml).
# LAN IP: 192.168.253.14 (bond0)
#
# These live in host_vars so that both the pull inventory
# (inventory/management-hub.yml) and the push inventory (inventory/olympus.yml,
# where naraka-01 is in k3s_agents, not management-hub) see them.

# Pinned as node-ip in /etc/rancher/k3s/config.yaml (k3s role, tasks/node-ip.yml).
# Must match the DHCP reservation for this node on the router.
k3s_node_ip: "192.168.253.14"

# Networking (Ubuntu 26.04 since 2026-10-04). bond0's MAC is pinned to the MAC
# it already had (the one the router hands this address to) in the
# hand-managed /etc/netplan/60-naraka-bond-mac.yaml, so a release upgrade or a
# systemd MAC-policy change can't give bond0 a new MAC and a new address (what
# happened to styx). The same file turns off DHCP on the unplugged eno1.
#
# baseline role, tasks/k8s-network.yml. No carrier-loss drop-in: netplan
# renders bond0 with ConfigureWithoutCarrier=yes, which already implies
# IgnoreCarrierLoss=yes (no time limit).
baseline_k8s_node_network: true

# Node hardening (baseline role, tasks/node-hardening.yml): sshd drop-in read before
# cloud-init's, key-only ansible account, pod-bridge IPv6 isolation. Rolled out one
# node at a time: naraka-01 first (2026-10-19), then onode-0314ac, onode-0312ce,
# onode-030c31, verifying after each.
baseline_node_hardening: true
