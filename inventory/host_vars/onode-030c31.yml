---
# onode-030c31 — k3s primary / cluster-init node
# LAN IP: 192.168.253.7

k3s_primary: true
k3s_init: true   # runs --cluster-init; only one node in the cluster should have this

# Pinned as node-ip in /etc/rancher/k3s/config.yaml (k3s role, tasks/node-ip.yml).
# Must match the DHCP reservation for this node on the router.
k3s_node_ip: "192.168.253.7"

tailscale_hostname: onode-030c31
ddclient_extra_fqdns:
  - onode-030c31.nwlnexus.net

# First rollout: also keep the cluster-scoped roles out of the hourly run on
# the primary until each has been run deliberately by hand:
#   qnap-csi-bootstrap — git checkout in /opt/qnap-csi-plugin has local edits
#   cloudflared-k8s    — re-applies the tunnel config each run (it only reads the
#                        1Password item since olympus-sdk#1000)
#   eso-bootstrap      — one-time seed (secret already exists); re-applies the
#                        Connect token secret (skips itself if the token
#                        cannot be read)
# Host value replaces the group value, so `common` is repeated here.
ansible_pull_skip_tags: common,qnap-csi-bootstrap,cloudflared-k8s,eso-bootstrap

# Node hardening (baseline role, tasks/node-hardening.yml); rolled out one node at a
# time: naraka-01, onode-0314ac, onode-0312ce, then this node (last: cluster-init/primary).
baseline_node_hardening: true

# KVM CI node: nested virtualization off (security review #394 m6).
baseline_kvm_amd_nested_off: true

# atlas converge manages these roles here; baseline skips exactly the tasks each replaces
# (map: roles/baseline/tasks/linux.yml). Group rollout of the converge takeover, olympus-sdk#341.
converge_managed_roles:
  - sshd
  - unattended-upgrades
  - fail2ban
  - timesync
  - base-packages
  - base-sysctl
  - motd
  - ansible-account
