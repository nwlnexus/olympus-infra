---
# onode-030c31 — k3s primary / cluster-init node
# LAN IP: 192.168.253.7

k3s_primary: true
k3s_init: true   # runs --cluster-init; only one node in the cluster should have this

# Pinned as node-ip in /etc/rancher/k3s/config.yaml (k3s role, tasks/node-ip.yml).
# Must match the DHCP reservation for this node on the router.
k3s_node_ip: "192.168.253.7"

tailscale_hostname: onode-030c31
ddclient_extra_fqdns:
  - onode-030c31.nwlnexus.net

# First rollout: also keep the cluster-scoped roles out of the hourly run on
# the primary until each has been run deliberately by hand:
#   qnap-csi-bootstrap — git checkout in /opt/qnap-csi-plugin has local edits
#   1password-connect  — `helm upgrade --install --wait` of the live release
#   cloudflared-k8s    — rewrites the 1Password item / tunnel config each run
#   eso-bootstrap      — one-time seed (secret already exists); re-applies the
#                        Connect token secret and `meta: end_host`s the whole
#                        play if the token cannot be read
# Host value replaces the group value, so `common` is repeated here.
ansible_pull_skip_tags: common,qnap-csi-bootstrap,1password-connect,cloudflared-k8s,eso-bootstrap
