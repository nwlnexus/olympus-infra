---
# onode-0312ce — k3s secondary (non-init) server node
# LAN IP: 192.168.253.8

k3s_primary: false
k3s_init: false

# Pinned as node-ip in /etc/rancher/k3s/config.yaml (k3s role, tasks/node-ip.yml).
# Must match the DHCP reservation for this node on the router.
k3s_node_ip: "192.168.253.8"

tailscale_hostname: onode-0312ce
ddclient_extra_fqdns:
  - onode-0312ce.nwlnexus.net

# Node hardening (baseline role, tasks/node-hardening.yml); rolled out one node at a
# time: naraka-01, onode-0314ac, then this node, then onode-030c31.
baseline_node_hardening: true

# Second KVM CI node (olympus-sdk#460; label node-restriction.kubernetes.io/kvm-ci=true
# is applied by the owner with kubectl): nested virtualization off (security review
# #394 m6). Takes effect when kvm_amd next loads; reload by hand while no VM is running.
baseline_kvm_amd_nested_off: true
