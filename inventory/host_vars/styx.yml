---
# styx — homelab server host vars (pull-mode)
# Push-mode vars live in olympus-sdk/infra/inventories/host_vars/styx/vars.yml

# Hermes per-host token (Phase F onboarding — SP2)
# Issued via: atlas machine create --hostname styx && atlas token issue --hostname styx
# Save the printed token to 1Password at the path below.
# bootstrap-user role fetches this at push-bootstrap time.
hermes_token_op_item: "op://Dev/styx-hermes-token/credential"

# Plex Media Server
plex_state: present

# QNAP NAS MEDIA share mount
nas_media_mount_state: present

# ddclient — tracks styx's LAN IP and publishes media-int.nwlnexus.io for internal Plex access
ddclient_state: present
# ddclient_zone defaults to nwlnexus.net — styx hostname records land there automatically.
# media-int.nwlnexus.io zone is inferred from the FQDN itself (no explicit config needed).
ddclient_extra_fqdns:
  - media-int.nwlnexus.io
