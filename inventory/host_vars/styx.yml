---
# styx — homelab server host vars (pull-mode)
# Push-mode vars live in olympus-sdk/infra/inventories/host_vars/styx/vars.yml

# Plex Media Server
plex_state: present

# iSCSI — QNAP LUN for styx data storage
iscsi_state: present
iscsi_op_item: styx-qnap-iscsi
iscsi_mount_path: /mnt/styx-data
iscsi_mode: host_mount
iscsi_filesystem: ext4

# NFS mounts — managed by nfs-mounts role
nfs_mounts:
  - path: /mnt/media
    op_host_ref: "op://Dev/nas-media-share/host"
    export: /MEDIA
    opts: "nfsvers=4,hard,_netdev,rsize=1048576,wsize=1048576,timeo=600,retrans=2"
    state: present

# ddclient — tracks styx's LAN IP and publishes media-int.nwlnexus.io for internal Plex access
ddclient_state: present
ddclient_extra_fqdns:
  - media-int.nwlnexus.io

# Atlas daemon
atlas_state: present

# ansible-pull — styx keeps its own pull playbook (nfs-mounts/plex are not in
# olympus.yml). The role renders the wrapper with these values and removes the
# legacy `olympus-ansible-pull` crontab entry owned by the ansible user.
ansible_pull_state: present
ansible_pull_inventory: inventory/styx.yml
ansible_pull_playbook: playbooks/pull/styx.yml

# Networking (Ubuntu 26.04 since 2026-10-04). The release upgrade left styx on a
# netplan bond (bond0 over eno2–eno8). bond0's MAC is pinned to eno2's
# permanent MAC in the hand-managed /etc/netplan/60-styx-bond-mac.yaml so DHCP
# keeps handing out the reserved LAN address. PXE dnsmasq binds to whichever
# interface holds pxe_server_ip (now bond0).
# Same host-network hardening as the k3s nodes: wait-online needs only one
# routable IPv4 link (the unplugged NICs made it time out, so iSCSI/NFS mounts
# started before the network at boot), and bond0 keeps its address through a
# short carrier loss. Drop-ins take effect at the next boot; never reload
# systemd-networkd on styx to apply them.
baseline_k8s_node_network: true
baseline_network_ignore_carrier_loss_networks:
  - 10-netplan-bond0

