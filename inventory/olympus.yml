---
# Unified olympus cluster inventory — push-mode (SSH, not ansible-pull).
# Used by push playbooks: playbooks/push/join-naraka-agent.yml, etc.
# The k3s role vars come from group_vars/compute_hub.yml and group_vars/management-hub.yml.
#
# Control-plane: 5 onodes (HA etcd, kube-vip VIP 192.168.253.2); 2 of them in agent_services
# Agent: naraka-01 (128 GB RAM, 4 CPUs; general worker, no taint since olympus-sdk#567)
# Agents, arm64: mmini-01-vm, mmini-02-vm (Tart VMs on the Mac minis; tainted, olympus-sdk#694)
# Data tier: data-hub (macOS, native LaunchDaemons — NOT a k8s node)
# Inference: GEEKOM A9 a9-mega (Ubuntu, tailnet host, NOT a k8s node)
# styx (PXE/Packer) was decommissioned in October 2026 and is no longer listed.

all:
  children:

    # ── k3s control-plane (HA, NVMe, default compute pool) ──────────────────
    compute_hub:
      hosts:
        onode-030c31:
          ansible_host: 192.168.253.7
        onode-0312ce:
          ansible_host: 192.168.253.8
        onode-0314ac:
          ansible_host: 192.168.253.9
      vars:
        ansible_connection: ssh
        ansible_user: ansible
        ansible_ssh_private_key_file: ~/.ssh/ansible
        ansible_python_interpreter: /usr/bin/python3

    # ── k3s agent (naraka-01 — general worker, no placement label/taint) ────
    k3s_agents:
      hosts:
        naraka-01:
          ansible_host: 192.168.253.14
      vars:
        ansible_connection: ssh
        ansible_user: ansible
        ansible_ssh_private_key_file: ~/.ssh/ansible
        ansible_python_interpreter: /usr/bin/python3

    # ── k3s agents, Mac-mini arm64 VMs (olympus-sdk#694, decision H20) ───────
    # One Linux arm64 VM per Mac mini (Tart, bridged NIC on the .253 network).
    # Agents only: never in k3s_servers (no etcd, no control plane). Labelled
    # olympus.io/host=mac-mini and tainted olympus.io/arch=arm64:NoSchedule.
    # Vars: group_vars/k3s_mac_agents.yml. Bootstrapped with bootstrap-host.yml,
    # joined one at a time with playbooks/push/join-k3s-agent.yml.
    # ansible_host follows k3s_node_ip (host_vars); the DHCP reservation sets it.
    k3s_mac_agents:
      hosts:
        mmini-01-vm:
          ansible_host: "{{ k3s_node_ip }}"
        mmini-02-vm:
          ansible_host: "{{ k3s_node_ip }}"
      vars:
        ansible_connection: ssh
        ansible_user: ansible
        ansible_ssh_private_key_file: ~/.ssh/ansible
        ansible_python_interpreter: /usr/bin/python3

    # ── k3s control-plane, second pool (HW9, olympus-sdk#567) ────────────────
    # Two onodes (Ryzen 7 6800U, local NVMe, Ubuntu 26.04) that join as HA
    # SERVERS (embedded etcd grows 3 -> 5) but carry the agent-services label +
    # NoSchedule taint, so only workloads pinned to them (memory, inference)
    # run there; the ARC runners stay on compute_hub (olympus-sdk#567). A group of its own, NOT compute_hub: see the header
    # of group_vars/agent_services.yml. Joined one at a time with
    # playbooks/push/join-k3s-server.yml; never with cluster-init.
    agent_services:
      hosts:
        onode-0636e4:
          ansible_host: 192.168.253.11
        onode-062caa:
          ansible_host: 192.168.253.12
      vars:
        ansible_connection: ssh
        ansible_user: ansible
        ansible_ssh_private_key_file: ~/.ssh/ansible
        ansible_python_interpreter: /usr/bin/python3

    # ── Data tier (data-hub — macOS data services, NOT a k8s node) ────────────
    data_services:
      hosts:
        data-hub:
          ansible_host: 100.95.232.41   # Tailscale IP (MagicDNS: data-hub)
      vars:
        ansible_connection: ssh
        ansible_user: nwilliams-lucas
        ansible_ssh_private_key_file: ~/.ssh/ansible
        ansible_python_interpreter: /usr/bin/python3

    # Same host again, as the group that inventory/group_vars/data_hub.yml targets
    # (the serving profile: Ollama + LiteLLM vars). Kept separate from `data_services`
    # so the vars follow the host, not this push-only grouping.
    data_hub:
      hosts:
        data-hub:

    # ── Inference (GEEKOM A9 - llama-server, NOT a k8s node) ─────────────────
    # a9-mega: LAN address for push runs; vars: inventory/group_vars/inference_server.yml.
    inference_server:
      hosts:
        a9-mega:
          ansible_host: 192.168.253.15
      vars:
        ansible_connection: ssh
        ansible_user: ansible
        ansible_ssh_private_key_file: ~/.ssh/ansible
        ansible_python_interpreter: /usr/bin/python3

    # ── Every k3s server (etcd member) ──────────────────────────────────────
    # Parent group only, no group_vars: used where a play must reach ALL
    # servers at once (playbooks/push/kube-vip.yml writes a manifest that must
    # be byte-identical on every server).
    k3s_servers:
      children:
        compute_hub:
        agent_services:
