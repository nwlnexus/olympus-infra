---
# Push-based data services setup for ai-hub.
# Requires: become (sudo) for LaunchDaemon operations, dscl, Homebrew.
# Run from a machine with SSH access to ai-hub and op CLI authenticated.
#
# Usage:
#   ansible-playbook -i inventory/ai-hub.yml \
#     -e "ansible_connection=ssh ansible_host=ai-hub ansible_user=nwilliams-lucas" \
#     playbooks/data-services.yml
- name: Configure ai-hub data services
  hosts: ai-hub
  become: true
  gather_facts: true
  roles:
    - data-services
