---
# Pull-mode playbook for styx.
# Runs hourly as the `ansible` user via the ansible-pull systemd timer
# (/opt/ansible-pull/ansible-pull-run). The ansible-pull role below keeps the
# wrapper/timer current and removes the legacy 02:00 crontab entry, so the
# timer is the only scheduler.

- name: Styx — Drift Correction
  hosts: styx
  gather_facts: true

  pre_tasks:
    - name: Fetch olympus inventory from Hermes
      ansible.builtin.import_tasks: "{{ playbook_dir }}/../../roles/baseline/tasks/olympus-inventory.yml"
      tags: [always, olympus-inventory]

  roles:
    - role: baseline
      tags: [baseline]

    - role: ansible-pull
      tags: [ansible-pull]

    - role: iscsi
      tags: [iscsi]
      when: iscsi_state is defined

    - role: nfs-mounts
      tags: [nfs-mounts]
      when: nfs_mounts | default([]) | length > 0

    - role: plex
      tags: [plex]
      when: plex_state is defined

    - role: atlas
      tags: [atlas]
      when: atlas_state is defined

    - role: ddclient
      tags: [ddclient]
      when: ddclient_state is defined

    # ── Hermes ENC (must be LAST — appends roles, never displaces) ───────────
    - role: hermes-classify-include
      tags: [hermes-classify]
