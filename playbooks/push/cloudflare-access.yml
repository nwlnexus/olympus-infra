---
# Cloudflare Access for every application in cloudflare_access_applications (role roles/cloudflare-access,
# defaults there): the memory gateway https://memory.nwlnexus.io (olympus-sdk#736) and the read-only
# Kubernetes MCP backend https://k8s-mcp.nwlnexus.io (olympus-sdk#916). API calls only, from the controller:
# no host is touched, no kubectl. Runbook: olympus-sdk docs/runbooks/memory-access-service-tokens.md.
#
# Prerequisites (owner):
#   - 1Password CI/cloudflare-account field `access_api_token` (an account-owned token: verify it at
#     /accounts/<id>/tokens/verify, not /user/tokens/verify): a Cloudflare API token with the
#     permissions listed in roles/cloudflare-access/defaults/main.yml (Access apps/policies and service
#     tokens Edit, Access organizations Read, Tunnel Edit, DNS Edit + Zone Read on nwlnexus.io and on the
#     DNS zone of every other application; with the
#     MCP portal on, also MCP Portals Edit, which the API calls "MCP Portals Write" and which covers both
#     the portals and the servers endpoints).
#   - OP_SERVICE_ACCOUNT_TOKEN exported and `op` on PATH (the account must be able to write vault Dev).
#   - The owner e-mail, passed on the command line (never committed: this repository is public).
#
# Dry run (reads everything, writes nothing, prints the plan):
#   ansible-playbook playbooks/push/cloudflare-access.yml --check \
#     -e '{"cloudflare_access_owner_emails": ["OWNER@EXAMPLE"]}'
# Apply:
#   ansible-playbook playbooks/push/cloudflare-access.yml \
#     -e '{"cloudflare_access_owner_emails": ["OWNER@EXAMPLE"]}'
# The last task prints, per application and labelled with its name, the team domain and the application
# AUD its backend needs, and where they go:
#   memory:  MEMORY_ACCESS_TEAM_DOMAIN / MEMORY_ACCESS_AUD into olympus-gitops
#            clusters/olympus/memory/gateway/gateway.yaml, and each token's client id for its gateway client row;
#   k8s-mcp: the `k8s-mcp-proxy` container env in the olympus-gitops `atlas-system` manifests
#            (ACCESS_TEAM_DOMAIN, ACCESS_AUD). Commit them there; the proxy rejects every request until they match.
# k8s-mcp is the MCP server `k8s` in the owner and hosts portals (olympus-sdk#929): its DCR redirect URIs
# carry the portal callbacks set below (cloudflare_access_k8s_mcp_portal_callback_uris). It uses the same
# session and grant lifetimes as memory (owner-only, read-only backend); set the per-application keys to
# tighten them.
#
# Add an application: add a dict to cloudflare_access_applications in roles/cloudflare-access/defaults/main.yml
# (copy cloudflare_access_k8s_mcp_app: name, domain, policy_prefix, tunnel_service; service_token_hosts empty
# unless hosts need tokens), make sure the API token has DNS Edit + Zone Read on its zone, then run the dry
# run above and read the plan (one new allow-owner policy, the application, one tunnel rule, one CNAME), then
# apply, and paste the printed team domain and AUD into the backend's manifest in olympus-gitops.
# Removing an entry deletes nothing (application, policies, tokens, DNS record and tunnel rule stay): delete
# those by hand in the dashboard.
#
# Rotate one host's secret (same client id; the old secret stays valid 24 h unless grace is 0):
#   ansible-playbook playbooks/push/cloudflare-access.yml -e '{"cloudflare_access_owner_emails": [...],
#     "cloudflare_access_rotate_hosts": ["NWL-MBM2"]}'
# Extend one host's token by a year: cloudflare_access_refresh_hosts instead.
# Take the public path down (Access stays): -e cloudflare_access_tunnel_enabled=false (every application;
# for one, set tunnel_enabled: false on its entry).
#
# Owner MCP server portal https://mcp.nwlnexus.io/mcp in front of the gateway (olympus-sdk#923). Applied in
# production on 2026-11-10, so this playbook turns it on (the role default stays off). Every command above
# manages the portal too; -e cloudflare_access_mcp_portal_enabled=false leaves it out, but then the memory
# application's redirect URIs lose the portal callbacks and the portal's server can no longer re-authenticate.
# The first apply creates the MCP server, the portal, their two Access applications and the CNAME, and
# adds the portal callbacks to the memory application's redirect URIs. Then authenticate the server in
# Zero Trust > Access controls > AI controls > MCP servers > memory, and re-run: the tool curation
# (forget off) can only be applied once the server's tools have synced.
# Runbook: olympus-sdk docs/runbooks/mcp-portal.md.
#
# MCP server `k8s` (https://k8s-mcp.nwlnexus.io/mcp, read-only) and the hosts portal
# https://mcp-hosts.nwlnexus.io/mcp (k8s only, Claude Code only), olympus-sdk#929: the first apply after #929
# creates the server, its `mcp` application, the hosts portal, its `mcp_portal` application and CNAME, adds k8s
# to the owner portal (memory and its curation unchanged) and the portal callbacks to the k8s-mcp
# application's redirect URIs. Then authenticate the server in Zero Trust > Access controls > AI controls >
# MCP servers > k8s, and re-run (nothing of k8s is turned off, so the re-run normally writes nothing).
#
# MCP server `cluster` (https://cluster-mcp.nwlnexus.io/mcp, read-only Hermes cluster state), olympus-sdk#921:
# an edge Worker host (origin worker), so the first apply after #921 creates its Access application and
# allow-owner policy but no tunnel rule and no CNAME (the Worker's custom domain owns DNS), then the server
# and its `mcp` application, and adds it to the owner and hosts portals. Paste the printed AUD into
# CLUSTER_MCP_ACCESS_AUD in olympus-sdk packages/iris/wrangler.jsonc (vars) and deploy; until then the host
# answers 503. Then authenticate the server in Zero Trust > Access controls > AI controls > MCP servers >
# cluster, and re-run.

- name: Cloudflare Access applications (memory gateway, Kubernetes MCP backend, cluster MCP backend)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # Same account as cloudflared_account_id in inventory/group_vars/compute_hub.yml (tests check it).
    cloudflare_access_account_id: "1b15dcdab99d4e8d5babb3dc6b1adaec"
    # The owner MCP portal is live (olympus-sdk#923): keep managing it on every run.
    cloudflare_access_mcp_portal_enabled: true
    # The k8s-mcp backend's DCR must allow the dashboard callback for server id k8s and the per-user callback
    # of both portals that hold it (olympus-sdk#929); without them authenticating the server fails.
    cloudflare_access_k8s_mcp_portal_callback_uris:
      - "https://dash.cloudflare.com/{{ cloudflare_access_account_id }}/one/access-controls/ai-controls/mcp-server/oauth-callback/k8s"
      - "https://{{ cloudflare_access_mcp_hosts_portal_hostname }}/servers-callback"
      - "https://{{ cloudflare_access_mcp_portal_hostname }}/servers-callback"
    # The same for the cluster-mcp backend, server id cluster (olympus-sdk#921).
    cloudflare_access_cluster_mcp_portal_callback_uris:
      - "https://dash.cloudflare.com/{{ cloudflare_access_account_id }}/one/access-controls/ai-controls/mcp-server/oauth-callback/cluster"
      - "https://{{ cloudflare_access_mcp_hosts_portal_hostname }}/servers-callback"
      - "https://{{ cloudflare_access_mcp_portal_hostname }}/servers-callback"
  roles:
    - role: cloudflare-access
      tags: [cloudflare-access]
