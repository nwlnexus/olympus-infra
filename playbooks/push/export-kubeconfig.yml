---
# Owner-run: export the compute-hub admin kubeconfig to 1Password Dev/compute-hub-kubeconfig, the
# owner's break-glass cluster access (olympus-sdk#413). Fleet hosts never write to 1Password
# (olympus-sdk#1000): the HA primary only hands its /etc/rancher/k3s/k3s.yaml to the controller (slurp,
# become), and the controller patches it (server URL, context/cluster/user names) and writes the document
# with your own `op` sign-in. Tasks: roles/k3s/tasks/kubeconfig-export.yml.
#
# When: the admin client cert in that kubeconfig (k3s client-admin.crt, CN system:admin) is valid for one
# year and k3s renews it on a restart in its last 120 days. Re-export after a renewal and always before the
# exported cert's notAfter (the cert on the primary on 2026-11-17: notAfter 2027-04-09).
#
# Prerequisites: SSH to the primary as `ansible` (inventory/olympus.yml) and `op` signed in as an account
# that can write vault Dev (your own `op signin`). Agent hosts have no cluster admin (olympus-sdk#935), so
# this runs from an owner workstation.
#
# Dry run (reads the kubeconfig and checks the document, writes nothing), then apply:
#   env -u OP_CONNECT_HOST -u OP_CONNECT_TOKEN -u OP_SERVICE_ACCOUNT_TOKEN ansible-playbook -i inventory/olympus.yml playbooks/push/export-kubeconfig.yml --check
#   env -u OP_CONNECT_HOST -u OP_CONNECT_TOKEN -u OP_SERVICE_ACCOUNT_TOKEN ansible-playbook -i inventory/olympus.yml playbooks/push/export-kubeconfig.yml

- name: Export the break-glass kubeconfig to 1Password
  hosts: compute_hub
  gather_facts: false
  vars:
    k3s_kubeconfig_export: true
  tasks:
    - name: Export from the HA primary (the controller writes the document)
      ansible.builtin.include_role:
        name: k3s
        tasks_from: kubeconfig-export.yml
      when:
        - k3s_primary | default(false) | bool
        - k3s_kubeconfig_op_item | default('') != ''
