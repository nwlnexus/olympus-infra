---
# Ansible Galaxy collections required by the roles in this repo.
# Install with: ansible-galaxy collection install -r requirements.yml
# The olympus-sdk Makefile (`ansible-deps` target) installs these automatically
# before any push-playbook run, so a fresh mise/ansible-core install self-provisions.
collections:
  # community.general.homebrew (+ homebrew_* modules) — used across the macOS
  # homebrew, ollama, and other ai-hub roles.
  - name: community.general
    version: ">=9.0.0"
  # ansible.posix.* helpers used by the baseline/system roles.
  - name: ansible.posix
    version: ">=1.5.0"
