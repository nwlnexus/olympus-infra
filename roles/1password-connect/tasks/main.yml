---
- name: Set 1password-connect state
  ansible.builtin.set_fact:
    _1pw_state: "{{ onepassword_connect_state | default('present') }}"

- name: Check credentials file
  ansible.builtin.stat:
    path: "{{ onepassword_connect_credentials_file }}"
  register: creds_file
  become: true
  when: _1pw_state == 'present'

# Skip the rest of this role with a `when` on a static import, not `meta: end_host`
# / `end_play`: those end the whole play for the host, so every later role in
# playbooks/pull/olympus.yml was skipped too (olympus-sdk#703). `meta: end_role`
# needs ansible-core 2.18, newer than the distro ansible on the Linux pull hosts.
- name: Decide whether to skip (credentials file missing)
  ansible.builtin.set_fact:
    _1pw_skip: >-
      {{ _1pw_state == 'present' and
         (not creds_file.stat.exists or creds_file.stat.size == 0) }}

- name: 1password-connect — install or remove
  ansible.builtin.import_tasks: install.yml
  when: not (_1pw_skip | default(false) | bool)
