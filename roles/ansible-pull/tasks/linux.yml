---
- name: Install ansible (Linux)
  ansible.builtin.apt:
    name:
      - ansible
      - git
    state: "{{ 'present' if ansible_pull_state == 'present' else 'absent' }}"
    update_cache: true
  become: true

# The wrapper needs jq + curl for Hermes classify. Never removed on absent:
# other tooling depends on them.
- name: Install wrapper dependencies (Linux)
  ansible.builtin.apt:
    name:
      - jq
      - curl
    state: present
  become: true
  when: ansible_pull_state == 'present'

# Exactly one scheduler per host: remove legacy `olympus-ansible-pull` cron
# entries from older cron-based deployments (e.g. styx ran the pull playbook
# from the ansible user's crontab alongside the systemd timer). Owners come
# from `ansible_pull_legacy_users` (default: the service user and root).
# Idempotent; a user without a crontab, or that does not exist, is a no-op.
- name: Remove legacy ansible-pull cron from old owners (one-shot migration)
  ansible.builtin.cron:
    name: olympus-ansible-pull
    user: "{{ item }}"
    state: absent
  loop: "{{ ansible_pull_legacy_users }}"
  become: true
  when: ansible_pull_state == "present"

# ── present path ──────────────────────────────────────────────────────────────

# The log directory is handled in main.yml.
- name: Ensure /opt/ansible-pull exists
  ansible.builtin.file:
    path: /opt/ansible-pull
    state: directory
    owner: "{{ ansible_pull_user }}"
    group: "{{ ansible_pull_user }}"
    mode: '0750'
  become: true
  when: ansible_pull_state == 'present'

- name: Install play-recap parser
  ansible.builtin.copy:
    src: parse-play-recap.sh
    dest: /opt/ansible-pull/parse-play-recap.sh
    owner: "{{ ansible_pull_user }}"
    group: "{{ ansible_pull_user }}"
    mode: '0750'
  become: true
  when: ansible_pull_state == 'present'

- name: Deploy ansible-pull-run wrapper script
  ansible.builtin.template:
    src: ansible-pull-run.j2
    dest: /opt/ansible-pull/ansible-pull-run
    owner: "{{ ansible_pull_user }}"
    group: "{{ ansible_pull_user }}"
    mode: '0750'
  become: true
  when: ansible_pull_state == 'present'

- name: Deploy ansible-pull systemd service unit
  ansible.builtin.template:
    src: ansible-pull.service.j2
    dest: /etc/systemd/system/ansible-pull.service
    owner: root
    group: root
    mode: '0644'
  become: true
  when: ansible_pull_state == 'present'

- name: Deploy ansible-pull systemd timer unit
  ansible.builtin.template:
    src: ansible-pull.timer.j2
    dest: /etc/systemd/system/ansible-pull.timer
    owner: root
    group: root
    mode: '0644'
  become: true
  when: ansible_pull_state == 'present'

# daemon_reload applies changed unit/timer files to an active timer; no
# restart needed. ansible_pull_timer_state=stopped lets an operator install
# or upgrade the wrapper without arming the schedule (first-run gating); the
# next run of the service with the default re-enables it.
- name: Reload systemd and set ansible-pull timer state
  ansible.builtin.systemd:
    name: ansible-pull.timer
    state: "{{ ansible_pull_timer_state }}"
    enabled: "{{ ansible_pull_timer_state == 'started' }}"
    daemon_reload: true
  become: true
  when: ansible_pull_state == 'present'

# ── absent path ───────────────────────────────────────────────────────────────

- name: Stop and disable ansible-pull timer (state=absent)
  ansible.builtin.systemd:
    name: ansible-pull.timer
    state: stopped
    enabled: false
    daemon_reload: true
  become: true
  failed_when: false
  when: ansible_pull_state == 'absent'

- name: Remove ansible-pull wrapper and unit files (state=absent)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/ansible-pull/ansible-pull-run
    - /etc/systemd/system/ansible-pull.service
    - /etc/systemd/system/ansible-pull.timer
  become: true
  when: ansible_pull_state == 'absent'

- name: Ensure /etc/olympus exists
  ansible.builtin.file:
    path: /etc/olympus
    state: directory
  become: true
  when: ansible_pull_state == "present"

- name: Write managed-by marker for atlas inventory
  ansible.builtin.template:
    src: managed-by.json.j2
    dest: /etc/olympus/managed-by
    owner: root
    mode: "0644"
  become: true
  when: ansible_pull_state == "present"

# After removal, /etc/olympus/hermes-token (if present) still counts as
# fallback evidence of Ansible management in the atlas host inventory.
- name: Remove managed-by marker (state=absent)
  ansible.builtin.file:
    path: /etc/olympus/managed-by
    state: absent
  become: true
  when: ansible_pull_state == "absent"
