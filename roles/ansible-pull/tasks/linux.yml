---
- name: Install ansible (Linux)
  ansible.builtin.apt:
    name:
      - ansible
      - git
    state: "{{ 'present' if ansible_pull_state == 'present' else 'absent' }}"
    update_cache: true
  become: true

- name: Remove legacy ansible-pull cron from old owners (one-shot migration)
  ansible.builtin.cron:
    name: olympus-ansible-pull
    user: "{{ item }}"
    state: absent
  loop: "{{ ansible_pull_legacy_users }}"
  when:
    - ansible_pull_state == "present"
    - ansible_pull_user != item
  become: true

- name: Schedule ansible-pull via crontab (Linux)
  ansible.builtin.cron:
    name: olympus-ansible-pull
    user: "{{ ansible_pull_user }}"
    hour: "{{ ansible_pull_hour }}"
    minute: "{{ ansible_pull_minute }}"
    job: >-
      {{ ansible_pull_bin_linux }}
      -U {{ ansible_pull_repo }}
      -i {{ ansible_pull_inventory }}
      {{ ansible_pull_playbook }}
      >> {{ ansible_pull_log_file }} 2>&1
    state: "{{ ansible_pull_state }}"
  become: true
