---
- name: Install ansible via Homebrew (macOS)
  community.general.homebrew:
    name:
      - ansible
      - git
    state: "{{ 'present' if ansible_pull_state == 'present' else 'absent' }}"

- name: Ensure /opt/ansible-pull directory exists (macOS)
  ansible.builtin.file:
    path: /opt/ansible-pull
    state: directory
    owner: "{{ ansible_pull_user }}"
    group: admin
    mode: "0750"
  become: true
  when: ansible_pull_state == "present"

- name: Deploy ansible-pull-run wrapper script (macOS)
  ansible.builtin.template:
    src: ansible-pull-run.j2
    dest: /opt/ansible-pull/ansible-pull-run
    owner: "{{ ansible_pull_user }}"
    group: admin
    mode: "0750"
  become: true
  when: ansible_pull_state == "present"

- name: Deploy parse-play-recap helper (macOS)
  ansible.builtin.copy:
    src: parse-play-recap.sh
    dest: /opt/ansible-pull/parse-play-recap.sh
    owner: "{{ ansible_pull_user }}"
    group: admin
    mode: "0750"
  become: true
  when: ansible_pull_state == "present"

- name: Install ansible-pull LaunchDaemon plist (macOS)
  ansible.builtin.template:
    src: ansible-pull.plist.j2
    dest: /Library/LaunchDaemons/com.olympus.ansible-pull.plist
    owner: root
    group: wheel
    mode: "0644"
  become: true
  notify: Reload ansible-pull LaunchDaemon
  when: ansible_pull_state == "present"

- name: Load ansible-pull LaunchDaemon (macOS)
  ansible.builtin.command: >
    launchctl load -w /Library/LaunchDaemons/com.olympus.ansible-pull.plist
  become: true
  changed_when: true
  failed_when: false
  when: ansible_pull_state == "present"

- name: Unload ansible-pull LaunchDaemon (macOS)
  ansible.builtin.command: >
    launchctl unload -w /Library/LaunchDaemons/com.olympus.ansible-pull.plist
  become: true
  failed_when: false
  changed_when: true
  when: ansible_pull_state == "absent"

- name: Remove ansible-pull LaunchDaemon plist (macOS)
  ansible.builtin.file:
    path: /Library/LaunchDaemons/com.olympus.ansible-pull.plist
    state: absent
  become: true
  when: ansible_pull_state == "absent"
