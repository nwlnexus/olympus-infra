---
atlas_state: present
atlas_server: https://api.nwlnexus.io
atlas_install_url: https://dl.nwlnexus.io/releases/atlas/install.sh
atlas_op_bootstrap_key_ref: "op://CI/hermes-secrets/bootstrap-key"
# 1Password service-account token locations, checked in order. bootstrap-user and
# playbooks/push/place-op-token.yml place it in /etc/olympus. The old image copy in
# /opt/ansible-pull is removed by the ansible-pull role (olympus-sdk#1000).
atlas_op_token_files:
  - /etc/olympus/op-service-account-token
atlas_user: atlas
atlas_home: /var/lib/atlas
