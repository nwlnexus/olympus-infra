---
# baseline role — security defaults for any Linux host under ansible-pull.
# Linux-only; macOS hosts that include this role short-circuit to a no-op.

baseline_state: present

# Firewall — opt-in. Cluster hosts (k3s, OrbStack) keep this false to
# avoid breaking pod-to-pod traffic; non-cluster hosts (styx) flip it on.
baseline_firewall_enabled: false
baseline_firewall_allow_from_tailnet_only: true
baseline_firewall_extra_ports: []         # list of "{port}/{tcp|udp}"

# LAN-scoped firewall rules (source CIDR limited — not world-open, not tailnet-only)
baseline_firewall_lan_cidr: "192.168.253.0/24"
baseline_firewall_lan_extra_ports: []   # list of "{port}/{tcp|udp}"

# k3s node networking (tasks/k8s-network.yml) — opt-in, Linux k3s nodes only:
# cloud-init network config off, CNI links unmanaged by networkd, carrier-loss
# drop-ins, and a wait-online override. Never reloads networkd (see the task
# file): the networkd changes take effect at the next reboot.
baseline_k8s_node_network: false
# Netplan-generated .network names (without the suffix) that get an
# IgnoreCarrierLoss drop-in, e.g. ["10-netplan-id0"].
baseline_network_ignore_carrier_loss_networks: []
baseline_network_ignore_carrier_loss: "10min"

# Hostname enforcement — opt-in. Most hosts let the cloud-init/OS keep
# the hostname; this is here for fresh-from-PXE provisioning later.
baseline_set_hostname: false

# Unattended upgrades
baseline_unattended_auto_reboot: true
baseline_unattended_auto_reboot_time: "03:00"

# SSH hardening
baseline_ssh_permit_root_login: "no"
baseline_ssh_password_auth: "no"
baseline_ssh_max_auth_tries: 3

# 1Password — ansible user SSH public key
# Set baseline_op_ssh_pubkey_item to the 1Password item ID to enable key provisioning.
# The community.general.onepassword lookup handles spaces in field names natively.
baseline_op_token_file: /etc/olympus/op-service-account-token
baseline_op_ssh_pubkey_item: ""          # 1Password item ID; empty = skip key provisioning
baseline_op_ssh_pubkey_field: "public key"
baseline_op_ssh_pubkey_vault: "Dev"

# 1Password CLI install
baseline_op_cli_arch: amd64
# 1Password CLI apt channel: "beta" (needed for 1Password Environments) or "stable".
# The package is kept at the latest version in the chosen channel.
baseline_op_cli_channel: beta

# fail2ban
baseline_fail2ban_bantime: "1h"
baseline_fail2ban_findtime: "10m"
baseline_fail2ban_maxretry: 5

# NTP
baseline_ntp_servers:
  - time.cloudflare.com
  - time.google.com

# Node hardening (tasks/node-hardening.yml) — opt-in PER HOST so it can be rolled
# out one node at a time and verified before the next. Enabling it:
#   - writes the sshd hardening drop-in as 00-olympus-baseline.conf so it sorts
#     BEFORE cloud-init's 50-cloud-init.conf (sshd uses the first value it reads;
#     the old 99-baseline.conf lost to `PasswordAuthentication yes`), removes the
#     old 99 file, and asserts the EFFECTIVE `sshd -T` values match;
#   - sets the `ansible` account's password to `*` (key-only; unlike `passwd -l`
#     it does not lock the account for sshd, so key and tailnet logins keep working);
#   - on k3s nodes (baseline_k8s_node_network): drops IPv6 from the pod bridge, see
#     files/olympus-cni-ipv6-drop (pods otherwise reach the node's sshd/kubelet/apiserver
#     and same-node pods over fe80:: with no NetworkPolicy, because kube-router only
#     programs IPv4).
baseline_node_hardening: false
baseline_node_hardening_ssh_dropin: 00-olympus-baseline.conf
