---
galaxy_info:
  author: Olympus Infrastructure Team
  description: Security baseline for Linux hosts under ansible-pull management
  company: Olympus Organization
  license: MIT
  min_ansible_version: "2.12"
  platforms:
    - name: Ubuntu
      versions:
        - jammy
        - noble
  galaxy_tags:
    - system
    - security
    - hardening
    - baseline

dependencies: []
# Intentionally no dependency on `common` — baseline stands alone. The
# `common` role has bit-rotted code paths (NTP/timesyncd conflict, missing
# templates, etc.) tracked separately. Hosts that want common's behavior
# should include it explicitly in their playbook.

collections:
  - ansible.posix
  - community.general
