---
# Linux-only — macOS hosts get a separate baseline later.

# Skip the rest of this role with a `when` on a static import, not `meta: end_host`
# / `end_play`: those end the whole play for the host, so every later role in
# playbooks/pull/olympus.yml was skipped too (olympus-sdk#703). `meta: end_role`
# needs ansible-core 2.18, newer than the distro ansible on the Linux pull hosts.
- name: baseline — Linux hosts only
  ansible.builtin.import_tasks: linux.yml
  when: ansible_facts['os_family'] != "Darwin"
