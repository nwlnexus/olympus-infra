---
# Fetch olympus inventory vars from Hermes via CF Access service token.
# Writes resolved vars to /etc/ansible/facts.d/olympus_inventory.json
# so they are available as ansible_local.olympus_inventory.* throughout the play.
#
# Safe fallback behaviour:
#   - Hermes reachable + host registered  → cache updated, vars available
#   - Hermes reachable + not registered   → empty vars (unassigned defaults apply)
#   - Hermes unreachable + cache exists   → stale cache used, no changes
#   - Hermes unreachable + no cache       → ansible_local.olympus_inventory undefined;
#                                           playbooks use `| default({})` guards

- name: Ensure facts.d directory exists
  ansible.builtin.file:
    path: /etc/ansible/facts.d
    state: directory
    owner: root
    group: ansible
    mode: '0755'
  become: true

# op read works with OP_SERVICE_ACCOUNT_TOKEN in env (push from laptop) or
# from /etc/olympus/op-service-account-token on the host (ansible-pull mode).
- name: Fetch CF Access client ID from 1Password
  ansible.builtin.shell: |
    if [ -f /etc/olympus/op-service-account-token ]; then
      export OP_SERVICE_ACCOUNT_TOKEN=$(cat /etc/olympus/op-service-account-token)
    fi
    op read "op://Dev/hermes-secrets/cf-access-inventory-client-id"
  delegate_to: localhost
  become: false
  register: _inv_client_id_result
  changed_when: false
  no_log: true
  failed_when: false

- name: Fetch CF Access client secret from 1Password
  ansible.builtin.shell: |
    if [ -f /etc/olympus/op-service-account-token ]; then
      export OP_SERVICE_ACCOUNT_TOKEN=$(cat /etc/olympus/op-service-account-token)
    fi
    op read "op://Dev/hermes-secrets/cf-access-inventory-client-secret"
  delegate_to: localhost
  become: false
  register: _inv_client_secret_result
  changed_when: false
  no_log: true
  failed_when: false

- name: Set CF Access credential facts
  ansible.builtin.set_fact:
    _inv_client_id: "{{ _inv_client_id_result.stdout | trim }}"
    _inv_client_secret: "{{ _inv_client_secret_result.stdout | trim }}"
  no_log: true
  when:
    - _inv_client_id_result.rc | default(1) == 0
    - _inv_client_secret_result.rc | default(1) == 0

- name: Resolve inventory vars from Hermes
  ansible.builtin.uri:
    url: "https://api.nwlnexus.io/api/v1/inventory/resolve/{{ inventory_hostname }}"
    headers:
      CF-Access-Client-Id: "{{ _inv_client_id | default('') }}"
      CF-Access-Client-Secret: "{{ _inv_client_secret | default('') }}"
    timeout: 10
    return_content: true
  register: _hermes_inv
  failed_when: false
  ignore_errors: true
  when:
    - _inv_client_id is defined
    - _inv_client_secret is defined

- name: Cache inventory facts locally
  ansible.builtin.copy:
    content: "{{ _hermes_inv.json | to_json }}"
    dest: /etc/ansible/facts.d/olympus_inventory.json
    owner: root
    group: ansible
    mode: '0644'
  become: true
  when:
    - _hermes_inv.status is defined
    - _hermes_inv.status == 200

- name: Reload local facts after cache update
  ansible.builtin.setup:
    filter: ansible_local
  when:
    - _hermes_inv.status is defined
    - _hermes_inv.status == 200

- name: Log inventory fetch result
  ansible.builtin.debug:
    msg: >-
      Olympus inventory:
      {{ ansible_local.olympus_inventory.groups | default([]) | join(', ') or 'no groups' }},
      {{ ansible_local.olympus_inventory.variables | default({}) | length }} vars
  when: ansible_local.olympus_inventory is defined
