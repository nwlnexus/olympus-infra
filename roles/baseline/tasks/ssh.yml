---
# The drop-in name matters: sshd keeps the FIRST value it reads for a keyword, and
# files in sshd_config.d are read in lexical order. 99-baseline.conf therefore lost
# to cloud-init's 50-cloud-init.conf (`PasswordAuthentication yes`) on hosts that have
# it. With baseline_node_hardening the drop-in is 00-olympus-baseline.conf (read
# first) and the old 99 file is removed.
- name: SSH hardening drop-in (legacy name)
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-baseline.conf
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: restart sshd
  when:
    - baseline_state == "present"
    - not (baseline_node_hardening | bool)

- name: SSH hardening drop-in (read before cloud-init's)
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: "/etc/ssh/sshd_config.d/{{ baseline_node_hardening_ssh_dropin }}"
    owner: root
    group: root
    mode: '0644'
  become: true
  notify: restart sshd
  when:
    - baseline_state == "present"
    - baseline_node_hardening | bool

- name: Remove the legacy 99-baseline.conf drop-in (superseded)
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/99-baseline.conf
    state: absent
  become: true
  notify: restart sshd
  when:
    - baseline_state == "present"
    - baseline_node_hardening | bool

- name: Remove SSH hardening drop-ins (state=absent)
  ansible.builtin.file:
    path: "/etc/ssh/sshd_config.d/{{ item }}"
    state: absent
  loop:
    - 99-baseline.conf
    - "{{ baseline_node_hardening_ssh_dropin }}"
  become: true
  notify: restart sshd
  when: baseline_state == "absent"

# Ensure privilege separation dir exists — sshd -t requires it even though
# systemd normally creates it at sshd start via RuntimeDirectory=sshd.
- name: Ensure sshd privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: true
  when: baseline_state == "present"

# Validate AFTER writing — sshd -t reads main config + all drop-ins.
# If invalid, the handler will fail and the running sshd is untouched
# (drop-ins only affect new connections after restart, so existing
# SSH sessions stay alive; you can fix and re-run).
- name: Validate sshd config
  ansible.builtin.command: sshd -t
  changed_when: false
  become: true
  when: baseline_state == "present"

# `sshd -T` computes the effective config from the files on disk, so this proves
# the drop-in actually wins (the old one did not) before the restart handler runs.
- name: Read effective sshd settings
  ansible.builtin.command: sshd -T
  register: _baseline_sshd_effective
  changed_when: false
  become: true
  when:
    - baseline_state == "present"
    - baseline_node_hardening | bool

- name: Assert the effective sshd settings match the baseline
  ansible.builtin.assert:
    that:
      - "('passwordauthentication ' ~ baseline_ssh_password_auth) in _baseline_sshd_effective.stdout_lines"
      - "('permitrootlogin ' ~ baseline_ssh_permit_root_login) in _baseline_sshd_effective.stdout_lines"
    fail_msg: >-
      sshd would still run with a different PasswordAuthentication/PermitRootLogin than the
      baseline ({{ baseline_ssh_password_auth }}/{{ baseline_ssh_permit_root_login }}): another
      drop-in or sshd_config line is read before {{ baseline_node_hardening_ssh_dropin }}.
  when:
    - baseline_state == "present"
    - baseline_node_hardening | bool

- name: Ensure ansible user .local/bin exists
  ansible.builtin.file:
    path: /home/ansible/.local/bin
    state: directory
    owner: ansible
    group: ansible
    mode: '0755'
  become: true
  when: baseline_state == "present"

- name: Read OP service account token
  ansible.builtin.slurp:
    src: "{{ baseline_op_token_file }}"
  register: _baseline_op_sat
  no_log: true
  failed_when: false
  when:
    - baseline_state == "present"
    - baseline_op_ssh_pubkey_item != ""

# argv passes "label=public key" as a single argument — no shell quoting
# or %20 encoding needed for the space in the field name.
- name: Fetch ansible SSH public key from 1Password
  ansible.builtin.command:
    argv:
      - op
      - item
      - get
      - "{{ baseline_op_ssh_pubkey_item }}"
      - "--fields"
      - "label={{ baseline_op_ssh_pubkey_field }}"
      - "--vault"
      - "{{ baseline_op_ssh_pubkey_vault }}"
  environment:
    OP_SERVICE_ACCOUNT_TOKEN: "{{ _baseline_op_sat.content | b64decode | trim }}"
  register: _baseline_ssh_pubkey
  changed_when: false
  no_log: true
  when:
    - baseline_state == "present"
    - baseline_op_ssh_pubkey_item != ""
    - _baseline_op_sat.content is defined

- name: Provision ansible user SSH public key
  ansible.posix.authorized_key:
    user: ansible
    key: "{{ _baseline_ssh_pubkey.stdout | trim }}"
    state: present
  become: true
  when:
    - baseline_state == "present"
    - _baseline_ssh_pubkey.stdout is defined
    - _baseline_ssh_pubkey.stdout | trim | length > 0
  tags: [baseline, baseline-ssh]
