---
- name: Ensure ~/.claude-mem directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude-mem"
    state: directory
    mode: "0700"

- name: Check if settings.json exists
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude-mem/settings.json"
  register: claude_mem_settings_stat

- name: Read existing settings.json
  ansible.builtin.slurp:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude-mem/settings.json"
  register: claude_mem_settings_raw
  when: claude_mem_settings_stat.stat.exists

- name: Set base settings (empty object when file missing)
  ansible.builtin.set_fact:
    claude_mem_current: {}
  when: not claude_mem_settings_stat.stat.exists

- name: Parse existing settings
  ansible.builtin.set_fact:
    claude_mem_current: "{{ claude_mem_settings_raw.content | b64decode | from_json }}"
  when: claude_mem_settings_stat.stat.exists

- name: Merge server-beta keys into settings
  ansible.builtin.set_fact:
    claude_mem_merged: "{{ claude_mem_current | combine({
      'CLAUDE_MEM_RUNTIME': 'server-beta',
      'CLAUDE_MEM_SERVER_BETA_URL': claude_mem_server_url,
      'CLAUDE_MEM_SERVER_BETA_API_KEY': claude_mem_api_key,
      'CLAUDE_MEM_SERVER_BETA_PROJECT_ID': claude_mem_project_id
    }) }}"

- name: Write merged settings.json
  ansible.builtin.copy:
    content: "{{ claude_mem_merged | to_nice_json }}\n"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude-mem/settings.json"
    mode: "0600"
