---
# Cloudflare Access for the applications in cloudflare_access_applications (below): the memory gateway's
# public host (olympus-sdk#736) and the Kubernetes MCP backend (olympus-sdk#916). Memory: findings F4/F8/F12 of the
# #458 review; design docs/superpowers/specs/2026-10-21-memory-gateway-contract-design.md sections 2.3,
# 5.2, 5.6 and 11 in olympus-sdk).
#
# Everything here goes through the Cloudflare API from the controller (no host is touched); per application
# (memory shown, the others the same without tokens unless they list hosts):
#   - one service token per roaming host (`memory-<host>`, 1 year), client id and secret written to the
#     1Password item `memory-access-tokens` (fields `<host>-id`, `<host>-secret`) the nix module reads;
#   - two reusable Access policies, `<prefix>allow-owner` (Allow, owner email) and
#     `<prefix>service-auth` (Service Auth, exactly the tokens above), and no Bypass policy;
#   - the self-hosted Access application on the bare host (every path: /, /mcp, /healthz, /readyz),
#     with Managed OAuth + dynamic client registration for the claude.ai connector;
#   - the tunnel public hostname (one ingress rule, inserted before the catch-all) and its proxied CNAME;
#   - a printed summary per application with its team domain and AUD for the backend's manifest;
#   - opt-in (cloudflare_access_mcp_portal_enabled, olympus-sdk#923, #929): MCP servers (memory, k8s) and
#     server portals (owner: memory + k8s; hosts: k8s), their Access applications, proxied CNAMEs, per-server
#     tool curation, and the portal callbacks in the backends' DCR redirect URIs.
#
# Look-up-before-create everywhere; a second run changes nothing. Reads run in --check, writes do not.
# Run with playbooks/push/cloudflare-access.yml (the header there has the commands).

cloudflare_access_state: present

# --- Cloudflare API token ---------------------------------------------------------------------------
# Explicit override wins; otherwise the community.general.onepassword lookup (OP_SERVICE_ACCOUNT_TOKEN
# in the environment, `op` on PATH), as in roles/cloudflared-k8s. A dedicated token, NOT the
# Tunnel + DNS token of cloudflared-k8s, with these permissions:
#   Account  Access: Apps and Policies       Edit
#   Account  Access: Service Tokens          Edit
#   Account  Access: Organizations, Identity Providers, and Groups  Read   (team domain lookup)
#   Account  Cloudflare Tunnel               Edit   (only for the public hostname rule)
#   Zone     DNS                             Edit   (zone nwlnexus.io, and every application's dns_zone)
#   Zone     Zone                            Read   (zone nwlnexus.io, and every application's dns_zone)
#   Account  MCP Portals                     Edit   (only with cloudflare_access_mcp_portal_enabled; the API
#                                                    reference names it "MCP Portals Write" and it covers both
#                                                    /ai-controls/mcp/portals and /ai-controls/mcp/servers)
# With no token resolvable the role warns and skips (never fails the play).
cloudflare_access_api_token: ""
cloudflare_access_cf_token_op_item: "cloudflare-account"
cloudflare_access_cf_token_op_field: "access_api_token"
cloudflare_access_cf_token_op_vault: "CI"
cloudflare_access_account_id: ""
# Only tests point this elsewhere (a local fake of the API).
cloudflare_access_api_url: "https://api.cloudflare.com/client/v4"

# --- The memory application (cloudflare_access_memory_app below reads these) -------------------------
cloudflare_access_app_name: "memory"
# Bare host = every path (design 6.1: the claude.ai connector URL is the bare host, MCP is also on /).
cloudflare_access_app_domain: "memory.nwlnexus.io"
# Browser/SSO session on the application. The Access JWT the gateway verifies expires with it.
cloudflare_access_session_duration: "24h"
# Identity providers allowed for allow-owner (UUIDs from Zero Trust > Settings > Authentication).
# Empty = every IdP configured in the account. Spec 5.6 names Google: set its id here.
cloudflare_access_allowed_idps: []

# OWNER-SUPPLIED, NOT COMMITTED (this repository is public): the e-mail address(es) the allow-owner
# policy admits. Pass with -e or from olympus-sdk's private vars (see the playbook header). The role
# refuses to run with an empty list, so a missing value can never produce an empty Allow policy.
cloudflare_access_owner_emails: []

# Reusable policies are account-wide (Moneta's application lives in the same account), so the
# spec's `allow-owner` and `service-auth` carry this prefix.
cloudflare_access_policy_prefix: "memory-"

# --- Managed OAuth (spec 2.3 / 11: claude.ai custom connector) ----------------------------------------
# With it on, Access answers a non-browser request without credentials with 401 + WWW-Authenticate
# (OAuth discovery) instead of the 302 login redirect. Browsers still get the 302.
cloudflare_access_managed_oauth: true
cloudflare_access_oauth_allowed_redirect_uris:
  - "https://claude.ai/*"
cloudflare_access_oauth_allow_localhost: false
cloudflare_access_oauth_allow_loopback: false
# Short access token, longer refresh grant (Cloudflare's recommendation for agents); policies are
# re-evaluated at every refresh.
cloudflare_access_oauth_access_token_lifetime: "15m"
cloudflare_access_oauth_grant_session_duration: "336h"

# --- Service tokens (spec 5.6: one per roaming host, 1 year, alert on) -------------------------------
# Host names are the nix flake host names (`d.memory.host`, hosts/ in nix-darwin-hm): they name the
# 1Password fields `<host>-id` / `<host>-secret` and the token `memory-<host>`. Personal hosts only:
# work hosts never talk to this gateway (memory boundary, owner decision).
cloudflare_access_service_token_hosts:
  - ai-agent-host
  - nwl-mstudio
  - NWL-MBM2
cloudflare_access_service_token_name_prefix: "memory-"
cloudflare_access_service_token_duration: "8760h"
# Opt-in maintenance, by host name (see docs/runbooks/memory-access-service-tokens.md in olympus-sdk):
#   rotate:  new client secret, SAME client id (the gateway's client row needs no change); the old
#            secret stays valid for cloudflare_access_rotate_grace_hours (0 = revoke immediately).
#   refresh: extend the expiry by one year, secret unchanged.
cloudflare_access_rotate_hosts: []
cloudflare_access_rotate_grace_hours: 24
cloudflare_access_refresh_hosts: []

# --- 1Password (where the nix module reads the token: op://Dev/memory-access-tokens/<host>-id) -------
cloudflare_access_op_vault: "Dev"
# How the role runs `op` for the item it writes. The op CLI refuses `item create/edit/list` under
# 1Password Connect, and the repos' .envrc exports both Connect and a service account, so the Connect
# variables are dropped for these calls and the service account is used (it needs write access to the
# vault above). The token lookup at the start may still go through Connect.
# stdin is /dev/null: under Ansible stdin is a pipe, and `op item create/edit` then reads it as a JSON
# item template ("invalid JSON in piped input"). /dev/null is a character device, which op treats like a
# terminal. The arguments that follow are passed through "$@" unchanged (no shell parsing of values).
cloudflare_access_op_cmd:
  - sh
  - -c
  - exec env -u OP_CONNECT_HOST -u OP_CONNECT_TOKEN op "$@" </dev/null
  - op
cloudflare_access_op_item: "memory-access-tokens"

# --- Tunnel public hostname and DNS -------------------------------------------------------------------
# One hostname rule on the olympus cluster's remotely managed tunnel, inserted before every other rule;
# the catch-all (Traefik) and the other hostname rules are kept as they are. Direct to the gateway
# Service, not through Traefik: the gateway then has no LAN exposure (Traefik is a LoadBalancer on the
# LAN) and its ingress NetworkPolicy admits the cloudflared pods only.
cloudflare_access_tunnel_enabled: true
cloudflare_access_tunnel_name: "compute-hub"
cloudflare_access_tunnel_service: "http://memory-gateway.memory.svc.cluster.local:80"
# originRequest for the rule. For the TLS option (gitops README, "Public path TLS") this becomes
# {originServerName: ..., caPool: ...} and the service https://.
cloudflare_access_tunnel_origin_request: {}
cloudflare_access_dns_enabled: true
cloudflare_access_dns_zone: "nwlnexus.io"

# --- Applications (olympus-sdk#916) ------------------------------------------------------------------
# Every Access-protected backend is one entry; the role runs the same tasks for each, in list order:
# service tokens (only if `service_token_hosts` is not empty), the reusable policies <policy_prefix>allow-owner
# (always) and <policy_prefix>service-auth (only with service tokens), the self-hosted application with
# Managed OAuth/DCR, its proxied CNAME, and one tunnel rule per entry (all of them, in list order, before
# every other rule and the catch-all, in one configuration write).
#
# The memory entry reads the single-application variables above, so existing invocations, the runbooks and
# their -e overrides keep working unchanged; they are its only source. A new application is a new dict here
# (copy the k8s-mcp one). Keys and their defaults (applied in tasks/compute-applications.yml):
#   name, domain, tunnel_service, policy_prefix         required
#   tunnel_origin_request: {}                           originRequest for its tunnel rule
#   tunnel_enabled: cloudflare_access_tunnel_enabled    false = its tunnel rule is removed (Access stays)
#   dns_zone: cloudflare_access_dns_zone                the API token needs DNS Edit + Zone Read on it
#   dns_comment                                         comment on the CNAME
#   service_token_hosts: []                             one token <service_token_name_prefix><host> each,
#   service_token_name_prefix: <name>-                  stored in 1Password <op_item> (<host>-id/-secret)
#   op_item: <name>-access-tokens
#   oauth_allowed_redirect_uris: cloudflare_access_oauth_allowed_redirect_uris   DCR redirect allow-list
#   oauth_allow_localhost / oauth_allow_loopback: false
#   portal_callback_uris: []                            added to the DCR list while
#                                                       cloudflare_access_mcp_portal_enabled is on
#   backend_env: {team_domain: ACCESS_TEAM_DOMAIN, aud: ACCESS_AUD}   names printed for the backend
#   backend_config: ""                                  where the operator pastes those values
#   session_duration: cloudflare_access_session_duration                    Access session
#   oauth_access_token_lifetime: cloudflare_access_oauth_access_token_lifetime    OAuth access token
#   oauth_grant_session_duration: cloudflare_access_oauth_grant_session_duration  OAuth refresh grant
# cloudflare_access_rotate_hosts / _refresh_hosts are host names; they act on every entry that lists the host.
#
# Removing an entry deletes nothing: its application, policies, tokens, DNS record and tunnel rule stay
# (the rule keeps its place among the unmanaged rules). Delete them by hand in the dashboard.
cloudflare_access_applications:
  - "{{ cloudflare_access_memory_app }}"
  - "{{ cloudflare_access_k8s_mcp_app }}"

cloudflare_access_memory_app:
  name: "{{ cloudflare_access_app_name }}"
  domain: "{{ cloudflare_access_app_domain }}"
  policy_prefix: "{{ cloudflare_access_policy_prefix }}"
  tunnel_service: "{{ cloudflare_access_tunnel_service }}"
  tunnel_origin_request: "{{ cloudflare_access_tunnel_origin_request }}"
  dns_comment: "memory gateway public host (olympus-infra roles/cloudflare-access, olympus-sdk#736)"
  service_token_hosts: "{{ cloudflare_access_service_token_hosts }}"
  service_token_name_prefix: "{{ cloudflare_access_service_token_name_prefix }}"
  op_item: "{{ cloudflare_access_op_item }}"
  oauth_allowed_redirect_uris: "{{ cloudflare_access_oauth_allowed_redirect_uris }}"
  oauth_allow_localhost: "{{ cloudflare_access_oauth_allow_localhost }}"
  oauth_allow_loopback: "{{ cloudflare_access_oauth_allow_loopback }}"
  portal_callback_uris: "{{ cloudflare_access_mcp_memory_callback_uris }}"
  backend_env: {team_domain: MEMORY_ACCESS_TEAM_DOMAIN, aud: MEMORY_ACCESS_AUD}
  backend_config: "olympus-gitops clusters/olympus/memory/gateway/gateway.yaml (memory-gateway-config)"

# The read-only Kubernetes MCP backend (olympus-sdk#916): owner only, no service tokens yet (a later issue
# adds host tokens: list the hosts in service_token_hosts then), in the owner and hosts MCP portals as server `k8s` (#929).
# Decision: k8s-mcp uses the same session and grant lifetimes as memory (owner-only, read-only backend); set
# the per-application keys (session_duration, oauth_access_token_lifetime, oauth_grant_session_duration) to
# tighten them.
# No base redirect URIs (olympus-sdk#929 security review): the k8s-mcp backend is reachable through the MCP
# portals only, never as a direct claude.ai connector (the personal/work guard cannot judge a direct
# connector's arbitrary display name; claude.ai uses the owner portal). Its DCR allows only the portal
# callbacks below (no claude.ai, no localhost or loopback). Memory keeps https://claude.ai/* for its connector.
cloudflare_access_k8s_mcp_oauth_allowed_redirect_uris: []
# Empty in the role: the playbook sets the dashboard callback for server id k8s and the callbacks of the
# portals that hold it (olympus-sdk#929), as cloudflare_access_mcp_memory_callback_uris has them for memory.
cloudflare_access_k8s_mcp_portal_callback_uris: []
cloudflare_access_k8s_mcp_app:
  name: "k8s-mcp"
  domain: "k8s-mcp.nwlnexus.io"
  policy_prefix: "k8s-mcp-"
  tunnel_service: "http://k8s-mcp.atlas-system.svc.cluster.local:80"
  dns_comment: "Kubernetes MCP backend public host (olympus-infra roles/cloudflare-access, olympus-sdk#916)"
  service_token_hosts: []
  oauth_allowed_redirect_uris: "{{ cloudflare_access_k8s_mcp_oauth_allowed_redirect_uris }}"
  portal_callback_uris: "{{ cloudflare_access_k8s_mcp_portal_callback_uris }}"
  backend_env: {team_domain: ACCESS_TEAM_DOMAIN, aud: ACCESS_AUD}
  backend_config: "the k8s-mcp-proxy container env in the olympus-gitops atlas-system manifests"

# --- MCP servers and server portals (olympus-sdk#923, follow-up to spike #909; lists: #929) -------------
# Off by default, so a run without it is unchanged. With it on, the role also manages (look-up-before-create,
# after the applications and tunnel), for every entry of cloudflare_access_mcp_servers:
#   - the MCP server (auth_type oauth) and an `mcp` Access application for it;
# and for every entry of cloudflare_access_mcp_portals:
#   - the portal on its hostname, its servers attached (per-user auth: on_behalf), Code Mode off by default
#     (the personal/work guard must see tool names);
#   - tool curation per server in the portal: every synced tool enabled except the entry's disabled_tools.
#     The API refuses `updated_tools` until that server's tools have synced (after the owner authenticates
#     the server in the dashboard), so before that the role skips that server's curation and says to re-run;
#   - an `mcp_portal` Access application (a portal created through the API gets none) with Managed OAuth and
#     DCR;
#   - the proxied CNAME <portal hostname> -> gateway.agents.cloudflare.com (an existing record that is
#     anything else is refused, never overwritten).
# Every `mcp` and `mcp_portal` application uses the reusable <cloudflare_access_policy_prefix>allow-owner
# policy only (no service tokens: bots stay on direct paths).
# A server's own Access application (one of cloudflare_access_applications) must allow the dashboard callback
# for the server id and the /servers-callback of every portal that holds it, in its portal_callback_uris
# (memory: cloudflare_access_mcp_memory_callback_uris; k8s: cloudflare_access_k8s_mcp_portal_callback_uris);
# the run warns when one is missing. They are added to its DCR allowed_uris while this is on.
# Once applied, keep this on for every later run: a run with it off resets the backends' redirect URIs and
# the servers can no longer re-authenticate (the portal objects themselves are left alone, never deleted).
# Removing a server or portal from the lists deletes nothing either.
cloudflare_access_mcp_portal_enabled: false

# Allowed portal server ids (olympus-sdk#929); the role refuses any other id. memory, k8s and cluster are
# personal-only (the guard judges them); toolbox is allowed but not yet guarded. Change it only together with
# the guard.
cloudflare_access_mcp_allowed_server_ids: [memory, k8s, cluster, toolbox]

# MCP servers. Keys: id (required, 1-32 [a-z0-9_-], also the tool prefix in a portal), url (required, https),
# name (default: id), app_name (its `mcp` Access application, default: mcp-server-<id>), disabled_tools (default
# [], the curation every portal applies unless its entry sets its own).
cloudflare_access_mcp_servers:
  - "{{ cloudflare_access_mcp_memory_server }}"
  - "{{ cloudflare_access_mcp_k8s_server }}"

# MCP portals. Keys: id (required), hostname (required, inside cloudflare_access_dns_zone), servers (required:
# entries {server_id, on_behalf (default cloudflare_access_mcp_on_behalf), default_disabled (default false),
# disabled_tools (default: the server's)}), name (default: id), code_mode (default off), app_name (default
# mcp-portal-<id>), oauth_allowed_redirect_uris / oauth_allow_localhost / oauth_allow_loopback (default the
# cloudflare_access_mcp_portal_oauth_* below), dns_comment.
cloudflare_access_mcp_portals:
  - "{{ cloudflare_access_mcp_owner_portal }}"
  - "{{ cloudflare_access_mcp_hosts_portal }}"

# The memory server and the owner portal read the single-portal variables below (#923), so existing
# invocations and their -e overrides keep working unchanged.
cloudflare_access_mcp_server_id: "memory"
cloudflare_access_mcp_server_name: "memory"
cloudflare_access_mcp_server_url: "https://{{ cloudflare_access_app_domain }}/mcp"
cloudflare_access_mcp_server_app_name: "mcp-server-memory"
# Tools turned off for memory. The gateway also refuses `forget` without the forget scope; this keeps it out
# of the portals' tool lists as well. The memory gateway has no admin tools on /mcp today; add any that appear.
cloudflare_access_mcp_disabled_tools:
  - forget
cloudflare_access_mcp_memory_server:
  id: "{{ cloudflare_access_mcp_server_id }}"
  name: "{{ cloudflare_access_mcp_server_name }}"
  url: "{{ cloudflare_access_mcp_server_url }}"
  app_name: "{{ cloudflare_access_mcp_server_app_name }}"
  disabled_tools: "{{ cloudflare_access_mcp_disabled_tools }}"

# The read-only Kubernetes MCP backend (olympus-sdk#916, #929). Its tools are all read-only: none turned off.
# The id `k8s` is reserved: the guard blocks k8s_* portal tools from work directories.
cloudflare_access_mcp_k8s_server:
  id: "k8s"
  url: "https://{{ cloudflare_access_k8s_mcp_app.domain }}/mcp"
  app_name: "mcp-server-k8s"
  disabled_tools: []

cloudflare_access_mcp_portal_id: "owner"
cloudflare_access_mcp_portal_name: "owner"
cloudflare_access_mcp_portal_hostname: "mcp.nwlnexus.io"
# off | opt_in | default_on | enforced. Off: Code Mode would hide the tool names the guard matches.
cloudflare_access_mcp_portal_code_mode: "off"
cloudflare_access_mcp_portal_app_name: "mcp-portal-owner"
# The owner portal: memory and k8s, for claude.ai and Claude Code.
cloudflare_access_mcp_owner_portal:
  id: "{{ cloudflare_access_mcp_portal_id }}"
  name: "{{ cloudflare_access_mcp_portal_name }}"
  hostname: "{{ cloudflare_access_mcp_portal_hostname }}"
  code_mode: "{{ cloudflare_access_mcp_portal_code_mode }}"
  app_name: "{{ cloudflare_access_mcp_portal_app_name }}"
  dns_comment: "MCP server portal (olympus-infra roles/cloudflare-access, olympus-sdk#923)"
  servers:
    - server_id: "{{ cloudflare_access_mcp_server_id }}"
    - server_id: "k8s"

# The hosts portal (olympus-sdk#929): host tools only (k8s now), never memory; Claude Code only (no claude.ai
# redirect), Code Mode off. Hostname: hosts.mcp.nwlnexus.io was the first choice, but no certificate on the
# zone covers a second-level name there (Universal SSL is *.nwlnexus.io only; on 2026-11-11 the edge refused
# the TLS handshake for it), so it is the first-level mcp-hosts.nwlnexus.io.
cloudflare_access_mcp_hosts_portal_hostname: "mcp-hosts.nwlnexus.io"
cloudflare_access_mcp_hosts_portal:
  id: "hosts"
  hostname: "{{ cloudflare_access_mcp_hosts_portal_hostname }}"
  code_mode: "off"
  app_name: "mcp-portal-hosts"
  oauth_allowed_redirect_uris: []
  oauth_allow_localhost: true
  oauth_allow_loopback: true
  dns_comment: "MCP server portal hosts (olympus-infra roles/cloudflare-access, olympus-sdk#929)"
  servers:
    - server_id: "k8s"

# Per-user auth through the portals (each person's own OAuth grant to the server); the default of every
# portal server entry.
cloudflare_access_mcp_on_behalf: true
# Defaults of every portal's mcp_portal application.
cloudflare_access_mcp_portal_oauth_allowed_redirect_uris:
  - "https://claude.ai/*"
# Claude Code registers a localhost/loopback redirect.
cloudflare_access_mcp_portal_oauth_allow_localhost: true
cloudflare_access_mcp_portal_oauth_allow_loopback: true
cloudflare_access_mcp_dns_target: "gateway.agents.cloudflare.com"
# Callbacks the memory application's OAuth (DCR) must allow, or registering the server fails with
# "An error occurred while registering the MCP server" (spike #909): the dashboard's admin callback for
# this server id and the per-user callback of the portal that holds it.
cloudflare_access_mcp_memory_callback_uris:
  - "https://dash.cloudflare.com/{{ cloudflare_access_account_id }}/one/access-controls/ai-controls/mcp-server/oauth-callback/{{ cloudflare_access_mcp_server_id }}"
  - "https://{{ cloudflare_access_mcp_portal_hostname }}/servers-callback"
