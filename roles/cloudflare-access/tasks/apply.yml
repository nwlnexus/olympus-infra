---
# Included from main.yml once an API token is resolved. Every GET runs in --check (check_mode: false);
# every write is a uri/command task, which Ansible skips in --check, so a check run only reads and
# reports. Every task that carries the token or a secret is no_log.

- name: Check the required inputs
  ansible.builtin.assert:
    that:
      - cloudflare_access_account_id | length > 0
      - cloudflare_access_owner_emails | length > 0
      - cloudflare_access_owner_emails | select('match', '^[^@\s]+@[^@\s]+$') | list | length
        == cloudflare_access_owner_emails | length
      - cloudflare_access_rotate_grace_hours | int >= 0
      - cloudflare_access_rotate_grace_hours | int <= 720
    fail_msg: >-
      cloudflare-access needs cloudflare_access_account_id, at least one owner e-mail in
      cloudflare_access_owner_emails (supplied with -e, never committed: this repository is public)
      and a rotation grace of 0-720 hours.
    quiet: true

- name: Set the API base and headers
  ansible.builtin.set_fact:
    _cfa_api: "{{ cloudflare_access_api_url }}"
    _cfa_acct: "{{ cloudflare_access_api_url }}/accounts/{{ cloudflare_access_account_id }}"
    # The compute-*.yml steps look templates up through this (tests set it without a role context).
    _cfa_templates: "{{ role_path }}/templates"
    _cfa_headers:
      Authorization: "Bearer {{ _cfa_token }}"
      Content-Type: "application/json"
  no_log: true

- name: Fill in the application list
  ansible.builtin.include_tasks: compute-applications.yml

- name: The MCP portal needs the memory application in the list
  # mcp.yml uses memory's allow-owner policy and domain (cloudflare_access_policy_prefix / _app_domain).
  # Checked before any request, so a run with the portal on and memory removed changes nothing.
  ansible.builtin.assert:
    that: >-
      _cfa_applications | selectattr('policy_prefix', 'equalto', cloudflare_access_policy_prefix)
      | selectattr('domain', 'equalto', cloudflare_access_app_domain) | list | length == 1
    fail_msg: >-
      cloudflare_access_mcp_portal_enabled is on, but cloudflare_access_applications has no entry with
      policy_prefix {{ cloudflare_access_policy_prefix }} and domain {{ cloudflare_access_app_domain }}
      (the memory application the portal uses). Put it back in the list, or turn the portal off (which
      resets the memory application's redirect URIs; see the playbook header). Nothing was changed.
    quiet: true
  when: cloudflare_access_mcp_portal_enabled | bool

- name: Fill in and check the MCP server and portal lists (before any request)
  ansible.builtin.include_tasks: compute-mcp.yml
  when: cloudflare_access_mcp_portal_enabled | bool

- name: Check the service-token inputs of every application
  vars:
    _all_hosts: "{{ _cfa_applications | map(attribute='service_token_hosts') | flatten | unique }}"
  ansible.builtin.assert:
    that:
      - _cfa_applications | map(attribute='service_token_hosts') | map('unique') | map('length') | list
        == _cfa_applications | map(attribute='service_token_hosts') | map('length') | list
      - cloudflare_access_rotate_hosts | difference(_all_hosts) | length == 0
      - cloudflare_access_refresh_hosts | difference(_all_hosts) | length == 0
    fail_msg: >-
      Service-token hosts must be unique within an application, and rotate/refresh hosts must be listed
      by at least one application ({{ _all_hosts }}).
    quiet: true

# ------------------------------------------------------------------------------------------------
# 1-3. Per application, in list order: service tokens, reusable policies, the Access application.
# ------------------------------------------------------------------------------------------------
- name: Service tokens, policies and the Access application of each application
  ansible.builtin.include_tasks: application.yml
  loop: "{{ _cfa_applications }}"
  loop_control:
    loop_var: _cfa_a
    label: "{{ _cfa_a.name }}"

- name: Read the Zero Trust organization (team domain)
  ansible.builtin.uri:
    url: "{{ _cfa_acct }}/access/organizations"
    method: GET
    headers: "{{ _cfa_headers }}"
    status_code: 200
  register: _cfa_org_resp
  check_mode: false
  no_log: true

# ------------------------------------------------------------------------------------------------
# 4. Tunnel public hostname and DNS: only after the application protects the host.
# ------------------------------------------------------------------------------------------------
- name: Pick the applications whose tunnel rule this run manages
  vars:
    # Applications whose Access application exists (or whose rule is being removed); the rule of any
    # other application is left as it is.
    _l: >-
      [{% for a in _cfa_applications if _cfa_ready[a.name] or not a.tunnel_enabled | bool %}{{ a | to_json }},{% endfor %}null]
  ansible.builtin.set_fact:
    _cfa_tunnel_apps: "{{ (_l | from_json)[:-1] }}"

- name: Tunnel hostname rules and DNS records
  ansible.builtin.include_tasks: tunnel.yml
  when: _cfa_tunnel_apps | length > 0

# ------------------------------------------------------------------------------------------------
# 5. Opt-in: MCP servers and server portals (olympus-sdk#923, #929).
# ------------------------------------------------------------------------------------------------
- name: MCP servers, portals, their Access applications and DNS
  ansible.builtin.include_tasks: mcp.yml
  when: cloudflare_access_mcp_portal_enabled | bool

# ------------------------------------------------------------------------------------------------
# 6. Values each backend needs (not secret), labelled by application.
# ------------------------------------------------------------------------------------------------
- name: Values for each backend
  ansible.builtin.debug:
    msg:
      - "{{ _cfa_a.name }}: paste into {{ _cfa_a.backend_config or 'the backend configuration' }}"
      - '{{ _cfa_a.name }}: {{ _cfa_a.backend_env.team_domain }}: "https://{{ _cfa_org_resp.json.result.auth_domain }}"'
      - '{{ _cfa_a.name }}: {{ _cfa_a.backend_env.aud }}: "{{ _cfa_auds[_cfa_a.name] }}"'
      # memory: one gateway client row per token (memory-admin client create --kind access_service_token).
      - "{{ _cfa_a.name }}: service tokens (name, client id): {{ _cfa_app_tokens[_cfa_a.name] if _cfa_app_tokens[_cfa_a.name] else 'none' }}"
  loop: "{{ _cfa_applications }}"
  loop_control:
    loop_var: _cfa_a
    label: "{{ _cfa_a.name }}"
