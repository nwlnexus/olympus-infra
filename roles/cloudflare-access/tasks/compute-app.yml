---
# Desired self-hosted application and its diff against the API (pure: tests/cloudflare-access runs it
# offline with fake responses). Inputs: _cfa_a (one application), _cfa_apps (GET /access/apps result),
# _cfa_policy_ids. With cloudflare_access_mcp_portal_enabled the DCR redirect URIs also allow the
# application's portal_callback_uris (memory: cloudflare_access_mcp_memory_callback_uris, #923).
# Outputs: _cfa_app_desired, _cfa_app_matches, _cfa_app_current, _cfa_app_action, _cfa_app_diff_keys.

- name: Build the desired application
  ansible.builtin.set_fact:
    _cfa_app_desired:
      name: "{{ _cfa_a.name }}"
      type: self_hosted
      domain: "{{ _cfa_a.domain }}"
      # The bare host covers every path (/, /mcp, /healthz, /readyz): Access path "/*".
      destinations:
        - type: public
          uri: "{{ _cfa_a.domain }}"
      session_duration: "{{ _cfa_a.session_duration }}"
      app_launcher_visible: false
      allowed_idps: "{{ cloudflare_access_allowed_idps }}"
      auto_redirect_to_identity: "{{ cloudflare_access_allowed_idps | length == 1 }}"
      http_only_cookie_attribute: true
      same_site_cookie_attribute: lax
      # CORS preflights are not let through unauthenticated: the gateway answers no CORS at all.
      options_preflight_bypass: false
      # Order matters only for the dashboard; every policy is evaluated. service-auth only with tokens.
      policies: >-
        {{ [{'id': _cfa_policy_ids[_cfa_a.policy_prefix ~ 'allow-owner'], 'precedence': 1}]
           + ([{'id': _cfa_policy_ids[_cfa_a.policy_prefix ~ 'service-auth'], 'precedence': 2}]
              if _cfa_a.service_token_hosts | length > 0 else []) }}
      oauth_configuration: >-
        {{ {'enabled': true,
            'dynamic_client_registration': {
              'enabled': true,
              'allowed_uris': (_cfa_a.oauth_allowed_redirect_uris
                               + (_cfa_a.portal_callback_uris
                                  if cloudflare_access_mcp_portal_enabled | bool else [])) | unique,
              'allow_any_on_localhost': _cfa_a.oauth_allow_localhost | bool,
              'allow_any_on_loopback': _cfa_a.oauth_allow_loopback | bool},
            'grant': {
              'access_token_lifetime': _cfa_a.oauth_access_token_lifetime,
              'session_duration': _cfa_a.oauth_grant_session_duration}}
           if cloudflare_access_managed_oauth | bool else {'enabled': false} }}

- name: Find the existing application
  ansible.builtin.set_fact:
    _cfa_app_matches: >-
      {{ _cfa_apps | selectattr('domain', 'defined')
         | selectattr('domain', 'in', [_cfa_a.domain, _cfa_a.domain ~ '/*', _cfa_a.domain ~ '/'])
         | list }}

- name: Compare it field by field (lists of objects reduced to the fields this role sets)
  vars:
    _cur: "{{ _cfa_app_matches | first | default({}) }}"
    _cur_norm: >-
      {{ _cur | combine({
           'policies': _cur.policies | default([], true)
                       | community.general.keep_keys(target=['id', 'precedence']),
           'destinations': _cur.destinations | default([], true)
                           | community.general.keep_keys(target=['type', 'uri'])}) }}
  ansible.builtin.set_fact:
    _cfa_app_current: "{{ _cur }}"
    _cfa_app_diff_keys: >-
      {{ lookup('ansible.builtin.template', _cfa_templates ~ '/app-diff.j2',
                template_vars={'cur': _cur_norm, 'want': _cfa_app_desired}) | from_json }}

- name: Decide what to do with the application
  ansible.builtin.set_fact:
    _cfa_app_action: >-
      {{ 'create' if _cfa_app_matches | length == 0
         else ('update' if _cfa_app_diff_keys | length > 0 else 'unchanged') }}
