---
# The MCP server and portal lists with every per-entry default filled in, and their checks (pure:
# tests/cloudflare-access runs it offline). olympus-sdk#923 (one server, one portal), #929 (lists).
# Inputs: cloudflare_access_mcp_servers, cloudflare_access_mcp_portals. Outputs: _cfa_mcp_server_list,
# _cfa_mcp_portal_list. A portal's server entry takes on_behalf, default_disabled and disabled_tools from
# the defaults below and the server's own disabled_tools unless it sets them itself.

- name: Fill in the per-server defaults
  vars:
    _filled: >-
      [{% for s in cloudflare_access_mcp_servers %}{{ {'disabled_tools': []}
         | combine({'name': s.id | default('?'), 'app_name': 'mcp-server-' ~ (s.id | default('?'))})
         | combine(s) | to_json }},{% endfor %}null]
  ansible.builtin.set_fact:
    _cfa_mcp_server_list: "{{ (_filled | from_json)[:-1] }}"

- name: Fill in the per-portal defaults
  vars:
    _defaults:
      code_mode: "off"
      oauth_allowed_redirect_uris: "{{ cloudflare_access_mcp_portal_oauth_allowed_redirect_uris }}"
      oauth_allow_localhost: "{{ cloudflare_access_mcp_portal_oauth_allow_localhost | bool }}"
      oauth_allow_loopback: "{{ cloudflare_access_mcp_portal_oauth_allow_loopback | bool }}"
    _filled: >-
      [{% for p in cloudflare_access_mcp_portals %}{% set ns = namespace(servers=[]) %}{% for e in p.servers | default([], true) %}{%
          set srv = _cfa_mcp_server_list | selectattr('id', 'equalto', e.server_id | default('')) | first | default({}) %}{%
          set ns.servers = ns.servers + [{'on_behalf': cloudflare_access_mcp_on_behalf | bool, 'default_disabled': false,
                                          'disabled_tools': srv.disabled_tools | default([])} | combine(e)] %}{% endfor %}{{
         _defaults
         | combine({'name': p.id | default('?'), 'app_name': 'mcp-portal-' ~ (p.id | default('?')),
                    'dns_comment': 'MCP server portal ' ~ (p.id | default('?')) ~ ' (olympus-infra roles/cloudflare-access)'})
         | combine(p) | combine({'servers': ns.servers}) | to_json }},{% endfor %}null]
  ansible.builtin.set_fact:
    _cfa_mcp_portal_list: "{{ (_filled | from_json)[:-1] }}"

- name: Check the MCP server and portal lists
  vars:
    _server_ids: "{{ _cfa_mcp_server_list | map(attribute='id', default='') | list }}"
    _portal_ids: "{{ _cfa_mcp_portal_list | map(attribute='id', default='') | list }}"
    _hostnames: "{{ _cfa_mcp_portal_list | map(attribute='hostname', default='') | list }}"
    _entries: "{{ _cfa_mcp_portal_list | map(attribute='servers') | flatten }}"
    _zone_re: "{{ '(^|\\.)' ~ (cloudflare_access_dns_zone | regex_escape) ~ '$' }}"
  ansible.builtin.assert:
    that:
      - _server_ids | length > 0
      - _portal_ids | length > 0
      - _server_ids | select('match', '^[a-z0-9_-]{1,32}$') | list | length == _server_ids | length
      - _portal_ids | select('match', '^[a-z0-9_-]{1,32}$') | list | length == _portal_ids | length
      - _server_ids | unique | length == _server_ids | length
      - _portal_ids | unique | length == _portal_ids | length
      - _hostnames | unique | length == _hostnames | length
      # Only the allowed server ids (olympus-sdk#929): any other id would be unguarded.
      - _server_ids | difference(cloudflare_access_mcp_allowed_server_ids) | length == 0
      - _cfa_mcp_server_list | map(attribute='url', default='') | select('match', '^https://') | list | length
        == _server_ids | length
      - _cfa_mcp_server_list | map(attribute='app_name') | unique | length == _server_ids | length
      - _cfa_mcp_portal_list | map(attribute='app_name') | unique | length == _portal_ids | length
      - _cfa_mcp_portal_list | map(attribute='code_mode') | difference(['off', 'opt_in', 'default_on', 'enforced'])
        | length == 0
      - _hostnames | select('search', _zone_re) | list | length == _hostnames | length
      - _cfa_mcp_portal_list | map(attribute='servers') | map('length') | select('equalto', 0) | list | length == 0
      - _entries | map(attribute='server_id', default='') | difference(_server_ids) | length == 0
      - _cfa_mcp_portal_list | map(attribute='servers') | map('map', attribute='server_id') | map('unique')
        | map('length') | list == _cfa_mcp_portal_list | map(attribute='servers') | map('length') | list
      - "'https://claude.ai/*' in cloudflare_access_oauth_allowed_redirect_uris"
    fail_msg: >-
      cloudflare-access MCP portals: server and portal ids must be 1-32 characters [a-z0-9_-] and unique, server
      ids within cloudflare_access_mcp_allowed_server_ids ({{ cloudflare_access_mcp_allowed_server_ids }}: the
      only ids allowed; the personal/work guard judges memory, k8s and cluster),, server URLs https, code_mode one of off/opt_in/default_on/enforced,
      portal hostnames unique and inside {{ cloudflare_access_dns_zone }}, every portal with at least one server,
      each declared once, in cloudflare_access_mcp_servers, and the memory application must keep
      https://claude.ai/* in its redirect URIs.
    quiet: true

- name: Check the guarded servers and the hosts portal (olympus-sdk#929 security review)
  vars:
    # The ids the personal/work guard judges by their tool prefix (<id>_*): personal-only.
    _guarded: [memory, k8s, cluster]
    _guarded_servers: "{{ _cfa_mcp_server_list | selectattr('id', 'in', _guarded) | list }}"
    _guarded_entries: "{{ _cfa_mcp_portal_list | map(attribute='servers') | flatten | selectattr('server_id', 'in', _guarded) | list }}"
    _alias_keys: >-
      {{ (_guarded_servers + _guarded_entries) | map('dict2items') | flatten | map(attribute='key')
         | select('search', 'alias') | list }}
    _hosts_portal: >-
      {{ _cfa_mcp_portal_list | selectattr('id', 'equalto', cloudflare_access_mcp_hosts_portal.id) | list }}
    _k8s_app: "{{ cloudflare_access_k8s_mcp_app }}"
    _cluster_app: "{{ cloudflare_access_cluster_mcp_app }}"
  ansible.builtin.assert:
    that:
      # The display name must not stand in for the id, so the tools keep the <id>_ prefix the guard matches.
      - _guarded_servers | map(attribute='name') | list
        == _guarded_servers | map(attribute='id') | list
      # No server or portal alias for a guarded server: the role never sends portal_alias/server_alias.
      - _alias_keys | length == 0
      # The hosts portal never holds memory.
      - _hosts_portal | map(attribute='servers') | flatten | selectattr('server_id', 'equalto', 'memory') | list
        | length == 0
      # The k8s-mcp backend is reached through the portals only: no direct claude.ai connector, no localhost.
      - _k8s_app.oauth_allowed_redirect_uris | select('search', 'claude\\.ai') | list | length == 0
      - not (_k8s_app.oauth_allow_localhost | default(false) | bool)
      - not (_k8s_app.oauth_allow_loopback | default(false) | bool)
      # The same for the cluster-mcp backend (olympus-sdk#921).
      - _cluster_app.oauth_allowed_redirect_uris | select('search', 'claude\\.ai') | list | length == 0
      - not (_cluster_app.oauth_allow_localhost | default(false) | bool)
      - not (_cluster_app.oauth_allow_loopback | default(false) | bool)
    fail_msg: >-
      cloudflare-access MCP portals: servers {{ _guarded }} must keep name equal to id and carry no alias
      ({{ _alias_keys }}), the {{ cloudflare_access_mcp_hosts_portal.id }} portal must not hold memory, and the
      k8s-mcp and cluster-mcp applications must not allow claude.ai, localhost or loopback redirects (portal
      callbacks only).
    quiet: true
