---
# Desired reusable policies (pure: no API call; tests/cloudflare-access exercises it offline).
# Inputs: cloudflare_access_owner_emails, cloudflare_access_service_token_hosts, _cfa_tokens (name -> id).
# Exactly two policies, and neither is a Bypass. A service token that does not exist yet (--check before
# the first run) is left out of service-auth and reported.

- name: Build the allow-owner and service-auth policies
  ansible.builtin.set_fact:
    _cfa_policies_desired:
      - name: "{{ cloudflare_access_policy_prefix }}allow-owner"
        decision: allow
        include: >-
          {{ cloudflare_access_owner_emails | map('lower') | unique
             | map('community.general.dict_kv', 'email') | map('community.general.dict_kv', 'email') | list }}
        exclude: []
        require: []
      - name: "{{ cloudflare_access_policy_prefix }}service-auth"
        decision: non_identity
        include: >-
          {{ cloudflare_access_service_token_hosts
             | map('regex_replace', '^', cloudflare_access_service_token_name_prefix)
             | select('in', _cfa_tokens.keys())
             | map('extract', _cfa_tokens)
             | map('community.general.dict_kv', 'token_id') | map('community.general.dict_kv', 'service_token') | list }}
        exclude: []
        require: []

- name: Never an empty or Bypass policy
  ansible.builtin.assert:
    that:
      - _cfa_policies_desired | selectattr('decision', 'equalto', 'bypass') | list | length == 0
      - _cfa_policies_desired[0].include | length > 0
      - _cfa_policies_desired[1].include | length > 0 or ansible_check_mode
    fail_msg: "allow-owner or service-auth would be empty, or a Bypass policy was built: refusing."
    quiet: true
