---
# Pure: the tunnel ingress list with the applications' rules first, in list order (or removed). Inputs:
# _cfa_tunnel_config (the `config` object of GET .../configurations), _cfa_tunnel_apps (the applications
# whose rule this run manages: each with domain, tunnel_service, tunnel_origin_request, tunnel_enabled; a
# Worker-origin application never gets a rule, even if one is passed in).
# Outputs: _cfa_ingress_rules, _cfa_ingress_new, _cfa_ingress_changed. tests/cloudflare-access exercises it.
# A hostname that is not in _cfa_tunnel_apps (another rule, an application removed from the list, or one
# whose Access application does not exist yet) is kept where it is.

- name: Build the rules and the new ingress list
  vars:
    _old: "{{ _cfa_tunnel_config.ingress | default([], true) }}"
    _managed: "{{ _cfa_tunnel_apps | map(attribute='domain') | list }}"
    # Every rule except the managed domains', in order; the catch-all has no `hostname` and is kept.
    _others: >-
      [{% for r in _old if r.get('hostname') not in _managed %}{{ r | to_json }},{% endfor %}null]
    _rules: >-
      [{% for a in _cfa_tunnel_apps if a.get('origin', 'tunnel') == 'tunnel' and a.tunnel_enabled | bool %}{{ {'hostname': a.domain, 'service': a.tunnel_service}
         | combine({'originRequest': a.tunnel_origin_request} if a.tunnel_origin_request | length > 0 else {})
         | to_json }},{% endfor %}null]
  ansible.builtin.set_fact:
    _cfa_ingress_rules: "{{ (_rules | from_json)[:-1] }}"
    _cfa_ingress_old: "{{ _old }}"
    _cfa_ingress_others: "{{ (_others | from_json)[:-1] }}"

- name: Put the rules first (or leave them out)
  ansible.builtin.set_fact:
    _cfa_ingress_new: "{{ _cfa_ingress_rules + _cfa_ingress_others }}"

- name: Require a catch-all as the last rule
  ansible.builtin.assert:
    that:
      - _cfa_ingress_new | length >= _cfa_ingress_rules | length + 1 or _cfa_ingress_rules | length == 0
      - _cfa_ingress_new | length == 0 or (_cfa_ingress_new | last).get('hostname') is none
    fail_msg: >-
      The tunnel configuration has no catch-all rule as its last entry ({{ _cfa_ingress_old }}).
      cloudflared refuses such a configuration; fix the tunnel (roles/cloudflared-k8s) first.
    quiet: true

- name: Note whether the list changes
  ansible.builtin.set_fact:
    _cfa_ingress_changed: "{{ _cfa_ingress_new != _cfa_ingress_old }}"
