---
# MCP servers and server portals (olympus-sdk#923, one server and the `owner` portal; #929, lists: the
# Kubernetes server `k8s` and the `hosts` portal). Included from apply.yml after the applications and the
# tunnel, only with cloudflare_access_mcp_portal_enabled. Same rules as the rest of the role: look up before
# create, GETs run in --check, writes are skipped there, every API task is no_log.
# Everything is planned first (and checked: no second application for a portal host or a server), then
# written in this order: per server, the server and its `mcp` application; then per portal, the portal
# (servers must exist first), its `mcp_portal` application, then its DNS record (the host is routable only
# once Access protects it).

- name: List MCP servers
  ansible.builtin.uri:
    url: "{{ _cfa_acct }}/access/ai-controls/mcp/servers?per_page=100"
    method: GET
    headers: "{{ _cfa_headers }}"
    status_code: 200
  register: _cfa_mcp_servers_resp
  check_mode: false
  no_log: true

- name: List MCP portals
  ansible.builtin.uri:
    url: "{{ _cfa_acct }}/access/ai-controls/mcp/portals?per_page=100"
    method: GET
    headers: "{{ _cfa_headers }}"
    status_code: 200
  register: _cfa_mcp_portals_resp
  check_mode: false
  no_log: true

- name: List all Access applications (the mcp application has no domain to filter on)
  ansible.builtin.uri:
    url: "{{ _cfa_acct }}/access/apps?per_page=1000"
    method: GET
    headers: "{{ _cfa_headers }}"
    status_code: 200
  register: _cfa_all_apps_resp
  check_mode: false
  no_log: true

- name: Keep the API view and reset the plans
  ansible.builtin.set_fact:
    _cfa_mcp_servers: "{{ _cfa_mcp_servers_resp.json.result | default([], true) }}"
    _cfa_mcp_portals: "{{ _cfa_mcp_portals_resp.json.result | default([], true) }}"
    _cfa_all_apps: "{{ _cfa_all_apps_resp.json.result | default([], true) }}"
    _cfa_mcp_server_plans: []
    _cfa_mcp_portal_plans: []

- name: Plan each MCP server and its mcp application
  ansible.builtin.include_tasks: mcp-plan-server.yml
  loop: "{{ _cfa_mcp_server_list }}"
  loop_control:
    loop_var: _cfa_ms
    label: "{{ _cfa_ms.id }}"

- name: Plan each MCP portal, its curation and its mcp_portal application
  ansible.builtin.include_tasks: mcp-plan-portal.yml
  loop: "{{ _cfa_mcp_portal_list }}"
  loop_control:
    loop_var: _cfa_mp
    label: "{{ _cfa_mp.id }}"

- name: Refuse to touch a second application for a portal host or a server
  ansible.builtin.assert:
    that:
      - _cfa_mcp_server_plans | map(attribute='app_matches') | map('length') | select('gt', 1) | list | length == 0
      - _cfa_mcp_portal_plans | map(attribute='app_matches') | map('length') | select('gt', 1) | list | length == 0
    fail_msg: >-
      More than one Access application for an MCP portal host or server:
      {{ (_cfa_mcp_server_plans + _cfa_mcp_portal_plans) | map(attribute='app_matches')
         | select | map('map', attribute='name') | map('list') | list }}.
      Resolve that in the dashboard first. Nothing was changed.
    quiet: true

- name: Report the MCP plan
  vars:
    _lines: >-
      [{% for p in _cfa_mcp_server_plans %}{{ ('MCP server ' ~ p.server.id ~ ' -> ' ~ p.server.url ~ ': ' ~ p.action) | to_json }},{{
         ('Access app ' ~ p.server.app_name ~ ' (mcp): ' ~ p.app_action
          ~ ((' (' ~ p.app_diff_keys | join(', ') ~ ')') if p.app_action == 'update' else '')) | to_json }},{% endfor %}{%
        for p in _cfa_mcp_portal_plans %}{{ ('MCP portal ' ~ p.portal.id ~ ' on ' ~ p.portal.hostname ~ ' (servers: '
          ~ p.portal.servers | map(attribute='server_id') | join(', ') ~ '): ' ~ p.action
          ~ ((' (' ~ p.diff_keys | join(', ') ~ ')') if p.action == 'update' else '')) | to_json }},{%
          for c in p.curation %}{{ ('Tool curation ' ~ p.portal.id ~ '/' ~ c.server_id ~ ' (off: '
            ~ (c.disabled_tools | join(', ') or 'nothing') ~ '): ' ~ c.state ~ ', '
            ~ c.tools | length ~ ' synced tool(s)') | to_json }},{% endfor %}{{
         ('Access app ' ~ p.portal.app_name ~ ' (mcp_portal): ' ~ p.app_action
          ~ ((' (' ~ p.app_diff_keys | join(', ') ~ ')') if p.app_action == 'update' else '')) | to_json }},{% endfor %}null]
  ansible.builtin.debug:
    msg: "{{ (_lines | from_json)[:-1] }}"

- name: Callback hint for each server's backend application (the server cannot authenticate without them)
  # A server's own Access application (when it is one of cloudflare_access_applications) must allow the
  # dashboard callback for the server id and the per-user callback of every portal that holds the server.
  vars:
    _missing: >-
      [{% for s in _cfa_mcp_server_list %}{%
          set app = _cfa_applications | selectattr('domain', 'equalto', s.url | urlsplit('hostname')) | first | default(none) %}{%
          if app is not none %}{%
            set ns = namespace(want=['https://dash.cloudflare.com/' ~ cloudflare_access_account_id
                                     ~ '/one/access-controls/ai-controls/mcp-server/oauth-callback/' ~ s.id]) %}{%
            for p in _cfa_mcp_portal_list if s.id in p.servers | map(attribute='server_id') | list %}{%
              set ns.want = ns.want + ['https://' ~ p.hostname ~ '/servers-callback'] %}{% endfor %}{%
            set want = ns.want %}{%
            set miss = want | difference(app.portal_callback_uris) %}{%
            if miss | length > 0 %}{{ {'server': s.id, 'application': app.name, 'missing': miss} | to_json }},{% endif %}{%
          endif %}{% endfor %}null]
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ (_missing | from_json)[:-1] | to_json }}: add these to the application's portal_callback_uris,
      or authenticating the server fails with "An error occurred while registering the MCP server".
  when: (_missing | from_json)[:-1] | length > 0

- name: Create or update each MCP server and its mcp application
  ansible.builtin.include_tasks: mcp-server.yml
  loop: "{{ _cfa_mcp_server_plans }}"
  loop_control:
    loop_var: _p
    label: "{{ _p.server.id }}"

- name: Create or update each MCP portal, its mcp_portal application and its DNS record
  ansible.builtin.include_tasks: mcp-portal.yml
  loop: "{{ _cfa_mcp_portal_plans }}"
  loop_control:
    loop_var: _p
    label: "{{ _p.portal.id }}"

# --- Summary -------------------------------------------------------------------------------------------
- name: MCP portal summary
  vars:
    _lines: >-
      [{% for p in _cfa_mcp_portal_plans %}{{ ('Portal ' ~ p.portal.id ~ ': https://' ~ p.portal.hostname ~ '/mcp') | to_json }},{%
        endfor %}{% for p in _cfa_mcp_server_plans %}{%
          set srv = _cfa_mcp_server_results[p.server.id] | default(p.current, true) %}{{
         ('Server ' ~ p.server.id ~ ': status ' ~ (srv.status | default('(not created yet)')) ~ ', authentication '
          ~ (srv.authentication_status | default('-'))
          ~ ((', error: ' ~ srv.error) if srv.error | default('') | length > 0 else '')) | to_json }},{% endfor %}{%
        for p in _cfa_mcp_portal_plans %}{% for c in p.curation %}{{
         ('Tool curation ' ~ p.portal.id ~ '/' ~ c.server_id ~ ': '
          ~ {'applied': 'applied (' ~ (c.want_disabled | join(', ') or 'nothing') ~ ' turned off)',
             'to_apply': ('applied in this run' if not ansible_check_mode else 'would be applied')
                         ~ ' (' ~ (c.want_disabled | join(', ') or 'nothing') ~ ' turned off)',
             'pending': 'NOT applied: the server has no synced tools yet'}[c.state]) | to_json }},{% endfor %}{% endfor %}{%
        for p in _cfa_mcp_server_plans if p.tools | length == 0 %}{{
         ('Next (owner): Zero Trust > Access controls > AI controls > MCP servers > ' ~ p.server.id
          ~ ' > Authenticate server (sign in as the owner), wait for status ready, then re-run this playbook to apply its tool curation.')
         | to_json }},{% endfor %}null]
  ansible.builtin.debug:
    msg: "{{ (_lines | from_json)[:-1] }}"
