---
# One service token for host `_cfa_host` of application `_cfa_a` (from application.yml): create (`_cfa_action: create`) or rotate its secret
# (`_cfa_action: rotate`, the client id and so the gateway's client row stay the same). Cloudflare shows
# the secret only in this response, so it goes to 1Password in the same include. Every task is no_log.
#
# If the 1Password write fails after a create, the secret is lost: re-run with
# -e '{"cloudflare_access_rotate_hosts": ["<host>"], "cloudflare_access_rotate_grace_hours": 0}'
# to issue a new secret for the same client id.
#
# `op` gets the values on its argv, as in roles/cloudflared-k8s/tasks/onepassword.yml (no stdin
# template support for custom fields in `op item edit`): run this from a single-user controller.

- name: "Create service token {{ _cfa_a.service_token_name_prefix ~ _cfa_host }}"
  ansible.builtin.uri:
    url: "{{ _cfa_acct }}/access/service_tokens"
    method: POST
    headers: "{{ _cfa_headers }}"
    body_format: json
    body:
      name: "{{ _cfa_a.service_token_name_prefix ~ _cfa_host }}"
      duration: "{{ cloudflare_access_service_token_duration }}"
    status_code: [200, 201]
  register: _cfa_st_create
  changed_when: true
  no_log: true
  when: _cfa_action == 'create'

- name: "Rotate the secret of {{ _cfa_a.service_token_name_prefix ~ _cfa_host }}"
  ansible.builtin.uri:
    url: "{{ _cfa_acct }}/access/service_tokens/{{ _cfa_tokens[_cfa_a.service_token_name_prefix ~ _cfa_host] }}/rotate"
    method: POST
    headers: "{{ _cfa_headers }}"
    body_format: json
    # Grace 0 = revoke the previous secret now (field omitted); otherwise it stays valid until then.
    body: >-
      {{ {} if (cloudflare_access_rotate_grace_hours | int) == 0
         else {'previous_client_secret_expires_at':
               '%Y-%m-%dT%H:%M:%SZ' | strftime(now(utc=true).timestamp() | int
                                               + (cloudflare_access_rotate_grace_hours | int) * 3600, utc=true)} }}
    status_code: 200
  register: _cfa_st_rotate
  changed_when: true
  no_log: true
  when: _cfa_action == 'rotate'

- name: "Field assignments (op field[type]=value) for {{ _cfa_host }}"
  ansible.builtin.set_fact:
    _cfa_op_fields:
      - "{{ _cfa_host }}-id[text]={{ _cfa_st.client_id | default(_cfa_token_client_ids[_cfa_a.service_token_name_prefix ~ _cfa_host]) }}"
      - "{{ _cfa_host }}-secret[password]={{ _cfa_st.client_secret }}"
  vars:
    # A skipped task still registers, so each action has its own variable.
    _cfa_st: "{{ (_cfa_st_create if _cfa_action == 'create' else _cfa_st_rotate).json.result }}"
  no_log: true

- name: "Create the 1Password item with the token of {{ _cfa_host }}"
  ansible.builtin.command:
    argv: >-
      {{ cloudflare_access_op_cmd + ['item', 'create', '--category=password',
          '--title=' ~ _cfa_a.op_item,
          '--vault=' ~ cloudflare_access_op_vault] + _cfa_op_fields }}
  register: _cfa_op_create
  changed_when: true
  failed_when: false
  no_log: true
  when: not (_cfa_op_item_exists | bool)

- name: "Write into the 1Password item the token of {{ _cfa_host }}"
  ansible.builtin.command:
    argv: >-
      {{ cloudflare_access_op_cmd + ['item', 'edit', _cfa_a.op_item,
          '--vault=' ~ cloudflare_access_op_vault] + _cfa_op_fields }}
  register: _cfa_op_edit
  changed_when: true
  failed_when: false
  no_log: true
  when: _cfa_op_item_exists | bool

# The write tasks above are no_log (their argv carries the secret), which also hid op's error message.
# Show op's stderr with every field value replaced, so a failed write says why.
- name: "Stop if the 1Password write for {{ _cfa_host }} failed (op's message, values redacted)"
  ansible.builtin.fail:
    msg: "op exited {{ _cfa_op_result.rc }}: {{ _cfa_op_result.stderr | default('') | regex_replace(_cfa_op_values, '<redacted>') | trim }}"
  vars:
    _cfa_op_result: "{{ _cfa_op_edit if (_cfa_op_item_exists | bool) else _cfa_op_create }}"
    _cfa_op_values: "{{ _cfa_op_fields | map('regex_replace', '^[^=]*=', '') | map('regex_escape') | join('|') }}"
  when: (_cfa_op_result.rc | default(0)) != 0

- name: The item exists from now on
  ansible.builtin.set_fact:
    _cfa_op_item_exists: true
    _cfa_op_fields: []
