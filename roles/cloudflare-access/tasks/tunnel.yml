---
# The tunnel public hostname rules and the proxied CNAMEs for the application domains (_cfa_tunnel_apps,
# from apply.yml: only applications whose Access application exists, so a host is never routable before
# Access protects it). One configuration write for every rule; then dns.yml once per application.
#
# The olympus cluster's tunnel is remotely managed: its ingress lives in the Cloudflare API, not in
# olympus-gitops clusters/olympus/cloudflared/configmap.yaml. This keeps every other rule as it is (the
# catch-all to Traefik included) and only inserts, moves to the top, or (tunnel_enabled: false) removes
# the rules for the application domains. roles/cloudflared-k8s keeps hostname rules when it rewrites
# the catch-all, so the two roles do not fight.

- name: Look up the tunnel by name
  ansible.builtin.uri:
    url: "{{ _cfa_acct }}/cfd_tunnel?name={{ cloudflare_access_tunnel_name | urlencode }}&is_deleted=false"
    method: GET
    headers: "{{ _cfa_headers }}"
    status_code: 200
  register: _cfa_tunnel_list
  check_mode: false
  no_log: true

- name: Require exactly one tunnel of that name
  ansible.builtin.assert:
    that: _cfa_tunnel_list.json.result | default([], true) | length == 1
    fail_msg: "Expected exactly one live tunnel named {{ cloudflare_access_tunnel_name }}."
    quiet: true

- name: Read the tunnel configuration
  ansible.builtin.uri:
    url: "{{ _cfa_acct }}/cfd_tunnel/{{ _cfa_tunnel_list.json.result[0].id }}/configurations"
    method: GET
    headers: "{{ _cfa_headers }}"
    status_code: 200
  register: _cfa_tunnel_cfg
  check_mode: false
  no_log: true

- name: Build the new ingress list
  ansible.builtin.include_tasks: compute-tunnel.yml
  vars:
    _cfa_tunnel_id: "{{ _cfa_tunnel_list.json.result[0].id }}"
    _cfa_tunnel_config: "{{ _cfa_tunnel_cfg.json.result.config | default({}, true) }}"

- name: Report the tunnel plan
  ansible.builtin.debug:
    msg: >-
      tunnel {{ cloudflare_access_tunnel_name }}: rules for {{ _cfa_tunnel_apps | map(attribute='domain') | join(', ') }}
      {{ 'unchanged' if not _cfa_ingress_changed else 'set to ' ~ (_cfa_ingress_rules | to_json) }};
      {{ _cfa_ingress_new | length }} rule(s), last {{ _cfa_ingress_new | last }}

- name: Write the tunnel configuration (other rules and keys unchanged)
  ansible.builtin.uri:
    url: "{{ _cfa_acct }}/cfd_tunnel/{{ _cfa_tunnel_list.json.result[0].id }}/configurations"
    method: PUT
    headers: "{{ _cfa_headers }}"
    body_format: json
    body:
      config: "{{ _cfa_tunnel_cfg.json.result.config | default({}, true) | combine({'ingress': _cfa_ingress_new}) }}"
    status_code: 200
  changed_when: true
  no_log: true
  when: _cfa_ingress_changed | bool

- name: DNS record of each application
  ansible.builtin.include_tasks: dns.yml
  loop: "{{ _cfa_tunnel_apps }}"
  loop_control:
    loop_var: _cfa_a
    label: "{{ _cfa_a.domain }}"
