---
# The tunnel credentials live in a 1Password item that ESO reads
# (olympus-gitops clusters/olympus/cloudflared/externalsecret.yaml).
#
# Fleet hosts never write to 1Password (owner decision 2026-11-17, olympus-sdk#1000): their
# service-account token is read-only. So:
#   - on a host (ansible-pull, cloudflared_op_write false) the role only reads the item's
#     tunnel-id and warns when the item is missing or names another tunnel;
#   - the upsert runs on the controller, with the controller's own `op` sign-in, when
#     cloudflared_op_write is true: playbooks/push/cloudflared-op-sync.yml (owner-run).
#
# Item fields: tunnel-id, account-tag (text); tunnel-secret, tunnel-token,
# credentials-json (concealed). ESO pulls `credentials-json` into a k8s Secret
# with key `credentials.json`.
#
# Every `op` call goes through cloudflared_op_cmd (defaults): Connect variables dropped, stdin
# /dev/null.

- name: Read the tunnel id the 1Password item holds
  ansible.builtin.command:
    argv: >-
      {{ cloudflared_op_cmd + ['item', 'get', cloudflared_op_item_title,
          '--vault=' ~ cloudflared_op_vault, '--fields', 'label=tunnel-id', '--format=json'] }}
  register: _op_item_get
  changed_when: false
  failed_when: false
  check_mode: false
  become: false
  delegate_to: "{{ 'localhost' if (cloudflared_op_write | bool) else inventory_hostname }}"

- name: Parse the tunnel id from the item
  ansible.builtin.set_fact:
    _op_item_tunnel_id: >-
      {%- if _op_item_get.rc | default(1) == 0 and (_op_item_get.stdout | default('')) != '' -%}
      {%- set _f = _op_item_get.stdout | from_json -%}
      {{ ((_f | first) if (_f is sequence and _f is not mapping) else _f).value | default('') }}
      {%- endif -%}

- name: Warn when the 1Password item is missing or names another tunnel (hosts never write it)
  ansible.builtin.debug:
    msg: >-
      WARNING: 1Password {{ cloudflared_op_vault }}/{{ cloudflared_op_item_title }} is
      {{ 'missing' if _op_item_get.rc | default(1) != 0 else 'for tunnel ' ~ _op_item_tunnel_id }},
      but tunnel {{ cloudflared_tunnel_name }} is {{ cloudflared_tunnel_id }}. ESO then serves stale
      credentials. This host does not write to 1Password (olympus-sdk#1000): the owner runs
      playbooks/push/cloudflared-op-sync.yml.
  when:
    - not (cloudflared_op_write | bool)
    - _op_item_tunnel_id != cloudflared_tunnel_id

# ── Controller only (cloudflared_op_write) ────────────────────────────────────

- name: Decode tunnel token
  ansible.builtin.set_fact:
    _cf_token_obj: "{{ tunnel_token_resp.json.result | b64decode | from_json }}"
  no_log: true
  when: cloudflared_op_write | bool

- name: Assemble credentials.json blob
  ansible.builtin.set_fact:
    _cf_credentials_json: "{{ {'AccountTag': _cf_token_obj.a, 'TunnelID': _cf_token_obj.t, 'TunnelSecret': _cf_token_obj.s} | to_json }}"
  no_log: true
  when: cloudflared_op_write | bool

- name: Field assignments (op `field[type]=value` syntax)
  ansible.builtin.set_fact:
    _op_fields:
      - "tunnel-id[text]={{ _cf_token_obj.t }}"
      - "account-tag[text]={{ _cf_token_obj.a }}"
      - "tunnel-secret[password]={{ _cf_token_obj.s }}"
      - "tunnel-token[password]={{ tunnel_token_resp.json.result }}"
      - "credentials-json[password]={{ _cf_credentials_json }}"
  no_log: true
  when: cloudflared_op_write | bool

- name: Create 1Password tunnel item (controller)
  ansible.builtin.command:
    argv: >-
      {{ cloudflared_op_cmd + ['item', 'create',
          '--category=password',
          '--title=' ~ cloudflared_op_item_title,
          '--vault=' ~ cloudflared_op_vault] + _op_fields }}
  register: _op_item_create
  changed_when: true
  no_log: true
  become: false
  delegate_to: localhost
  when:
    - cloudflared_op_write | bool
    - _op_item_get.rc | default(1) != 0

- name: Update 1Password tunnel item (controller)
  ansible.builtin.command:
    argv: >-
      {{ cloudflared_op_cmd + ['item', 'edit',
          cloudflared_op_item_title,
          '--vault=' ~ cloudflared_op_vault] + _op_fields }}
  register: _op_item_edit
  changed_when: true
  no_log: true
  become: false
  delegate_to: localhost
  when:
    - cloudflared_op_write | bool
    - _op_item_get.rc | default(1) == 0
