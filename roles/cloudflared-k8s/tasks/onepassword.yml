---
# Push tunnel credentials (credentials.json + raw token) to 1Password Connect.
# Idempotent: looks up the item by title and patches if present, else creates.
#
# Requires: cloudflared_op_connect_host, cloudflared_op_vault,
#           tunnel_token_resp.json.result (b64 token from CF API)
# Token source: cloudflared_op_connect_token if set, otherwise reads
#               cloudflared_op_connect_token_file from the host (the same file
#               1password-connect role writes for ESO bootstrap).
#
# Result: 1Password item with concealed fields `tunnel-token`, `tunnel-secret`,
# `credentials-json`, plus plain-text `tunnel-id` and `account-tag`. ESO is
# expected to pull `credentials-json` into a k8s Secret with key `credentials.json`.

# --- Connect token resolution: prefer var, fall back to file on host ---
- name: Check Connect token file (fallback)
  ansible.builtin.stat:
    path: "{{ cloudflared_op_connect_token_file }}"
  register: _op_token_file
  become: true
  when: cloudflared_op_connect_token == ""

- name: Read Connect token from file (fallback)
  ansible.builtin.slurp:
    src: "{{ cloudflared_op_connect_token_file }}"
  register: _op_token_raw
  become: true
  no_log: true
  when:
    - cloudflared_op_connect_token == ""
    - _op_token_file.stat.exists
    - _op_token_file.stat.size > 0

- name: Set Connect token fact from file
  ansible.builtin.set_fact:
    cloudflared_op_connect_token: "{{ _op_token_raw.content | b64decode | trim }}"
  no_log: true
  when:
    - cloudflared_op_connect_token == ""
    - _op_token_raw is defined
    - _op_token_raw.content is defined

- name: Fail if Connect token unavailable
  ansible.builtin.fail:
    msg: "No 1Password Connect token: set cloudflared_op_connect_token or place token at {{ cloudflared_op_connect_token_file }}"
  when: cloudflared_op_connect_token == ""

- name: Decode tunnel token into credentials.json shape
  ansible.builtin.set_fact:
    _cf_token_raw: "{{ tunnel_token_resp.json.result | b64decode }}"
  no_log: true

- name: Parse decoded token
  ansible.builtin.set_fact:
    _cf_token_obj: "{{ _cf_token_raw | from_json }}"
  no_log: true

- name: Assemble credentials.json blob
  ansible.builtin.set_fact:
    _cf_credentials_json: "{{ {'AccountTag': _cf_token_obj.a, 'TunnelID': _cf_token_obj.t, 'TunnelSecret': _cf_token_obj.s} | to_json }}"
  no_log: true

- name: Resolve 1Password vault id
  ansible.builtin.uri:
    url: "{{ cloudflared_op_connect_host }}/v1/vaults?filter=name eq \"{{ cloudflared_op_vault }}\""
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflared_op_connect_token }}"
    status_code: 200
  register: _op_vault_resp
  no_log: true

- name: Fail if vault not found
  ansible.builtin.fail:
    msg: "1Password vault '{{ cloudflared_op_vault }}' not found via Connect"
  when: (_op_vault_resp.json | default([]) | length) == 0

- name: Set vault id fact
  ansible.builtin.set_fact:
    _op_vault_id: "{{ _op_vault_resp.json[0].id }}"

- name: Look up existing tunnel item by title
  ansible.builtin.uri:
    url: "{{ cloudflared_op_connect_host }}/v1/vaults/{{ _op_vault_id }}/items?filter=title eq \"{{ cloudflared_op_item_title }}\""
    method: GET
    headers:
      Authorization: "Bearer {{ cloudflared_op_connect_token }}"
    status_code: 200
  register: _op_item_lookup
  no_log: true

- name: Build canonical item body
  ansible.builtin.set_fact:
    _op_item_body:
      vault:
        id: "{{ _op_vault_id }}"
      title: "{{ cloudflared_op_item_title }}"
      category: "PASSWORD"
      fields:
        - label: "tunnel-id"
          type: "STRING"
          value: "{{ _cf_token_obj.t }}"
        - label: "account-tag"
          type: "STRING"
          value: "{{ _cf_token_obj.a }}"
        - label: "tunnel-secret"
          type: "CONCEALED"
          value: "{{ _cf_token_obj.s }}"
        - label: "tunnel-token"
          type: "CONCEALED"
          value: "{{ tunnel_token_resp.json.result }}"
        - label: "credentials-json"
          type: "CONCEALED"
          value: "{{ _cf_credentials_json }}"
  no_log: true

- name: Create 1Password tunnel item (new)
  ansible.builtin.uri:
    url: "{{ cloudflared_op_connect_host }}/v1/vaults/{{ _op_vault_id }}/items"
    method: POST
    headers:
      Authorization: "Bearer {{ cloudflared_op_connect_token }}"
      Content-Type: "application/json"
    body_format: json
    body: "{{ _op_item_body }}"
    status_code: [200, 201]
  no_log: true
  when: (_op_item_lookup.json | default([]) | length) == 0

- name: Update 1Password tunnel item (existing)
  ansible.builtin.uri:
    url: "{{ cloudflared_op_connect_host }}/v1/vaults/{{ _op_vault_id }}/items/{{ _op_item_lookup.json[0].id }}"
    method: PUT
    headers:
      Authorization: "Bearer {{ cloudflared_op_connect_token }}"
      Content-Type: "application/json"
    body_format: json
    body: "{{ _op_item_body | combine({'id': _op_item_lookup.json[0].id}) }}"
    status_code: 200
  no_log: true
  when: (_op_item_lookup.json | default([]) | length) > 0
