---
# Upsert the tunnel credentials into 1Password using the `op` CLI with the
# host's service-account token. No Connect token (or any extra secret) is
# written to disk — only the SA token every host already carries.
#
# Requires: _op_bin (resolved op path), tunnel_token_resp.json.result (b64 CF
#           tunnel token), cloudflared_op_vault, cloudflared_op_item_title.
#
# Item fields: password (=tunnel-token, satisfies PASSWORD-category schema),
# tunnel-id, account-tag, tunnel-secret, tunnel-token, credentials-json. ESO
# pulls `credentials-json` into a k8s Secret with key `credentials.json`.

- name: Read op service-account token (for item upsert)
  ansible.builtin.slurp:
    src: "{{ cloudflared_op_service_account_token_file }}"
  register: _op_sa_slurp
  become: "{{ cloudflared_kubectl_become }}"
  no_log: true

- name: Set op service-account token fact
  ansible.builtin.set_fact:
    _op_sa_token: "{{ _op_sa_slurp.content | b64decode | trim }}"
  no_log: true

- name: Decode tunnel token
  ansible.builtin.set_fact:
    _cf_token_obj: "{{ tunnel_token_resp.json.result | b64decode | from_json }}"
  no_log: true

- name: Assemble credentials.json blob
  ansible.builtin.set_fact:
    _cf_credentials_json: "{{ {'AccountTag': _cf_token_obj.a, 'TunnelID': _cf_token_obj.t, 'TunnelSecret': _cf_token_obj.s} | to_json }}"
  no_log: true

# Idempotency: does the item already exist?
- name: Look up existing 1Password item
  ansible.builtin.command:
    argv:
      - "{{ _op_bin }}"
      - item
      - get
      - "{{ cloudflared_op_item_title }}"
      - "--vault={{ cloudflared_op_vault }}"
      - "--format=json"
  environment:
    OP_SERVICE_ACCOUNT_TOKEN: "{{ _op_sa_token }}"
  register: _op_item_get
  changed_when: false
  failed_when: false
  no_log: true

# Field assignments shared by create + edit (op `field[type]=value` syntax).
- name: Build op field assignments
  ansible.builtin.set_fact:
    _op_fields:
      - "password[password]={{ tunnel_token_resp.json.result }}"
      - "tunnel-id[text]={{ _cf_token_obj.t }}"
      - "account-tag[text]={{ _cf_token_obj.a }}"
      - "tunnel-secret[password]={{ _cf_token_obj.s }}"
      - "tunnel-token[password]={{ tunnel_token_resp.json.result }}"
      - "credentials-json[password]={{ _cf_credentials_json }}"
  no_log: true

- name: Create 1Password tunnel item
  ansible.builtin.command:
    argv: >-
      {{ [_op_bin, 'item', 'create',
          '--category=password',
          '--title=' ~ cloudflared_op_item_title,
          '--vault=' ~ cloudflared_op_vault] + _op_fields }}
  environment:
    OP_SERVICE_ACCOUNT_TOKEN: "{{ _op_sa_token }}"
  register: _op_item_create
  changed_when: true
  no_log: true
  when: _op_item_get.rc != 0

- name: Update 1Password tunnel item
  ansible.builtin.command:
    argv: >-
      {{ [_op_bin, 'item', 'edit',
          cloudflared_op_item_title,
          '--vault=' ~ cloudflared_op_vault] + _op_fields }}
  environment:
    OP_SERVICE_ACCOUNT_TOKEN: "{{ _op_sa_token }}"
  register: _op_item_edit
  changed_when: true
  no_log: true
  when: _op_item_get.rc == 0
