---
data_services_state: present

# Network
data_services_tailscale_ip: "100.95.232.41"
data_services_tailscale_cidr: "100.64.0.0/10"

# Filesystem roots
data_services_nvme_root: /opt/olympus
data_services_nfs_archive: /Volumes/ai-hub-data

# PostgreSQL – macOS ships a built-in _postgres at UID 216; use it as-is.
data_services_postgres_uid: 216
data_services_postgres_port: 5432
data_services_postgres_shared_buffers: "4GB"
data_services_postgres_effective_cache: "12GB"
data_services_postgres_max_connections: 200
data_services_postgres_brew_prefix: /opt/homebrew/opt/postgresql@16

# Redis
data_services_redis_uid: 402
data_services_redis_port: 6379

# ClickHouse
data_services_clickhouse_uid: 403
data_services_clickhouse_http_port: 8123
data_services_clickhouse_native_port: 9000
data_services_clickhouse_replication_port: 9009

# Redpanda – _redpanda already exists at UID 204 on ai-hub (created prior to this role)
data_services_redpanda_uid: 204
data_services_redpanda_kafka_port: 9092
data_services_redpanda_admin_port: 9644
data_services_redpanda_proxy_port: 8082
data_services_redpanda_schema_port: 8081

# Ollama
data_services_ollama_uid: 405
data_services_ollama_port: 11434
data_services_ollama_model_dir: "{{ data_services_nvme_root }}/data/ollama"
# Ollama residency/throughput tuning (ai-hub). 24h keeps nomic+llama3.2:3b
# effectively always warm; qwen3:32b (~20G) reloads only after a full idle day.
# MAX_LOADED_MODELS=3 lets all three be co-resident instead of evicting each other.
data_services_ollama_keep_alive: "24h"
data_services_ollama_max_loaded_models: 3
data_services_ollama_num_parallel: 4
# Models warmed after an Ollama (re)start so the first real request is hot.
data_services_ollama_generate_warmup_models:
  - "llama3.2:3b"
  - "qwen3:32b"
data_services_ollama_embed_warmup_models:
  - "nomic-embed-text"
