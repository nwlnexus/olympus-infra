---
# PostgreSQL directories only. Existing directories for retired services
# (data/{redis,clickhouse,ollama}, config/{redis,clickhouse}, logs/...) are left in place.
- name: Create /opt/olympus directory tree
  vars:
    olympus_dirs:
      - {path: "{{ data_services_nvme_root }}/data/postgres", owner: _postgres}
      - {path: "{{ data_services_nvme_root }}/config/postgres", owner: _postgres}
      - {path: "{{ data_services_nvme_root }}/logs/postgres", owner: _postgres}
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: staff
    mode: "0750"
  become: true
  loop: "{{ olympus_dirs }}"
  loop_control:
    label: "{{ item.path }}"
