---
- name: Install postgresql@16
  community.general.homebrew:
    name: postgresql@16
    state: present
  become: false

# ds_pg_password is pre-read by the controller-local play in data-services.yml

- name: Check if PostgreSQL data directory is initialised
  ansible.builtin.stat:
    path: "{{ data_services_nvme_root }}/data/postgres/PG_VERSION"
  register: _pg_data_exists

- name: Initialise PostgreSQL data directory
  ansible.builtin.command:
    cmd: >
      {{ data_services_postgres_brew_prefix }}/bin/initdb
      -D {{ data_services_nvme_root }}/data/postgres
      --username=postgres
      --pwfile=/dev/stdin
      --encoding=UTF8
      --locale=C
  args:
    stdin: "{{ ds_pg_password }}"
  become: true
  become_user: _postgres
  when: not _pg_data_exists.stat.exists

- name: Write postgresql.conf
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "{{ data_services_nvme_root }}/config/postgres/postgresql.conf"
    owner: _postgres
    group: staff
    mode: "0640"
  become: true
  notify: restart postgres

- name: Write pg_hba.conf
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ data_services_nvme_root }}/config/postgres/pg_hba.conf"
    owner: _postgres
    group: staff
    mode: "0640"
  become: true
  notify: restart postgres

# Drift cleanup: Homebrew's own postgresql@16 LaunchAgent (homebrew.mxcl.postgresql@16)
# ran a second postgres against the Homebrew data dir. It was removed by hand on
# 2026-10-20; keep it from coming back. No-op once the plist is gone.
- name: Check for the Homebrew PostgreSQL LaunchAgent
  ansible.builtin.stat:
    path: "/Users/{{ data_services_login_user }}/Library/LaunchAgents/homebrew.mxcl.postgresql@16.plist"
  register: _ds_brew_pg_agent
  become: false

- name: Look up the uid of the login user
  ansible.builtin.command: "id -u {{ data_services_login_user }}"
  become: false
  register: _ds_login_uid
  changed_when: false
  check_mode: false
  when: _ds_brew_pg_agent.stat.exists

- name: Boot out the Homebrew PostgreSQL LaunchAgent
  ansible.builtin.command:
    cmd: "launchctl bootout gui/{{ _ds_login_uid.stdout | trim }}/homebrew.mxcl.postgresql@16"
  become: true
  failed_when: false
  changed_when: true
  when: _ds_brew_pg_agent.stat.exists

- name: Remove the Homebrew PostgreSQL LaunchAgent plist
  ansible.builtin.file:
    path: "/Users/{{ data_services_login_user }}/Library/LaunchAgents/homebrew.mxcl.postgresql@16.plist"
    state: absent
  become: false
  when: _ds_brew_pg_agent.stat.exists

- name: Write PostgreSQL wrapper (waits for the tailnet address)
  ansible.builtin.template:
    src: postgres-serve.j2
    dest: /usr/local/bin/postgres-serve
    owner: root
    group: wheel
    mode: "0755"
  become: true
  register: _ds_pg_wrapper

- name: Write PostgreSQL LaunchDaemon plist
  ansible.builtin.template:
    src: launchdaemon-postgres.plist.j2
    dest: /Library/LaunchDaemons/com.olympus.postgres.plist
    owner: root
    group: wheel
    mode: "0644"
  become: true
  register: _ds_pg_plist

# `launchctl bootout` is asynchronous, so bundle bootout+bootstrap and retry the
# bootstrap until teardown has settled (same approach as roles/ollama).
- name: Reload PostgreSQL LaunchDaemon (new plist or wrapper)
  ansible.builtin.shell: |
    launchctl bootout system/com.olympus.postgres 2>/dev/null || true
    launchctl bootstrap system /Library/LaunchDaemons/com.olympus.postgres.plist
  become: true
  register: _ds_pg_reload
  changed_when: true
  retries: 5
  delay: 3
  until: _ds_pg_reload.rc == 0
  when: _ds_pg_plist is changed or _ds_pg_wrapper is changed

- name: Ensure PostgreSQL LaunchDaemon is loaded
  ansible.builtin.shell: |
    if launchctl print system/com.olympus.postgres >/dev/null 2>&1; then
      echo loaded
    else
      launchctl bootstrap system /Library/LaunchDaemons/com.olympus.postgres.plist && echo bootstrapped
    fi
  become: true
  register: _ds_pg_loaded
  changed_when: "'bootstrapped' in _ds_pg_loaded.stdout"
  when: _ds_pg_plist is not changed and _ds_pg_wrapper is not changed
