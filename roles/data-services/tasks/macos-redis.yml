---
- name: Install redis
  community.general.homebrew:
    name: redis
    state: present

- name: Read redis password from 1Password
  ansible.builtin.command:
    cmd: op read "op://Dev/ai-hub-data-services/redis-password"
  register: _redis_password
  no_log: true
  changed_when: false

- name: Write redis.conf
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ data_services_nvme_root }}/config/redis/redis.conf"
    owner: _redis
    group: staff
    mode: "0600"
  vars:
    redis_password: "{{ _redis_password.stdout }}"
  become: true
  notify: restart redis

- name: Stop existing Homebrew Redis LaunchAgent (if present)
  ansible.builtin.command:
    cmd: launchctl unload -w ~/Library/LaunchAgents/homebrew.mxcl.redis.plist
  ignore_errors: true
  become: false

- name: Write Redis LaunchDaemon plist
  ansible.builtin.template:
    src: launchdaemon-redis.plist.j2
    dest: /Library/LaunchDaemons/com.olympus.redis.plist
    owner: root
    group: wheel
    mode: "0644"
  become: true

- name: Bootstrap Redis LaunchDaemon
  ansible.builtin.command:
    cmd: launchctl bootstrap system /Library/LaunchDaemons/com.olympus.redis.plist
  become: true
  ignore_errors: true
