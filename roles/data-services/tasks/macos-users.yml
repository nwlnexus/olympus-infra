---
# Only PostgreSQL still runs under a dedicated service account. _redis, _clickhouse and
# _ollama are no longer created (existing accounts are left alone); Ollama and LiteLLM
# run as the login user.
- name: Create service system users
  vars:
    service_users:
      - {name: _postgres, uid: "{{ data_services_postgres_uid }}", comment: "PostgreSQL Data Service"}
  block:
    - name: "Create the service account"
      ansible.builtin.command:
        cmd: dscl . -create /Users/{{ item.name }}
      become: true
      ignore_errors: true
      changed_when: false
      loop: "{{ service_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Set UID"
      ansible.builtin.command:
        cmd: dscl . -create /Users/{{ item.name }} UniqueID {{ item.uid }}
      become: true
      ignore_errors: true
      changed_when: false
      loop: "{{ service_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Set GID (staff=20)"
      ansible.builtin.command:
        cmd: dscl . -create /Users/{{ item.name }} PrimaryGroupID 20
      become: true
      ignore_errors: true
      changed_when: false
      loop: "{{ service_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Set shell to /usr/bin/false"
      ansible.builtin.command:
        cmd: dscl . -create /Users/{{ item.name }} UserShell /usr/bin/false
      become: true
      ignore_errors: true
      changed_when: false
      loop: "{{ service_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Set comment"
      ansible.builtin.command:
        cmd: dscl . -create /Users/{{ item.name }} RealName "{{ item.comment }}"
      become: true
      ignore_errors: true
      changed_when: false
      loop: "{{ service_users }}"
      loop_control:
        label: "{{ item.name }}"

    - name: "Set home to /var/empty"
      ansible.builtin.command:
        cmd: dscl . -create /Users/{{ item.name }} NFSHomeDirectory /var/empty
      become: true
      ignore_errors: true
      changed_when: false
      loop: "{{ service_users }}"
      loop_control:
        label: "{{ item.name }}"
