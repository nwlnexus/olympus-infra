---
- name: Remove retired services (Redpanda, Colima)
  ansible.builtin.include_tasks: macos-legacy-cleanup.yml

- name: Create system users
  ansible.builtin.include_tasks: macos-users.yml

- name: Create directory structure
  ansible.builtin.include_tasks: macos-dirs.yml

- name: Configure PostgreSQL
  ansible.builtin.include_tasks: macos-postgres.yml

- name: Configure Redis
  ansible.builtin.include_tasks: macos-redis.yml

- name: Configure ClickHouse
  ansible.builtin.include_tasks: macos-clickhouse.yml

# Ollama is owned by roles/ollama (and LiteLLM by roles/litellm); see
# playbooks/data-services.yml. This role no longer installs a second Ollama daemon.
