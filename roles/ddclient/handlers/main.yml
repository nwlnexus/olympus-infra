---
- name: Restart ddclient (Linux)
  ansible.builtin.systemd:
    name: ddclient
    state: restarted
  become: true
  when: ansible_facts['os_family'] != 'Darwin'
  listen: restart ddclient

# Root brew service (system LaunchDaemon homebrew.mxcl.ddclient): restart it through launchd. `brew services` as
# root refuses to run when it needs to refresh its API cache ("cannot as root"), which failed the first pull.
- name: Restart ddclient (macOS)
  ansible.builtin.command: launchctl kickstart -k system/homebrew.mxcl.ddclient
  become: true
  changed_when: true
  when: ansible_facts['os_family'] == 'Darwin'
  listen: restart ddclient
