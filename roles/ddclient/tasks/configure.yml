---
# Imported from main.yml (see the gate there).
- name: Gather network facts
  ansible.builtin.setup:
    gather_subset: [network]
  when: _ddclient_state == 'present'

- name: Install ddclient (Linux)
  ansible.builtin.apt:
    name: ddclient
    state: present
    update_cache: true
  become: true
  when:
    - _ddclient_state == 'present'
    - ansible_facts['os_family'] != 'Darwin'

- name: Install ddclient (macOS, Homebrew prefix owner only)
  community.general.homebrew:
    name: ddclient
    state: present
  when:
    - _ddclient_state == 'present'
    - ansible_facts['os_family'] == 'Darwin'
    - _ddclient_brew_manage | bool

- name: Stat the ddclient binary (macOS)
  ansible.builtin.stat:
    path: "{{ ddclient_brew_prefix }}/opt/ddclient/bin/ddclient"
    get_checksum: false
  register: _ddclient_bin_stat
  when:
    - _ddclient_state == 'present'
    - ansible_facts['os_family'] == 'Darwin'

- name: Assert ddclient is installed (macOS)
  ansible.builtin.assert:
    that: _ddclient_bin_stat.stat.exists
    fail_msg: >-
      {{ ddclient_brew_prefix }}/opt/ddclient/bin/ddclient is missing. This run's user does not
      own the Homebrew prefix, so it cannot install it: run `brew install ddclient` as the owner.
    quiet: true
  when:
    - _ddclient_state == 'present'
    - ansible_facts['os_family'] == 'Darwin'
    # a --check run as the prefix owner has not installed it yet
    - not (ansible_check_mode and _ddclient_brew_manage | bool)

# Look up zone ID once for all record operations
- name: Look up Cloudflare zone ID
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones?name={{ ddclient_zone }}"
    method: GET
    headers:
      Authorization: "Bearer {{ _ddclient_cf_token }}"
    status_code: 200
  register: _ddclient_zone_resp
  no_log: true
  check_mode: false  # read-only lookup; --check needs its result
  when: _ddclient_state == 'present'

- name: Set zone ID fact
  ansible.builtin.set_fact:
    _ddclient_zone_id: "{{ _ddclient_zone_resp.json.result[0].id }}"
  when:
    - _ddclient_state == 'present'
    - (_ddclient_zone_resp.json.result | default([]) | length) > 0

# Compute the unique zones required by ddclient_extra_fqdns (inferred from
# the FQDN itself — last two labels). Zones already covered by ddclient_zone
# share the existing zone ID; only additional zones need a separate lookup.
- name: Compute extra FQDN zones
  ansible.builtin.set_fact:
    _ddclient_extra_fqdn_zones: >-
      {{ ddclient_extra_fqdns |
         map('regex_replace', '^.*?([^.]+\.[^.]+)$', '\1') |
         unique | reject('equalto', ddclient_zone) | list }}
  when: _ddclient_state == 'present'

- name: Look up zone IDs for extra FQDN zones
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones?name={{ item }}"
    method: GET
    headers:
      Authorization: "Bearer {{ _ddclient_cf_token }}"
    status_code: 200
  register: _ddclient_extra_fqdn_zone_resps
  no_log: true
  check_mode: false  # read-only lookup; --check needs its result
  loop: "{{ _ddclient_extra_fqdn_zones }}"
  when:
    - _ddclient_state == 'present'
    - _ddclient_extra_fqdn_zones | length > 0

# Zone ID map: { zone_name: zone_id }. Starts with the hostname zone then
# merges in any additional zones required by extra_fqdns.
- name: Initialise zone ID map with hostname zone
  ansible.builtin.set_fact:
    _ddclient_zone_id_map: "{{ {ddclient_zone: _ddclient_zone_id} }}"
  when: _ddclient_state == 'present'

- name: Add extra FQDN zone IDs to map
  ansible.builtin.set_fact:
    _ddclient_zone_id_map: >-
      {{ _ddclient_zone_id_map | combine({
           item.item: (item.json.result | default([{}]) | first).id | default('')
         }) }}
  loop: "{{ _ddclient_extra_fqdn_zone_resps.results | default([]) }}"
  no_log: true
  when:
    - _ddclient_state == 'present'
    - _ddclient_extra_fqdn_zones | length > 0

# Build the list of internal FQDNs in ddclient_zone for the conf template.
- name: Build internal FQDN list for hostname zone
  ansible.builtin.set_fact:
    _ddclient_internal_fqdns: >-
      {{ [ansible_facts['hostname'] + '.' + ddclient_zone] +
         (ddclient_extra_fqdns |
          select('match', '.*\\.' + ddclient_zone + '$') | list) }}
  when: _ddclient_state == 'present'

# --- Seed A records (idempotent: create if absent, skip if present) ---

# The public record is seeded with the public IP (same service as the template's
# use=web); the LAN address is only a fallback. ddclient keeps both current afterwards.
- name: Look up the public IPv4 address
  ansible.builtin.uri:
    url: https://api.ipify.org/?format=json
    method: GET
    return_content: true
    status_code: 200
  register: _ddclient_public_ip_resp
  check_mode: false  # read-only lookup
  failed_when: false
  when: _ddclient_state == 'present'

- name: Set the public record seed address
  ansible.builtin.set_fact:
    _ddclient_public_seed_ip: >-
      {{ (_ddclient_public_ip_resp.json | default({})).ip
         | default(ansible_facts['default_ipv4']['address'], true) }}
  when: _ddclient_state == 'present'

- name: Check existing public A record
  ansible.builtin.uri:
    url: >-
      https://api.cloudflare.com/client/v4/zones/{{ _ddclient_zone_id
      }}/dns_records?type=A&name={{ ansible_facts['hostname']
      }}.{{ ddclient_subdomain }}.{{ ddclient_zone }}
    method: GET
    headers:
      Authorization: "Bearer {{ _ddclient_cf_token }}"
    status_code: 200
  register: _ddclient_public_check
  no_log: true
  check_mode: false  # read-only lookup; --check needs its result
  when: _ddclient_state == 'present'

- name: Create public A record
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ _ddclient_zone_id }}/dns_records"
    method: POST
    headers:
      Authorization: "Bearer {{ _ddclient_cf_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      type: A
      name: "{{ ansible_facts['hostname'] }}.{{ ddclient_subdomain }}.{{ ddclient_zone }}"
      content: "{{ _ddclient_public_seed_ip }}"
      ttl: "{{ ddclient_ttl }}"
      proxied: false
    status_code: 200
  no_log: true
  when:
    - _ddclient_state == 'present'
    - (_ddclient_public_check.json.result | default([]) | length) == 0

- name: Check existing hostname-zone internal A records
  ansible.builtin.uri:
    url: >-
      https://api.cloudflare.com/client/v4/zones/{{ _ddclient_zone_id }}/dns_records?type=A&name={{ item }}
    method: GET
    headers:
      Authorization: "Bearer {{ _ddclient_cf_token }}"
    status_code: 200
  register: _ddclient_internal_checks
  no_log: true
  check_mode: false  # read-only lookup; --check needs its result
  loop: "{{ _ddclient_internal_fqdns }}"
  when: _ddclient_state == 'present'

- name: Create missing hostname-zone internal A records
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ _ddclient_zone_id }}/dns_records"
    method: POST
    headers:
      Authorization: "Bearer {{ _ddclient_cf_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      type: A
      name: "{{ item.item }}"
      content: "{{ ansible_facts['default_ipv4']['address'] }}"
      ttl: "{{ ddclient_ttl }}"
      proxied: false
    status_code: 200
  no_log: true
  loop: "{{ _ddclient_internal_checks.results | default([]) }}"
  when:
    - _ddclient_state == 'present'
    - (item.json.result | default([]) | length) == 0

# Names only (no token): with --check the create tasks above are skipped (uri has no
# check mode) and their output is censored, so this says what a real run would create.
- name: Report hostname-zone A records this run creates
  ansible.builtin.debug:
    msg: >-
      {{ ([ansible_facts['hostname'] ~ '.' ~ ddclient_subdomain ~ '.' ~ ddclient_zone ~ ' (public, seed '
           ~ _ddclient_public_seed_ip ~ ')']
          if (_ddclient_public_check.json.result | default([]) | length) == 0 else [])
         + ((_ddclient_internal_checks.results | default([])
             | selectattr('json', 'defined')
             | rejectattr('json.result')
             | map(attribute='item') | list)
            | map('regex_replace', '$', ' (internal, ' ~ ansible_facts['default_ipv4']['address'] ~ ')')
            | list) }}
  when: _ddclient_state == 'present'

# Seed extra FQDNs that live in zones OTHER than ddclient_zone.
- name: Check existing cross-zone extra FQDN A records
  ansible.builtin.uri:
    url: >-
      https://api.cloudflare.com/client/v4/zones/{{
        _ddclient_zone_id_map[item | regex_replace('^.*?([^.]+\.[^.]+)$', '\1')] | default('')
      }}/dns_records?type=A&name={{ item }}
    method: GET
    headers:
      Authorization: "Bearer {{ _ddclient_cf_token }}"
    status_code: 200
  register: _ddclient_cross_zone_checks
  no_log: true
  check_mode: false  # read-only lookup; --check needs its result
  loop: >-
    {{ ddclient_extra_fqdns |
       reject('match', '.*\.' + ddclient_zone + '$') | list }}
  when:
    - _ddclient_state == 'present'
    - _ddclient_extra_fqdn_zones | length > 0

- name: Create missing cross-zone extra FQDN A records
  ansible.builtin.uri:
    url: >-
      https://api.cloudflare.com/client/v4/zones/{{
        _ddclient_zone_id_map[item.item | regex_replace('^.*?([^.]+\.[^.]+)$', '\1')] | default('')
      }}/dns_records
    method: POST
    headers:
      Authorization: "Bearer {{ _ddclient_cf_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      type: A
      name: "{{ item.item }}"
      content: "{{ ansible_facts['default_ipv4']['address'] }}"
      ttl: "{{ ddclient_ttl }}"
      proxied: false
    status_code: 200
  no_log: true
  loop: "{{ _ddclient_cross_zone_checks.results | default([]) }}"
  when:
    - _ddclient_state == 'present'
    - _ddclient_extra_fqdn_zones | length > 0
    - (item.json.result | default([]) | length) == 0

# --- Extra public records (cross-zone) ---

- name: Look up Cloudflare zone IDs for extra public records
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones?name={{ item }}"
    method: GET
    headers:
      Authorization: "Bearer {{ _ddclient_cf_token }}"
    status_code: 200
  register: _ddclient_extra_zone_resps
  no_log: true
  check_mode: false  # read-only lookup; --check needs its result
  loop: "{{ ddclient_extra_public_records | map(attribute='zone') | unique | list }}"
  when:
    - _ddclient_state == 'present'
    - ddclient_extra_public_records | length > 0

- name: Check existing extra public A records
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ _extra_zone_id }}/dns_records?type=A&name={{ item.fqdn }}"
    method: GET
    headers:
      Authorization: "Bearer {{ _ddclient_cf_token }}"
    status_code: 200
  vars:
    _extra_zone_id: >-
      {{ ((_ddclient_extra_zone_resps.results
           | selectattr('item', 'equalto', item.zone)
           | list | first).json.result | default([]) | first | default({})).id | default('') }}
  register: _ddclient_extra_checks
  no_log: true
  check_mode: false  # read-only lookup; --check needs its result
  loop: "{{ ddclient_extra_public_records }}"
  when:
    - _ddclient_state == 'present'
    - ddclient_extra_public_records | length > 0

- name: Create missing extra public A records
  ansible.builtin.uri:
    url: "https://api.cloudflare.com/client/v4/zones/{{ _extra_zone_id }}/dns_records"
    method: POST
    headers:
      Authorization: "Bearer {{ _ddclient_cf_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      type: A
      name: "{{ item.item.fqdn }}"
      content: "{{ ansible_facts['default_ipv4']['address'] }}"
      ttl: "{{ ddclient_ttl }}"
      proxied: false
    status_code: 200
  vars:
    _extra_zone_id: >-
      {{ ((_ddclient_extra_zone_resps.results
           | selectattr('item', 'equalto', item.item.zone)
           | list | first).json.result | default([]) | first | default({})).id | default('') }}
  no_log: true
  loop: "{{ _ddclient_extra_checks.results | default([]) }}"
  when:
    - _ddclient_state == 'present'
    - ddclient_extra_public_records | length > 0
    - (item.json.result | default([]) | length) == 0

# --- ddclient config ---

- name: Render ddclient.conf (Linux)
  ansible.builtin.template:
    src: ddclient.conf.j2
    dest: "{{ _ddclient_conf_path }}"
    owner: root
    group: root
    mode: '0600'
  become: true
  notify: restart ddclient
  when:
    - _ddclient_state == 'present'
    - ansible_facts['os_family'] != 'Darwin'

# The service is a root LaunchDaemon, so the config is root's; the pull user (not the
# Homebrew owner) cannot write under the prefix without become anyway.
- name: Render ddclient.conf (macOS)
  ansible.builtin.template:
    src: ddclient.conf.j2
    dest: "{{ _ddclient_conf_path }}"
    owner: root
    group: wheel
    mode: '0600'
  become: true
  notify: restart ddclient
  when:
    - _ddclient_state == 'present'
    - ansible_facts['os_family'] == 'Darwin'

# ddclient 4.x never reads the 3.x path; a config left there only keeps a token copy.
- name: Remove the ddclient 3.x config path (macOS)
  ansible.builtin.file:
    path: "{{ ddclient_brew_prefix }}/etc/ddclient.conf"
    state: absent
  become: true
  when:
    - _ddclient_state == 'present'
    - ansible_facts['os_family'] == 'Darwin'

- name: Enable and start ddclient (Linux)
  ansible.builtin.systemd:
    name: ddclient
    enabled: true
    state: started
  become: true
  when:
    - _ddclient_state == 'present'
    - ansible_facts['os_family'] != 'Darwin'

# Homebrew's service for ddclient is a root LaunchDaemon (system domain): `brew services`
# run as a non-root user does not see it, so check launchd directly.
- name: Check the ddclient LaunchDaemon (macOS)
  ansible.builtin.command: launchctl print system/homebrew.mxcl.ddclient
  become: true
  register: _ddclient_svc_status
  changed_when: false
  failed_when: false
  check_mode: false  # read-only
  when:
    - _ddclient_state == 'present'
    - ansible_facts['os_family'] == 'Darwin'

- name: Start ddclient as a root brew service (macOS)
  ansible.builtin.command: "{{ ddclient_brew_prefix }}/bin/brew services start ddclient"
  become: true
  environment:
    HOMEBREW_NO_AUTO_UPDATE: "1"
    HOMEBREW_NO_ANALYTICS: "1"
  changed_when: true
  when:
    - _ddclient_state == 'present'
    - ansible_facts['os_family'] == 'Darwin'
    - _ddclient_svc_status.rc | default(1) != 0
