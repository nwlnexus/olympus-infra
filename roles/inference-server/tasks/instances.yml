---
- name: Create the cache directory (shader caches, HOME of the service account)
  ansible.builtin.file:
    path: "{{ inference_server_cache_dir }}"
    state: directory
    owner: "{{ inference_server_user }}"
    group: "{{ inference_server_group }}"
    mode: "0750"
  become: true

- name: Deploy llama-server wrapper scripts
  ansible.builtin.template:
    src: inference-server-serve.j2
    dest: "/usr/local/bin/inference-server-serve-{{ _instance.name }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  loop: "{{ inference_server_instances }}"
  loop_control:
    loop_var: _instance
    label: "{{ _instance.name }}"
  register: _inference_server_wrappers

- name: Deploy llama-server systemd units
  ansible.builtin.template:
    src: inference-server.service.j2
    dest: "/etc/systemd/system/inference-server-{{ _instance.name }}.service"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop: "{{ inference_server_instances }}"
  loop_control:
    loop_var: _instance
    label: "{{ _instance.name }}"
  register: _inference_server_units
  notify: Reload systemd

# ── Connection caps (bounded queue) ───────────────────────────────────────────
- name: Deploy the nftables connection caps
  ansible.builtin.template:
    src: inference-server-limits.nft.j2
    dest: "{{ inference_server_limits_file }}"
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  become: true
  register: _inference_server_limits
  when: inference_server_connection_limit_enabled | bool

- name: Deploy the connection-cap unit
  ansible.builtin.template:
    src: inference-server-limits.service.j2
    dest: /etc/systemd/system/inference-server-limits.service
    owner: root
    group: root
    mode: "0644"
  become: true
  register: _inference_server_limits_unit
  notify: Reload systemd
  when: inference_server_connection_limit_enabled | bool

- name: Flush handlers (daemon-reload before enabling units)
  ansible.builtin.meta: flush_handlers

- name: Enable the connection caps and (re)load them when the rules changed
  ansible.builtin.systemd:
    name: inference-server-limits.service
    enabled: true
    state: "{{ 'restarted' if (_inference_server_limits is changed or _inference_server_limits_unit is changed) else 'started' }}"
  become: true
  when: inference_server_connection_limit_enabled | bool

- name: Disable the connection caps
  ansible.builtin.systemd:
    name: inference-server-limits.service
    enabled: false
    state: stopped
  become: true
  failed_when: false
  when: not (inference_server_connection_limit_enabled | bool)

# ── Start: restart changed instances, start the rest, never touch a running unchanged one ──
- name: Enable and start the instances; restart those whose wrapper, unit or build changed
  ansible.builtin.systemd:
    name: "inference-server-{{ _instance.name }}.service"
    enabled: true
    state: "{{ 'restarted' if (_inference_server_wrappers.results[_idx] is changed or _inference_server_units.results[_idx] is changed or _inference_server_link is changed) else 'started' }}"
  become: true
  register: _inference_server_started
  loop: "{{ inference_server_instances }}"
  loop_control:
    loop_var: _instance
    index_var: _idx
    label: "{{ _instance.name }}"

# ── Prune instances that left the list ────────────────────────────────────────
- name: Find llama-server instance units
  ansible.builtin.find:
    paths: /etc/systemd/system
    patterns: "inference-server-*.service"
    excludes: ["inference-server-limits.service", "inference-server-watchdog.service"]
  register: _inference_server_found_units

- name: Stop, disable and remove stale instances
  ansible.builtin.shell: |
    systemctl disable --now {{ _unit | quote }} 2>/dev/null || true
    rm -f {{ item.path | quote }} /usr/local/bin/inference-server-serve-{{ _name | quote }}
    systemctl daemon-reload
  become: true
  changed_when: true
  vars:
    _unit: "{{ item.path | basename }}"
    _name: "{{ _unit | regex_replace('^inference-server-', '') | regex_replace('\\.service$', '') }}"
  loop: "{{ _inference_server_found_units.files }}"
  loop_control:
    label: "{{ _unit }}"
  when: _name not in (inference_server_instances | map(attribute='name') | list)

# ── Readiness and probes (skipped in --check) ─────────────────────────────────
- name: Collect the instances started by this run
  ansible.builtin.set_fact:
    _inference_server_probe_names: >-
      {{ (inference_server_instances | map(attribute='name') | list)
         if inference_server_probe_mode == 'always'
         else [] if inference_server_probe_mode == 'never'
         else _inference_server_started.results
              | selectattr('changed', 'defined') | selectattr('changed')
              | map(attribute='_instance') | map(attribute='name') | unique | list }}

- name: Wait for llama-server /health to return 200
  ansible.builtin.uri:
    url: "http://{{ inference_server_api_host }}:{{ _instance.port }}/health"
    method: GET
    status_code: [200]
  register: _inference_server_health
  until: _inference_server_health.status == 200
  retries: "{{ inference_server_ready_retries }}"
  delay: "{{ inference_server_ready_delay }}"
  loop: "{{ inference_server_instances }}"
  loop_control:
    loop_var: _instance
    label: "{{ _instance.name }}"
  when: not ansible_check_mode

- name: Probe chat instances with a strict json_schema request
  ansible.builtin.uri:
    url: "http://{{ inference_server_api_host }}:{{ _instance.port }}/v1/chat/completions"
    method: POST
    body_format: json
    body:
      model: "{{ _instance.alias }}"
      messages:
        - role: user
          content: 'Reply with the JSON object {"ok": true} and nothing else.'
      temperature: 0
      max_tokens: 64
      response_format:
        type: json_schema
        json_schema:
          name: probe
          strict: true
          schema:
            type: object
            properties:
              ok:
                type: boolean
            required: [ok]
            additionalProperties: false
    status_code: [200]
    timeout: "{{ inference_server_probe_timeout }}"
  register: _inference_server_chat_probe
  changed_when: false
  failed_when: >-
    _inference_server_chat_probe.status != 200
    or not ((_inference_server_chat_probe.json.choices[0].message.content | from_json).ok is boolean)
  loop: "{{ inference_server_instances | selectattr('kind', 'equalto', 'chat') | list }}"
  loop_control:
    loop_var: _instance
    label: "{{ _instance.name }}"
  when:
    - not ansible_check_mode
    - _instance.name in _inference_server_probe_names

- name: Probe embedding instances for the expected dimension
  ansible.builtin.uri:
    url: "http://{{ inference_server_api_host }}:{{ _instance.port }}/v1/embeddings"
    method: POST
    body_format: json
    body:
      model: "{{ _instance.alias }}"
      input: "ok"
    status_code: [200]
    timeout: "{{ inference_server_probe_timeout }}"
  register: _inference_server_embed_probe
  changed_when: false
  failed_when: >-
    _inference_server_embed_probe.status != 200
    or (_inference_server_embed_probe.json.data[0].embedding | length) != (_instance.embed_dim | int)
  loop: "{{ inference_server_instances | selectattr('kind', 'equalto', 'embed') | list }}"
  loop_control:
    loop_var: _instance
    label: "{{ _instance.name }}"
  when:
    - not ansible_check_mode
    - _instance.name in _inference_server_probe_names
