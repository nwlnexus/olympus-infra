---
# macOS: no native iSCSI initiator (removed by Apple).
# NFSv4 from QNAP requires additional configuration on the NAS side.
# For now, data directory is created on local disk (927GB available on ai-hub).
# QNAP NFS integration can be added in a future pass once NFSv4 exports are configured.

- name: Create data directory on local disk
  ansible.builtin.file:
    path: "{{ iscsi_mount_path }}"
    state: directory
    mode: "0755"
  become: true
