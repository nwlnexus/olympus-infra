---
k3s_state: present
k3s_version: ""  # must be set to an exact release (see inventory/group_vars/all.yml); install asserts it
k3s_config_dir: /etc/rancher/k3s
k3s_kubeconfig_path: /etc/rancher/k3s/k3s.yaml
k3s_kubeconfig_users:
  - nwilliams-lucas
  - ansible
# Extra SANs added to the k3s API server TLS cert.
# Allows remote kubectl access via FQDN without TLS errors (k3s CA already in kubeconfig).
k3s_tls_san: []
# List of bundled k3s components to disable (e.g. [traefik], [traefik, servicelb]).
k3s_disable: []
# Node IPv4 address, pinned as `node-ip` in /etc/rancher/k3s/config.yaml (a
# marked block; see tasks/node-ip.yml). Set per host in host_vars. Empty =
# k3s picks the address from the default route at each start, which can pick
# IPv6 if DHCPv4 is late. Changing it needs a k3s restart, one server at a time.
k3s_node_ip: ""
# kubelet arguments, written as a marked `kubelet-arg:` block in
# /etc/rancher/k3s/config.yaml (tasks/kubelet-args.yml). Used to reserve memory/CPU
# for the kubelet and system daemons (etcd, containerd) and to evict workload pods
# BEFORE the node runs out of memory: without them allocatable equals capacity, there
# is no memory eviction threshold, and CI runner pods (olympus-gitops arc) could
# push a control-plane node into a kernel OOM. Empty = leave the file alone.
# Changing it needs a k3s restart, one server at a time, checking
# scripts/k3s-health-gate.sh before the next.
k3s_kubelet_args: []
# If set, patches kubeconfig server URL from 127.0.0.1:6443 to this FQDN.
# Should match one of the entries in k3s_tls_san.
k3s_external_server: ""

# --- HA cluster settings (compute-hub) ---
# Set k3s_ha: true to enable HA mode. All HA settings are ignored when false.
k3s_ha: false
# Whether this node is a server (true) vs standalone single-node install (false).
# On the primary node: k3s_primary=true, k3s_init=true → runs --cluster-init.
# On secondary nodes: k3s_primary=false, k3s_init=false → joins via VIP.
k3s_primary: false
k3s_init: false   # only one node in the cluster should have this true
# Virtual IP managed by kube-vip (ARP mode). Must be within an L2-reachable subnet.
# kube-vip runs as a DaemonSet on the servers and binds to each node's
# default-route interface, so there is no interface setting.
k3s_vip: ""
# 1Password reference for the shared cluster token.
# Created with: openssl rand -hex 32, stored in 1Password, referenced as:
#   op://Dev/compute-hub-k3s-token/password
k3s_token_op_ref: ""
# Export kubeconfig to 1Password after cluster init (primary only).
# Leave empty to skip. Enables management-hub Headlamp to import the cluster.
k3s_kubeconfig_op_item: ""
k3s_kubeconfig_op_vault: "Dev"

# --- Agent (worker) mode ---
# Set k3s_agent: true to join this node as a worker (agent) instead of a server.
# Mutually exclusive with k3s_ha/k3s_primary (a node is a server XOR an agent).
k3s_agent: false
# API endpoint an agent joins — the control-plane VIP or a server URL.
# e.g. https://192.168.253.2:6443
k3s_server_url: ""

# --- Node labels & taints ---
# Applied via config.yaml at first registration, and reconciled via kubectl on
# servers (config.yaml node-label/taint only takes effect at initial join).
# Labels: "key=value". Taints: "key=value:Effect" (Effect = NoSchedule|NoExecute|PreferNoSchedule).
k3s_node_labels: []
k3s_node_taints: []

# --- etcd snapshots (HA servers) → off-box dir (e.g. a QNAP NFS mount) ---
# Empty => k3s default (local /var/lib/rancher/k3s/server/db/snapshots).
# The dir must already be mounted (handled by the nfs-mounts role / a prereq).
k3s_etcd_snapshot_dir: ""
k3s_etcd_snapshot_schedule: "0 */6 * * *"
k3s_etcd_snapshot_retention: 20

# Servers only: remove the old traefik/servicelb *.yaml.skip files (and restart k3s
# if one was removed). false on servers joining a live cluster.
k3s_remove_disable_skip_files: true

# Servers only: delete traefik.io CRDs that are not labelled as Helm-managed (left
# over from a user-managed Traefik install). This is a CLUSTER-WIDE delete from
# whichever server runs the role (Traefik is Flux-managed now), so it is opt-in:
# set true only for a one-off cleanup, on purpose.
k3s_cleanup_orphan_traefik_crds: false

# --- etcd metrics (HA servers; tasks/etcd-metrics.yml) ---
# true writes `etcd-expose-metrics: true` as a marked block in config.yaml, so the
# embedded etcd also serves /metrics on <node-ip>:2381 (k3s default: 127.0.0.1 only),
# and installs an nftables table that lets only loopback, the pod network and the
# cluster nodes reach that port. Off by default. The k3s role is push-only (never in
# ansible-pull), and the task never restarts k3s: k3s reads the file at start, so
# restart one server at a time with scripts/k3s-health-gate.sh between servers.
k3s_etcd_expose_metrics: false
k3s_etcd_metrics_port: 2381
# Sources allowed to reach the metrics port, besides loopback: the pod network
# (a scrape from a pod on the same node keeps its pod address) and every cluster
# node's address (a scrape from a pod on another node is masqueraded to that
# node's address). Node addresses come from k3s_node_ip of the hosts in these
# inventory groups (ansible_host when unset).
k3s_etcd_metrics_allowed_cidrs:
  - "10.42.0.0/16"
k3s_etcd_metrics_node_groups:
  - k3s_servers
  - k3s_agents
  - k3s_mac_agents
k3s_etcd_metrics_nft_file: /etc/olympus/etcd-metrics.nft

# --- Kubernetes API audit log (HA servers; tasks/audit-log.yml) ---
# true writes the audit policy (templates/audit-policy.yaml.j2) and the log
# directory, then a marked `kube-apiserver-arg:` block in config.yaml that points
# kube-apiserver at them. Off by default; false removes the block and keeps the
# policy file and the logs. Never restarts k3s: k3s reads the file at start, so
# restart one server at a time with scripts/k3s-health-gate.sh between servers.
# The block is the only `kube-apiserver-arg` key the role writes (a second
# top-level key would silently replace the first list).
k3s_audit_log_enabled: false
k3s_audit_policy_path: /var/lib/rancher/k3s/server/audit.yaml
k3s_audit_log_dir: /var/lib/rancher/k3s/server/logs
# kube-apiserver rotation: days to keep, rotated files to keep, MB per file.
# Disk bound per server: maxsize x (maxbackup + 1) = 600 MB with these values.
k3s_audit_log_maxage: 7
k3s_audit_log_maxbackup: 5
k3s_audit_log_maxsize: 100
# Identities whose every request (reads included) is recorded at Metadata level,
# ahead of the noise rules. An empty list omits the rule.
k3s_audit_always_log_users:
  - "system:serviceaccount:atlas-system:k8s-mcp"
k3s_audit_always_log_groups:
  - "olympus:agents-view"
# Leases in kube-system whose get/update is never logged, matched by name for every
# user: the kube-vip control-plane and Service elections, whose client uses the admin
# identity (so it cannot be dropped by user). Create/delete are still logged. An
# empty list omits the rule.
k3s_audit_drop_lease_names:
  - "plndr-cp-lock"
  - "plndr-svcs-lock"
# Always-recorded users whose API discovery reads (GET /api, /apis and below) are
# not recorded: the Kubernetes MCP server polls discovery about eight times a
# minute. Its resource requests stay recorded (rule b). An empty list omits the rule.
k3s_audit_discovery_drop_users:
  - "system:serviceaccount:atlas-system:k8s-mcp"
# Endpoints objects used as a leader-election lock: get/update/patch of that named
# object by the ServiceAccounts of its namespace is not recorded (the NFS
# provisioner renews its lock about 30 times a minute). One rule per entry.
k3s_audit_drop_election_endpoints:
  - namespace: "nfs-provisioner"
    name: "cluster.local-nfs-provisioner-nfs-subdir-external-provisioner"
# Routine update/patch by the ServiceAccounts of a namespace to the listed resources
# of one API group (create and delete stay recorded). The runner-scale-set
# listeners patch their EphemeralRunnerSet whenever the job count changes.
k3s_audit_drop_sa_writes:
  - namespace: "arc-system"
    group: "actions.github.com"
    resources: ["ephemeralrunnersets"]
# API groups whose status subresource writes (*/status, update/patch) by nodes,
# ServiceAccounts and the control plane are not recorded ("" is the core group). A
# policy rule matches API groups exactly, so each group is listed. An empty list
# omits the two rules (kubelet heartbeats would then be recorded).
k3s_audit_machine_status_groups:
  - ""
  - "apps"
  - "batch"
  - "policy"
  - "autoscaling"
  - "networking.k8s.io"
  - "storage.k8s.io"
  - "kustomize.toolkit.fluxcd.io"
  - "helm.toolkit.fluxcd.io"
  - "source.toolkit.fluxcd.io"
  - "notification.toolkit.fluxcd.io"
  - "actions.github.com"
  - "external-secrets.io"
  - "cert-manager.io"
