---
# Export the VIP-patched admin kubeconfig of the HA primary to 1Password: the owner's
# break-glass cluster access (olympus-sdk#413).
#
# Fleet hosts never write to 1Password (owner decision 2026-11-17, olympus-sdk#1000). The host
# only hands its kubeconfig to the controller (slurp). The controller patches it in memory (no
# kubeconfig on any command line) and writes the document with its own `op` sign-in.
# Owner-run: playbooks/push/export-kubeconfig.yml (sets k3s_kubeconfig_export).
#
# Included from linux.yml (when: k3s_kubeconfig_export) or straight from the push playbook,
# so caller-scope facts (k3s_vip, k3s_kubeconfig_op_item) still resolve.

- name: Read system kubeconfig (primary)
  ansible.builtin.slurp:
    src: "{{ k3s_kubeconfig_path }}"
  register: _k3s_kubeconfig_b64
  become: true
  no_log: true

- name: Parse the kubeconfig
  ansible.builtin.set_fact:
    _k3s_kc: "{{ _k3s_kubeconfig_b64.content | b64decode | from_yaml }}"
    _k3s_kc_ctx: "{{ k3s_context_name | default(k3s_kubeconfig_op_item) }}"
    _k3s_kc_server: "https://{{ k3s_external_server | default(k3s_vip) }}:6443"
  no_log: true

- name: Patch kubeconfig server URL and rename context/cluster/user
  ansible.builtin.set_fact:
    _k3s_kubeconfig_patched: >-
      {{ _k3s_kc | combine({
           'clusters': [_k3s_kc.clusters[0] | combine({
               'name': _k3s_kc_ctx ~ '-cluster',
               'cluster': _k3s_kc.clusters[0].cluster | combine({'server': _k3s_kc_server})})],
           'contexts': [{
               'name': _k3s_kc_ctx,
               'context': _k3s_kc.contexts[0].context | combine({
                   'cluster': _k3s_kc_ctx ~ '-cluster',
                   'user': _k3s_kc_ctx ~ '-user'})}],
           'users': [_k3s_kc.users[0] | combine({'name': _k3s_kc_ctx ~ '-user'})],
           'current-context': _k3s_kc_ctx}) | to_nice_yaml(indent=2) }}
  no_log: true

# `op` refuses document create/edit under 1Password Connect, so the Connect variables are
# dropped; the document goes in on stdin.
- name: Check if kubeconfig document already exists in 1Password (controller)
  ansible.builtin.command:
    argv:
      - env
      - -u
      - OP_CONNECT_HOST
      - -u
      - OP_CONNECT_TOKEN
      - op
      - item
      - get
      - "{{ k3s_kubeconfig_op_item }}"
      - "--vault={{ k3s_kubeconfig_op_vault }}"
      - --format=json
  register: _k3s_op_doc_check
  failed_when: false
  changed_when: false
  check_mode: false
  no_log: true
  become: false
  delegate_to: localhost

- name: Create kubeconfig document in 1Password (first time, controller)
  ansible.builtin.command:
    argv:
      - env
      - -u
      - OP_CONNECT_HOST
      - -u
      - OP_CONNECT_TOKEN
      - op
      - document
      - create
      - "-"
      - "--title={{ k3s_kubeconfig_op_item }}"
      - "--vault={{ k3s_kubeconfig_op_vault }}"
      - "--file-name={{ k3s_kubeconfig_op_item }}.yaml"
    stdin: "{{ _k3s_kubeconfig_patched }}"
  no_log: true
  changed_when: true
  become: false
  delegate_to: localhost
  when: _k3s_op_doc_check.rc != 0

- name: Update kubeconfig document in 1Password (controller)
  ansible.builtin.command:
    argv:
      - env
      - -u
      - OP_CONNECT_HOST
      - -u
      - OP_CONNECT_TOKEN
      - op
      - document
      - edit
      - "{{ k3s_kubeconfig_op_item }}"
      - "-"
      - "--vault={{ k3s_kubeconfig_op_vault }}"
    stdin: "{{ _k3s_kubeconfig_patched }}"
  no_log: true
  changed_when: true
  become: false
  delegate_to: localhost
  when: _k3s_op_doc_check.rc == 0
