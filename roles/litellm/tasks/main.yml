---
- name: Install pipx via Homebrew
  community.general.homebrew:
    name: pipx
    state: "{{ 'present' if litellm_state == 'present' else 'absent' }}"

- name: Install python@3.13 via Homebrew (LiteLLM dep — orjson/pyo3 doesn't support 3.14 yet)
  community.general.homebrew:
    name: python@3.13
    state: "{{ 'present' if litellm_state == 'present' else 'absent' }}"

- name: Check if LiteLLM proxy server module is importable
  # An existing 'pipx install litellm' (no extras) is missing websockets/uvicorn/fastapi
  # and crashes at startup. Detect that state explicitly.
  ansible.builtin.command: /opt/homebrew/bin/pipx runpip litellm show websockets
  register: _litellm_websockets_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: litellm_state == "present"

- name: Uninstall existing LiteLLM venv (proxy deps missing — rebuild with python@3.13)
  ansible.builtin.command: /opt/homebrew/bin/pipx uninstall litellm
  register: _litellm_uninstall
  changed_when: _litellm_uninstall.rc == 0
  failed_when: false
  when:
    - litellm_state == "present"
    - _litellm_websockets_check.rc != 0

- name: Reinstall LiteLLM with [proxy] extras on python@3.13
  ansible.builtin.command: /opt/homebrew/bin/pipx install --python /opt/homebrew/opt/python@3.13/bin/python3.13 "litellm[proxy]"
  register: litellm_reinstall
  changed_when: "'installed package litellm' in (litellm_reinstall.stdout | default(''))"
  when:
    - litellm_state == "present"
    - _litellm_websockets_check.rc != 0

- name: Install LiteLLM via pipx with [proxy] extras (fresh install)
  ansible.builtin.command: /opt/homebrew/bin/pipx install --python /opt/homebrew/opt/python@3.13/bin/python3.13 "litellm[proxy]"
  register: litellm_install
  changed_when: "'installed package litellm' in (litellm_install.stdout | default(''))"
  failed_when:
    - litellm_install.rc != 0
    - "'already installed' not in (litellm_install.stdout | default(''))"
  when:
    - litellm_state == "present"
    - _litellm_websockets_check.rc == 0

- name: Uninstall LiteLLM via pipx
  ansible.builtin.command: /opt/homebrew/bin/pipx uninstall litellm
  register: litellm_uninstall
  changed_when: litellm_uninstall.rc == 0
  failed_when: false
  when: litellm_state == "absent"

# ── Secrets: `op read` on the host, authenticated by the service-account token that
# ansible-pull already uses. No Connect host/token, nothing on a command line.
# check_mode: false so --check can render the config; values are never logged.
- name: Read the 1Password service-account token
  ansible.builtin.slurp:
    src: "{{ litellm_op_token_file }}"
  register: _litellm_op_token
  become: true
  no_log: true
  check_mode: false
  when: litellm_state == "present"

- name: Fetch LiteLLM master key from 1Password
  ansible.builtin.command:
    argv:
      - "{{ litellm_op_bin }}"
      - read
      - "{{ litellm_master_key_op_ref }}"
  environment:
    OP_SERVICE_ACCOUNT_TOKEN: "{{ _litellm_op_token.content | b64decode | trim }}"
  register: _litellm_master_key
  no_log: true
  changed_when: false
  check_mode: false
  when: litellm_state == "present"

- name: Fetch LiteLLM Anthropic API key from 1Password (coder-cloud)
  ansible.builtin.command:
    argv:
      - "{{ litellm_op_bin }}"
      - read
      - "{{ litellm_anthropic_key_op_ref }}"
  environment:
    OP_SERVICE_ACCOUNT_TOKEN: "{{ _litellm_op_token.content | b64decode | trim }}"
  register: _litellm_anthropic_api_key
  no_log: true
  changed_when: false
  check_mode: false
  when:
    - litellm_state == "present"
    - litellm_coder_cloud_enabled | bool

- name: Set LiteLLM key facts
  ansible.builtin.set_fact:
    litellm_master_key: "{{ _litellm_master_key.stdout | trim }}"
    litellm_anthropic_api_key: "{{ (_litellm_anthropic_api_key.stdout | default('')) | trim }}"
  no_log: true
  when: litellm_state == "present"

- name: Refuse to render LiteLLM without a master key
  ansible.builtin.assert:
    that: litellm_master_key | length > 0
    fail_msg: "{{ litellm_master_key_op_ref }} resolved to an empty value; LiteLLM would start without authentication."
    quiet: true
  when: litellm_state == "present"

- name: Assert every alias maps to a llama-server instance (llama_server backend)
  vars:
    _names: "{{ litellm_llama_server_instances | map(attribute='name') | list }}"
  ansible.builtin.assert:
    that:
      - litellm_backend in ['ollama', 'llama_server']
      - litellm_backend != 'llama_server' or litellm_llama_embed_instance in _names
      - litellm_backend != 'llama_server' or litellm_llama_extract_instance in _names
      - litellm_backend != 'llama_server' or litellm_llama_coder_light_instance in _names
      - litellm_backend != 'llama_server' or litellm_llama_coder_heavy_instance in _names
    fail_msg: "litellm_backend must be ollama or llama_server, and each litellm_llama_*_instance must name an entry of llama_server_instances ({{ _names }})."
    quiet: true
  when: litellm_state == "present"

- name: Ensure LiteLLM config directory exists
  ansible.builtin.file:
    path: "{{ litellm_config_dest | dirname }}"
    state: directory
    mode: "0755"
    owner: "{{ litellm_run_user }}"
  become: true
  when: litellm_state == "present"

- name: Deploy LiteLLM config
  ansible.builtin.template:
    src: litellm-config.yaml.j2
    dest: "{{ litellm_config_dest }}"
    owner: "{{ litellm_run_user }}"
    mode: "0600"
  become: true
  no_log: true
  notify: Restart LiteLLM
  when: litellm_state == "present"

- name: Deploy LiteLLM wrapper script
  ansible.builtin.template:
    src: litellm-serve.j2
    dest: /usr/local/bin/litellm-serve
    owner: root
    group: wheel
    mode: "0755"
  become: true
  notify: Restart LiteLLM
  when: litellm_state == "present"

# Drift cleanup: LiteLLM used to be run by a hand-made per-user LaunchAgent
# (label com.litellm.proxy in the gui domain) holding :4000. The role-owned
# LaunchDaemon replaces it, so the agent must be gone before the daemon binds.
- name: Look up the uid of the LiteLLM run user
  ansible.builtin.command: id -u {{ litellm_run_user }}
  register: _litellm_run_uid
  changed_when: false
  check_mode: false
  when: litellm_state == "present"

- name: Check for the hand-made LiteLLM LaunchAgent
  ansible.builtin.stat:
    path: "/Users/{{ litellm_run_user }}/Library/LaunchAgents/com.litellm.proxy.plist"
  register: _litellm_agent_plist
  when: litellm_state == "present"

- name: Boot out the hand-made LiteLLM LaunchAgent
  ansible.builtin.command: launchctl bootout gui/{{ _litellm_run_uid.stdout | trim }}/com.litellm.proxy
  become: true
  failed_when: false
  changed_when: true
  when:
    - litellm_state == "present"
    - _litellm_agent_plist.stat.exists

- name: Remove the hand-made LiteLLM LaunchAgent plist
  ansible.builtin.file:
    path: "/Users/{{ litellm_run_user }}/Library/LaunchAgents/com.litellm.proxy.plist"
    state: absent
  when:
    - litellm_state == "present"

- name: Deploy LiteLLM LaunchDaemon plist
  ansible.builtin.template:
    src: litellm.plist.j2
    dest: /Library/LaunchDaemons/com.litellm.proxy.plist
    owner: root
    group: wheel
    mode: "0644"
  become: true
  notify: Restart LiteLLM
  when: litellm_state == "present"
  register: litellm_plist

- name: Bootout existing LiteLLM LaunchDaemon (if running)
  ansible.builtin.command: launchctl bootout system/com.litellm.proxy
  become: true
  failed_when: false
  changed_when: true
  when:
    - litellm_state == "present"
    - litellm_plist is changed

- name: Bootstrap LiteLLM LaunchDaemon
  ansible.builtin.command: launchctl bootstrap system /Library/LaunchDaemons/com.litellm.proxy.plist
  become: true
  changed_when: true
  when:
    - litellm_state == "present"
    - litellm_plist is changed

- name: Ensure LiteLLM LaunchDaemon is running (kickstart)
  ansible.builtin.command: launchctl kickstart system/com.litellm.proxy
  become: true
  failed_when: false
  changed_when: false
  when:
    - litellm_state == "present"
    - litellm_plist is not changed

- name: Unload and remove LiteLLM LaunchDaemon
  ansible.builtin.command: launchctl bootout system /Library/LaunchDaemons/com.litellm.proxy.plist
  become: true
  failed_when: false
  changed_when: true
  when: litellm_state == "absent"

- name: Remove LiteLLM plist, wrapper, and config
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop:
    - /Library/LaunchDaemons/com.litellm.proxy.plist
    - /usr/local/bin/litellm-serve
    - "{{ litellm_config_dest | dirname }}"
  when: litellm_state == "absent"
