---
# node-prereqs role — installs packages, kernel modules, and basic hardening
# required for k3s HA nodes with QNAP iSCSI (Trident) and NFS storage.

# linux-modules-extra-<kernel> exists for Ubuntu 24.04's kernels but not for 26.04's
# 7.0 kernels, where iscsi_tcp ships in the base modules package (pre-flight
# 2026-10-27: no candidate on the HW9 onodes). Install it only when apt has one.
- name: Refresh the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true
  when: node_prereqs_state == 'present'

- name: Check for a linux-modules-extra package for the running kernel
  ansible.builtin.command:
    argv: [apt-cache, policy, "linux-modules-extra-{{ ansible_facts['kernel'] }}"]
  register: _node_prereqs_modules_extra
  changed_when: false
  check_mode: false
  when: node_prereqs_state == 'present'

- name: Install prerequisite packages
  ansible.builtin.apt:
    name: >-
      {{ _node_prereqs_packages
         + (['linux-modules-extra-' ~ ansible_facts['kernel']] if _node_prereqs_has_modules_extra else [])
         + (node_prereqs_extra_packages | default([])) }}
    state: "{{ 'present' if node_prereqs_state == 'present' else 'absent' }}"
    update_cache: true
  become: true
  vars:
    # Kernel modules for iSCSI on kernels that split them out (see above).
    _node_prereqs_has_modules_extra: >-
      {{ (_node_prereqs_modules_extra.stdout | default('')) is search('Candidate: (?!\\(none\\))\\S')
         if node_prereqs_state == 'present' else false }}
    _node_prereqs_packages:
      # iSCSI — required by the QNAP CSI driver (Trident)
      - open-iscsi
      # NFS client — required for NFS-backed volumes (qnap-nfs StorageClass)
      - nfs-common
      # LVM — block device management
      - lvm2
      # iSCSI multipath — for QNAP iSCSI multi-path I/O
      - multipath-tools
      # Basic tooling
      - curl
      - wget
      - git
      - jq
      - htop
      - tmux
      - rsync
      # Security
      - fail2ban

- name: Enable and start iscsid
  ansible.builtin.systemd:
    name: iscsid
    enabled: true
    state: started
  become: true
  when: node_prereqs_state == 'present'

- name: Enable and start multipathd
  ansible.builtin.systemd:
    name: multipathd
    enabled: true
    state: started
  become: true
  when: node_prereqs_state == 'present'
  failed_when: false   # may not be present on all kernels

# ── Kernel modules ────────────────────────────────────────────────────────────

- name: Load iSCSI kernel module
  community.general.modprobe:
    name: iscsi_tcp
    state: present
  become: true
  when: node_prereqs_state == 'present'

- name: Load dm_multipath kernel module
  community.general.modprobe:
    name: dm_multipath
    state: present
  become: true
  when: node_prereqs_state == 'present'
  failed_when: false

- name: Persist kernel modules across reboots
  ansible.builtin.copy:
    dest: /etc/modules-load.d/olympus.conf
    content: |
      # Loaded by Ansible (node-prereqs role) — do not edit manually
      iscsi_tcp
      dm_multipath
    owner: root
    group: root
    mode: "0644"
  become: true
  when: node_prereqs_state == 'present'

# ── Security hardening ────────────────────────────────────────────────────────

# UFW is intentionally left disabled — Tailscale enforces network policy.
# Enabling UFW would require explicit rules for k3s inter-node traffic.
- name: Disable UFW (Tailscale handles network policy)
  ansible.builtin.command: ufw disable
  become: true
  changed_when: false
  failed_when: false
  when: node_prereqs_state == 'present'

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  become: true
  when:
    - node_prereqs_state == 'present'
    - node_prereqs_fail2ban
