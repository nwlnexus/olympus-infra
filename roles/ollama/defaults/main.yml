---
ollama_state: present
# Homebrew package state: `latest` keeps ollama current (upgrades on each run);
# `present` installs-but-never-upgrades. ai-hub tracks `latest` so the MLX/GGUF
# runners stay patched (0.20.2 shipped an MLX prefix-cache crash that broke
# multi-turn agentic runs — verified fixed on 0.30.11, the version ai-hub now runs).
ollama_pkg_state: latest
ollama_models: []
ollama_service_port: 11434
# Residency/throughput tuning. 24h keeps nomic + llama3.2:3b + qwen3.6:27b-mlx
# effectively always warm. MAX_LOADED_MODELS=3 lets all three be co-resident
# instead of evicting each other (all three fit: nomic ~0.4G, llama3.2:3b, and
# the single big model qwen3.6:27b-mlx ~19G nvfp4).
ollama_keep_alive: "24h"
ollama_max_loaded_models: 3
# NUM_PARALLEL=1 is the unified mem0+coding profile. ONE model — qwen3.6:27b-mlx —
# serves both mem0 fact-extraction (tool-calling) and agentic coding; there is no
# separate big extraction model, so the mem0-vs-coding RAM time-share in epic #197
# dissolves. At 1 there's no per-slot KV balloon and the model gets full context
# for coding; the tradeoff is that a long coding job serializes ahead of mem0
# writes (they queue). Bump to 2 if concurrent mem0+coding matters — now safe on
# the ~19G model (dropping qwen3:32b freed ~31G; qwen3:32b was what ballooned at >1).
ollama_num_parallel: 1
# Models warmed after a (re)start so the first real request is hot. Must be a
# subset of ollama_models (this role pulls those first). /api/generate auto-pulls
# a missing model, which for a big model (~19G) can exceed the warmup timeout.
ollama_generate_warmup_models:
  - "llama3.2:3b"
  - "qwen3.6:27b-mlx"
ollama_embed_warmup_models:
  - "nomic-embed-text"
