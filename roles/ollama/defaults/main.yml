---
ollama_state: present
# Homebrew package state: `latest` keeps ollama current (upgrades on each run);
# `present` installs-but-never-upgrades. data-hub tracks `latest` so the MLX/GGUF
# runners stay patched (0.20.2 shipped an MLX prefix-cache crash that broke
# multi-turn agentic runs — verified fixed on 0.30.11, the version data-hub now runs).
ollama_pkg_state: latest

# Models to have pulled. Names without a tag are treated as `:latest`.
ollama_models: []
# Models to delete from disk if present (retired roster entries).
ollama_models_remove: []

# ── Network ───────────────────────────────────────────────────────────────────
# Address Ollama binds to. The safe default is loopback; data-hub sets its tailnet
# IP in group_vars so only the tailnet (never 0.0.0.0 / the LAN) can reach it.
# (Ollama has no authentication; nwlnexus/olympus-infra#1.) The role's own API calls
# (readiness poll, pulls, warmups) go to this address too.
ollama_bind_host: "127.0.0.1"
ollama_service_port: 11434
ollama_api_url: "http://{{ '127.0.0.1' if ollama_bind_host in ['', '0.0.0.0'] else ollama_bind_host }}:{{ ollama_service_port }}"

# Account the LaunchDaemon wrapper drops to (`sudo -Hu`). Models live in that
# account's ~/.ollama/models (OLLAMA_MODELS is not set).
ollama_run_user: "{{ ansible_user | default('ansible') }}"

# When the bind address is a tailnet (non-loopback, non-wildcard) IP, the wrapper
# waits for that address to exist before exec'ing ollama. At boot launchd starts
# the daemon before tailscaled has brought up utun, and a bind to a not-yet-existing
# address fails with "Can't assign requested address" (the Postgres failure of
# 2026-07-05). On timeout the wrapper exits non-zero and KeepAlive retries.
ollama_wait_for_address: "{{ ollama_bind_host not in ['', '0.0.0.0', '127.0.0.1', 'localhost'] }}"
ollama_wait_timeout_seconds: 600

# ── Residency / throughput tuning ─────────────────────────────────────────────
# KEEP_ALIVE 24h keeps whatever was used last resident (the embedder in
# particular). MAX_LOADED_MODELS=2 holds one large model plus the embedder; a third
# model request evicts the least recently used one. NUM_PARALLEL=1 avoids per-slot
# KV-cache multiplication. CONTEXT_LENGTH is the default num_ctx for every load
# (KV is sized for the full context at load time, hence the memory budget in
# AGENTS.md "data-hub serving profile").
ollama_keep_alive: "24h"
ollama_max_loaded_models: 2
ollama_num_parallel: 1
ollama_context_length: 32768
ollama_flash_attention: true

# Models warmed after a (re)start so the first real request is hot. Must be a subset
# of ollama_models. Only the small embedder is warmed by default: warming the ~18 GiB
# generation model on every role run costs minutes, and KEEP_ALIVE keeps it resident
# once used.
ollama_generate_warmup_models: []
ollama_embed_warmup_models:
  - "nomic-embed-text"
