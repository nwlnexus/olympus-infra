---
# Must stay first: handlers run in definition order, so unit drop-in changes
# are loaded before any service restart below.
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Restart tftpd-hpa
  ansible.builtin.service:
    name: tftpd-hpa
    state: restarted
  become: true

- name: Reload nginx
  ansible.builtin.service:
    name: nginx
    state: reloaded
  become: true

- name: Restart dnsmasq
  ansible.builtin.service:
    name: dnsmasq
    state: restarted
  become: true
