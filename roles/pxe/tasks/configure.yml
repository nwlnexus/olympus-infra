---
- name: Configure tftpd-hpa
  ansible.builtin.template:
    src: tftpd-hpa.j2
    dest: /etc/default/tftpd-hpa
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart tftpd-hpa

- name: Create tftpd-hpa systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/tftpd-hpa.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install tftpd-hpa boot-ordering drop-in
  ansible.builtin.template:
    src: tftpd-hpa-override.conf.j2
    dest: /etc/systemd/system/tftpd-hpa.service.d/10-pxe.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd
    - Restart tftpd-hpa

- name: Render iPXE boot menu
  ansible.builtin.template:
    src: ipxe-menu.ipxe.j2
    dest: "{{ pxe_http_root }}/menu/boot.ipxe"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Configure nginx for PXE
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/pxe
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload nginx

- name: Enable nginx PXE site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/pxe
    dest: /etc/nginx/sites-enabled/pxe
    state: link
  become: true
  notify: Reload nginx

- name: Disable nginx default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: true
  notify: Reload nginx

- name: Render cloud-init user-data per host
  ansible.builtin.template:
    src: cloud-init/user-data.j2
    dest: "{{ pxe_http_root }}/cloud-init/{{ item.hostname }}/user-data"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop: "{{ pxe_hosts }}"
  when: pxe_hosts | length > 0

- name: Render cloud-init meta-data per host
  ansible.builtin.template:
    src: cloud-init/meta-data.j2
    dest: "{{ pxe_http_root }}/cloud-init/{{ item.hostname }}/meta-data"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop: "{{ pxe_hosts }}"
  when: pxe_hosts | length > 0

- name: Write empty vendor-data per host
  ansible.builtin.copy:
    content: ""
    dest: "{{ pxe_http_root }}/cloud-init/{{ item.hostname }}/vendor-data"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop: "{{ pxe_hosts }}"
  when: pxe_hosts | length > 0

- name: Create default cloud-init directory for Pi hosts
  ansible.builtin.file:
    path: "{{ pxe_http_root }}/cloud-init/default"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: pxe_pi_enabled | bool

- name: Render default cloud-init user-data for Pi
  ansible.builtin.template:
    src: cloud-init/user-data.j2
    dest: "{{ pxe_http_root }}/cloud-init/default/user-data"
    owner: root
    group: root
    mode: "0644"
  become: true
  vars:
    item:
      hostname: "pi-default"
      inventory: "inventory/styx.yml"
      playbook: "playbooks/pull/styx.yml"
  when: pxe_pi_enabled | bool

- name: Render default cloud-init meta-data for Pi
  ansible.builtin.template:
    src: cloud-init/meta-data.j2
    dest: "{{ pxe_http_root }}/cloud-init/default/meta-data"
    owner: root
    group: root
    mode: "0644"
  become: true
  vars:
    item:
      hostname: "pi-default"
  when: pxe_pi_enabled | bool

- name: Write empty vendor-data for default Pi cloud-init
  ansible.builtin.copy:
    content: ""
    dest: "{{ pxe_http_root }}/cloud-init/default/vendor-data"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: pxe_pi_enabled | bool

- name: Resolve proxyDHCP interface (explicit, or the one holding pxe_server_ip)
  ansible.builtin.set_fact:
    _pxe_dhcp_interface: >-
      {{ pxe_dhcp_interface if (pxe_dhcp_interface | length > 0) else
         (ansible_facts['interfaces']
          | map('replace', '-', '_')
          | select('in', ansible_facts)
          | map('extract', ansible_facts)
          | selectattr('ipv4', 'defined')
          | selectattr('ipv4.address', 'equalto', pxe_server_ip)
          | map(attribute='device')
          | first
          | default('')) }}
  when: pxe_proxy_dhcp_enabled | bool

- name: Configure dnsmasq proxyDHCP for PXE
  ansible.builtin.template:
    src: dnsmasq-pxe.conf.j2
    dest: /etc/dnsmasq.d/pxe.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart dnsmasq
  when: pxe_proxy_dhcp_enabled | bool

- name: Create dnsmasq systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/dnsmasq.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: pxe_proxy_dhcp_enabled | bool

- name: Install dnsmasq boot-ordering drop-in
  ansible.builtin.template:
    src: dnsmasq-override.conf.j2
    dest: /etc/systemd/system/dnsmasq.service.d/10-pxe.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd
    - Restart dnsmasq
  when: pxe_proxy_dhcp_enabled | bool
