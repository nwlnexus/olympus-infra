---
- name: Install tftpd-hpa, nginx, dnsmasq, and ipxe
  ansible.builtin.apt:
    name:
      - tftpd-hpa
      - nginx
      - dnsmasq
      - ipxe
    state: present
    update_cache: true
  become: true

- name: Create PXE directory tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  loop:
    - "{{ pxe_tftp_root }}"
    - "{{ pxe_http_root }}"
    - "{{ pxe_http_root }}/cloud-init"
    - "{{ pxe_http_root }}/menu"
    - "{{ pxe_http_root }}/ubuntu/{{ pxe_ubuntu_codename }}"
    - "{{ pxe_http_root }}/ubuntu/{{ pxe_ubuntu_codename }}-arm64"

- name: Copy iPXE x86_64 EFI binary from apt package
  ansible.builtin.copy:
    src: /usr/lib/ipxe/ipxe.efi
    dest: "{{ pxe_tftp_root }}/ipxe-x86_64.efi"
    remote_src: true
    mode: "0644"
  become: true

- name: Copy iPXE legacy BIOS binary from apt package
  ansible.builtin.copy:
    src: /usr/lib/ipxe/undionly.kpxe
    dest: "{{ pxe_tftp_root }}/undionly.kpxe"
    remote_src: true
    mode: "0644"
  become: true

- name: Copy iPXE arm64 EFI binary from apt package
  ansible.builtin.copy:
    src: /usr/lib/ipxe/arm64-efi/snp.efi
    dest: "{{ pxe_tftp_root }}/ipxe-arm64.efi"
    remote_src: true
    mode: "0644"
  become: true

- name: Check for Ubuntu {{ pxe_ubuntu_codename }} arm64 netboot kernel
  ansible.builtin.stat:
    path: "{{ pxe_http_root }}/ubuntu/{{ pxe_ubuntu_codename }}-arm64/vmlinuz"
  register: _pxe_ubuntu_arm64_vmlinuz

- name: Warn if Ubuntu arm64 netboot assets are missing
  ansible.builtin.debug:
    msg: >-
      Ubuntu {{ pxe_ubuntu_codename }} arm64 netboot assets not found at
      {{ pxe_http_root }}/ubuntu/{{ pxe_ubuntu_codename }}-arm64/.
      Mount the Ubuntu 24.04 arm64 ISO and copy casper/vmlinuz and casper/initrd:
        mount -o loop ubuntu-24.04-live-server-arm64.iso /mnt
        cp /mnt/casper/vmlinuz {{ pxe_http_root }}/ubuntu/{{ pxe_ubuntu_codename }}-arm64/vmlinuz
        cp /mnt/casper/initrd  {{ pxe_http_root }}/ubuntu/{{ pxe_ubuntu_codename }}-arm64/initrd
        umount /mnt
  when: not _pxe_ubuntu_arm64_vmlinuz.stat.exists

- name: Check for Ubuntu {{ pxe_ubuntu_codename }} netboot vmlinuz
  ansible.builtin.stat:
    path: "{{ pxe_http_root }}/ubuntu/{{ pxe_ubuntu_codename }}/vmlinuz"
  register: _pxe_ubuntu_vmlinuz

- name: Warn if Ubuntu {{ pxe_ubuntu_codename }} netboot assets are missing
  ansible.builtin.debug:
    msg: |
      Ubuntu 24.04 netboot assets not found at {{ pxe_http_root }}/ubuntu/{{ pxe_ubuntu_codename }}/vmlinuz.
      Manually copy casper/vmlinuz and casper/initrd from the Ubuntu 24.04 live-server ISO:
        sudo mount -o loop ubuntu-24.04-live-server-amd64.iso /mnt
        sudo cp /mnt/casper/vmlinuz {{ pxe_http_root }}/ubuntu/{{ pxe_ubuntu_codename }}/vmlinuz
        sudo cp /mnt/casper/initrd {{ pxe_http_root }}/ubuntu/{{ pxe_ubuntu_codename }}/initrd
        sudo umount /mnt
  when: not _pxe_ubuntu_vmlinuz.stat.exists
