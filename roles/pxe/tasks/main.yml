---
# Applied in push mode only, by olympus-sdk infra/push-playbooks/styx-setup.yml
# (host vars: olympus-sdk infra/inventories/host_vars/styx/). From olympus-sdk:
#   make styx-setup TAGS=pxe
# The nightly ansible-pull playbook (playbooks/pull/styx.yml) does not include
# this role.
- ansible.builtin.import_tasks: install.yml
  when: pxe_state == 'present'

- ansible.builtin.import_tasks: configure.yml
  when: pxe_state == 'present'

- ansible.builtin.import_tasks: pi.yml
  when: pxe_state == 'present' and pxe_pi_enabled | bool

- ansible.builtin.import_tasks: service.yml
