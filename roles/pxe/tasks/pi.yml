---
- name: Create Pi TFTP firmware directory
  ansible.builtin.file:
    path: "{{ pxe_tftp_root }}/pi"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Download Raspberry Pi firmware files
  ansible.builtin.get_url:
    url: "{{ pxe_pi_firmware_base_url }}/{{ item }}"
    dest: "{{ pxe_tftp_root }}/pi/{{ item }}"
    mode: "0644"
  become: true
  loop: "{{ pxe_pi_firmware_files }}"

- name: Render Pi config.txt
  ansible.builtin.template:
    src: pi/config.txt.j2
    dest: "{{ pxe_tftp_root }}/pi/config.txt"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Render Pi cmdline.txt
  ansible.builtin.template:
    src: pi/cmdline.txt.j2
    dest: "{{ pxe_tftp_root }}/pi/cmdline.txt"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Check for Ubuntu arm64 kernel for Pi
  ansible.builtin.stat:
    path: "{{ pxe_tftp_root }}/pi/vmlinuz"
  register: _pxe_pi_vmlinuz

- name: Warn if Pi Ubuntu arm64 kernel is missing
  ansible.builtin.debug:
    msg: >-
      Pi Ubuntu arm64 kernel not found at {{ pxe_tftp_root }}/pi/vmlinuz.
      Mount the Ubuntu 24.04 arm64 ISO and copy the kernel and initrd:
        mount -o loop ubuntu-24.04-live-server-arm64.iso /mnt
        cp /mnt/casper/vmlinuz {{ pxe_tftp_root }}/pi/vmlinuz
        cp /mnt/casper/initrd  {{ pxe_tftp_root }}/pi/initrd
        umount /mnt
  when: not _pxe_pi_vmlinuz.stat.exists
