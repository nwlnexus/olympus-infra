---
- name: Enable and start tftpd-hpa
  ansible.builtin.systemd:
    name: tftpd-hpa
    enabled: true
    state: started
    daemon_reload: true   # pick up the drop-ins written in configure.yml
  become: true

- name: Enable and start nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
  become: true

- name: Enable and start dnsmasq
  ansible.builtin.service:
    name: dnsmasq
    enabled: true
    state: started
  become: true
  when: pxe_proxy_dhcp_enabled | bool
