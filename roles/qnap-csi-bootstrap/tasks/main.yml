---
- name: Ensure Git is installed (Homebrew, macOS)
  community.general.homebrew:
    name: git
    state: present
  become: false
  when: ansible_facts['os_family'] == "Darwin"

- name: Clone QNAP CSI Plugin repository
  ansible.builtin.git:
    repo: "{{ qnap_csi_repo }}"
    dest: "{{ qnap_csi_install_dir }}"
    version: "{{ qnap_csi_version }}"
    force: false
  become: true
  when: qnap_csi_state == "present"

# Read creds via the community.general.onepassword lookup (controller-side),
# matching the repo convention (see baseline/tasks/olympus-inventory.yml).
# The SA token is slurped from the host file and passed explicitly to the
# lookup via service_account_token= — no `op` CLI needed on the target, no
# OP_SERVICE_ACCOUNT_TOKEN env dependency, and reads run once on the controller.
- name: Read OP service account token
  ansible.builtin.slurp:
    src: /etc/olympus/op-service-account-token
  register: _qnap_op_token_file
  become: true
  no_log: true
  when: qnap_csi_state == "present"

- name: Load QNAP management + iSCSI CHAP credentials from 1Password
  ansible.builtin.set_fact:
    _qnap_mgmt_user: "{{ lookup('community.general.onepassword',
        qnap_csi_op_item, field='username', vault=qnap_csi_op_vault,
        service_account_token=_qnap_op_token_file.content | b64decode | trim) }}"
    _qnap_mgmt_pass: "{{ lookup('community.general.onepassword',
        qnap_csi_op_item, field='password', vault=qnap_csi_op_vault,
        service_account_token=_qnap_op_token_file.content | b64decode | trim) }}"
    _qnap_storage_addr: "{{ lookup('community.general.onepassword',
        qnap_iscsi_op_item, field='storageAddress', vault=qnap_iscsi_op_vault,
        service_account_token=_qnap_op_token_file.content | b64decode | trim) }}"
    _chap_user: "{{ lookup('community.general.onepassword',
        qnap_iscsi_op_item, field='chapInitiatorUsername', vault=qnap_iscsi_op_vault,
        service_account_token=_qnap_op_token_file.content | b64decode | trim) }}"
    _chap_pass: "{{ lookup('community.general.onepassword',
        qnap_iscsi_op_item, field='chapInitiatorPassword', vault=qnap_iscsi_op_vault,
        service_account_token=_qnap_op_token_file.content | b64decode | trim) }}"
  no_log: true
  when: qnap_csi_state == "present"

- name: Check if QNAP CSI Plugin is already installed (sentinel)
  ansible.builtin.stat:
    path: "{{ qnap_csi_sentinel }}"
  register: _qnap_csi_installed
  when: qnap_csi_state == "present"

- name: Install QNAP CSI Plugin via Helm (from local clone)
  ansible.builtin.command: >
    helm --kubeconfig {{ qnap_csi_kubeconfig }}
    install {{ qnap_csi_helm_release }}
    {{ qnap_csi_install_dir }}/Helm/trident
    -n {{ qnap_csi_namespace }}
    --create-namespace
    --set managementLIF={{ _qnap_storage_addr }}
    --set username={{ _qnap_mgmt_user }}
    --set password={{ _qnap_mgmt_pass }}
    --set chapInitiatorUser={{ _chap_user }}
    --set chapInitiatorSecret={{ _chap_pass }}
  no_log: true
  register: _helm_install
  changed_when:
    - _helm_install.rc == 0
  failed_when:
    - _helm_install.rc != 0
    - "'already exists' not in (_helm_install.stderr | default(''))"
    - "'cannot reuse' not in (_helm_install.stderr | default(''))"
  when:
    - qnap_csi_state == "present"
    - not (_qnap_csi_installed.stat.exists | default(false))

- name: Create install sentinel
  ansible.builtin.file:
    path: "{{ qnap_csi_sentinel }}"
    state: touch
    mode: "0644"
  become: true
  when:
    - qnap_csi_state == "present"
    - _helm_install is not skipped
    - _helm_install.rc is defined
    - _helm_install.rc == 0 or 'already exists' in (_helm_install.stderr | default(''))
