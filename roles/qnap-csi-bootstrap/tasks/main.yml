---
# Install-once role. After the first successful install (sentinel present) every
# task below is skipped, so re-runs change nothing and never touch the clone.
# Upgrades: docs/runbooks/2026-11-27-qnap-csi-1.6.3-upgrade.md.
- name: Check if QNAP CSI Plugin is already installed (sentinel)
  ansible.builtin.stat:
    path: "{{ qnap_csi_sentinel }}"
  register: _qnap_csi_installed
  when: qnap_csi_state == "present"

- name: Install QNAP CSI Plugin at the pinned version
  when:
    - qnap_csi_state == "present"
    - not (_qnap_csi_installed.stat.exists | default(false))
  block:
    - name: Ensure Git is installed (Homebrew, macOS)
      community.general.homebrew:
        name: git
        state: present
      become: false
      when: ansible_facts['os_family'] == "Darwin"

    - name: Clone QNAP CSI Plugin repository
      ansible.builtin.git:
        repo: "{{ qnap_csi_repo }}"
        dest: "{{ qnap_csi_install_dir }}"
        version: "{{ qnap_csi_version }}"
        # A clone left by a failed install carries the kubeVersion edit below;
        # discard it so the checkout of the pin cannot fail. Only reached
        # before the sentinel exists, so it never resets a working install.
        force: true
      become: true

    - name: Relax chart kubeVersion ceiling (chart caps at 1.35; k3s may be newer)
      ansible.builtin.replace:
        path: "{{ qnap_csi_install_dir }}/Helm/trident/Chart.yaml"
        regexp: '^kubeVersion:.*$'
        replace: 'kubeVersion: ">= 1.24.0"'
      become: true

    # The chart takes no credentials (only operator/orchestrator image values);
    # the backend comes from olympus-gitops (TridentBackendConfig +
    # ExternalSecret). Passing the QNAP admin and CHAP secrets here only stored
    # them in the Helm release Secret, so they are no longer passed.
    - name: Install QNAP CSI Plugin via Helm (from local clone)
      ansible.builtin.command: >
        helm --kubeconfig {{ qnap_csi_kubeconfig }}
        install {{ qnap_csi_helm_release }}
        {{ qnap_csi_install_dir }}/Helm/trident
        -n {{ qnap_csi_namespace }}
        --create-namespace
      become: true  # the k3s kubeconfig is root-only (0600)
      register: _helm_install
      changed_when:
        - _helm_install.rc == 0
      failed_when:
        - _helm_install.rc != 0
        - "'cannot re-use a name that is still in use' not in (_helm_install.stderr | default(''))"

    - name: Create install sentinel
      ansible.builtin.file:
        path: "{{ qnap_csi_sentinel }}"
        state: touch
        mode: "0644"
        modification_time: preserve
        access_time: preserve
      become: true
      when:
        - _helm_install.rc is defined
        - _helm_install.rc == 0 or 'cannot re-use a name that is still in use' in (_helm_install.stderr | default(''))
