# k3s-health-gate.sh configuration (sourced by bash).
#
# Expected values that change between upgrade hops live here, so a hop only
# needs a one-line edit (e.g. EXPECTED_ETCDSERVER, EXPECTED_ETCDCLUSTER).
# Override the file with `-c <file>` or K3S_GATE_CONF=<file>.

# Servers: "<node-name>=<ssh-target>" (space-separated). Every server runs the
# etcd (2382 gateway), /readyz and certificate checks. kubectl queries go to
# the first server whose local /readyz answers "ok".
SERVERS="onode-030c31=ansible@100.97.218.87 onode-0312ce=ansible@100.126.57.18 onode-0314ac=ansible@100.81.35.111"

# Agents: "<node-name>=<ssh-target>". Used for the certificate check. The
# first agent also runs the VIP probe.
AGENTS="naraka-01=ansible@100.118.62.118"

# VIP probe: run from the first agent. Anonymous auth is off, so 401 = success.
VIP_URL="https://192.168.253.2:6443/readyz"
VIP_EXPECTED_HTTP="401"
VIP_LEASE_NAMESPACE="kube-system"
VIP_LEASE_NAME="plndr-cp-lock"
VIP_LEASE_MAX_AGE_SECONDS=30

# etcd baseline (2026-10-04). Member IDs must not change across hops.
EXPECTED_ETCD_MEMBERS="2314940545497593744 7326987295837399503 10471908179106310219"
EXPECTED_ETCDSERVER="3.6.14"      # space-separated list allowed mid-hop, e.g. "3.5.21 3.5.26"; after Hop 1: 3.5.26; Hop 2+: 3.6.14
EXPECTED_ETCDCLUSTER="3.6.0"           # empty = not checked ; after Hop 2: 3.6.0
RAFT_INDEX_MAX_SPREAD=100

# Kubernetes
EXPECTED_NODE_COUNT=4
EXPECTED_SERVER_K3S_VERSION="v1.35.9+k3s1"
EXPECTED_AGENT_K3S_VERSION="v1.35.9+k3s1"   # empty = not checked ; e.g. v1.35.9+k3s1
EXPECTED_VA_ATTACHED=11  # minimum; extra transient attachments pass
CSI_NAMESPACE="trident"
CERT_MIN_DAYS=30

# Pod checks: a container that terminated within this many minutes counts as
# restarting; Pending/not-ready pods younger than POD_GRACE_MINUTES are ignored.
RECENT_RESTART_MINUTES=15
POD_GRACE_MINUTES=5

# HW9 server joins (olympus-sdk#567): etcd grows 3 -> 4 -> 5 one onode at a time.
# APPLY AFTER THE JOINS: the default stage is the cluster as it is today, so the gate
# stays green before the first join. playbooks/push/join-k3s-server.yml sets both
# variables itself; by hand:
#   K3S_GATE_STAGE=4-servers K3S_GATE_NEW_ETCD_IDS="<id>" scripts/k3s-health-gate.sh
#   K3S_GATE_STAGE=5-servers K3S_GATE_NEW_ETCD_IDS="<id> <id>" scripts/k3s-health-gate.sh
# (IDs as /v3/cluster/member/list prints them, decimal). Once both have joined, a
# follow-up change moves the two IDs into EXPECTED_ETCD_MEMBERS, the servers into
# SERVERS and EXPECTED_NODE_COUNT=6 as the default, and drops this block.
# The new servers are reached by MagicDNS name over Tailscale SSH (like the tailnet
# IPs above; the ansible user on the LAN needs ~/.ssh/ansible, which ssh does not pick).
K3S_GATE_STAGE=${K3S_GATE_STAGE:-3-servers}
K3S_GATE_NEW_ETCD_IDS=${K3S_GATE_NEW_ETCD_IDS:-}
case $K3S_GATE_STAGE in
  3-servers) _gate_new_servers="" ;;
  4-servers) _gate_new_servers="onode-0636e4=ansible@onode-0636e4" ;;
  5-servers) _gate_new_servers="onode-0636e4=ansible@onode-0636e4 onode-062caa=ansible@onode-062caa" ;;
  *) echo "K3S_GATE_STAGE=$K3S_GATE_STAGE: want 3-servers, 4-servers or 5-servers" >&2; exit 2 ;;
esac
_gate_new_count=$(wc -w <<<"$_gate_new_servers")
if [[ $(wc -w <<<"$K3S_GATE_NEW_ETCD_IDS") -ne $_gate_new_count ]]; then
  echo "K3S_GATE_STAGE=$K3S_GATE_STAGE needs $_gate_new_count new etcd member ID(s) in K3S_GATE_NEW_ETCD_IDS (got '$K3S_GATE_NEW_ETCD_IDS')" >&2
  exit 2
fi
if ((_gate_new_count > 0)); then
  SERVERS+=" $_gate_new_servers"
  EXPECTED_ETCD_MEMBERS+=" $K3S_GATE_NEW_ETCD_IDS"
  EXPECTED_NODE_COUNT=$((EXPECTED_NODE_COUNT + _gate_new_count))
fi
unset _gate_new_servers _gate_new_count
