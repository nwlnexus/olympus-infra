---
# Offline checks for roles/cloudflare-access (olympus-sdk#736): runs the role's pure planning steps
# (compute-applications, compute-policies, compute-app, compute-tunnel, compute-mcp*) against fake Cloudflare API
# responses and asserts the result. No API, no token, no 1Password: the placeholders below are not
# credentials. plan_test.py next to it runs the whole role against a local fake API (olympus-sdk#916).
#
#   ansible-playbook -i tests/cloudflare-access/inventory.yml tests/cloudflare-access/render.yml
- name: Plan the Access objects from fake API responses
  hosts: all
  gather_facts: false
  vars_files:
    - ../../roles/cloudflare-access/defaults/main.yml
  vars:
    _role: ../../roles/cloudflare-access
    _cfa_templates: "{{ playbook_dir }}/../../roles/cloudflare-access/templates"
    _compute_hub: "{{ lookup('ansible.builtin.file', '../../inventory/group_vars/compute_hub.yml') | from_yaml }}"
    _playbook: "{{ lookup('ansible.builtin.file', '../../playbooks/push/cloudflare-access.yml') | from_yaml }}"
    _apply: "{{ lookup('ansible.builtin.file', _role ~ '/tasks/apply.yml') | from_yaml }}"
    _application: "{{ lookup('ansible.builtin.file', _role ~ '/tasks/application.yml') | from_yaml }}"
    _token_tasks: "{{ lookup('ansible.builtin.file', _role ~ '/tasks/service-token.yml') | from_yaml }}"
    _catch_all: {service: "https://traefik.traefik.svc.cluster.local:443", originRequest: {noTLSVerify: true}}
    _other_rule: {hostname: other.nwlnexus.net, service: "http://other.other:80"}
    _mem_rule: {hostname: memory.nwlnexus.io, service: "http://memory-gateway.memory.svc.cluster.local:80"}
    _k8s_rule: {hostname: k8s-mcp.nwlnexus.io, service: "http://k8s-mcp.atlas-system.svc.cluster.local:80"}
    _acct_placeholder: "0000000000000000000000000000000a"
    _memory_tools:
      - {name: append}
      - {name: digest}
      - {name: forget}
      - {name: recall}
      - {name: status}
    _owner_ids: {memory-allow-owner: pol-1, memory-service-auth: pol-2}
    # The MCP state as it is live after #923 (memory authenticated and curated in the owner portal).
    _live_servers:
      - {id: memory, name: memory, hostname: "https://memory.nwlnexus.io/mcp", auth_type: oauth,
         status: ready, authentication_status: connected, tools: "{{ _memory_tools }}", prompts: []}
    _live_portals:
      - id: owner
        name: owner
        hostname: mcp.nwlnexus.io
        code_mode: "off"
        servers:
          - server_id: memory
            on_behalf: true
            default_disabled: false
            updated_tools:
              - {name: forget, enabled: false, portal_alias: null, server_alias: null}
              - {name: recall, enabled: true}
    _live_apps:
      - {id: app-1, name: memory, type: self_hosted, domain: memory.nwlnexus.io}
      - id: app-p
        name: mcp-portal-owner
        type: mcp_portal
        domain: mcp.nwlnexus.io
        destinations: [{type: public, uri: mcp.nwlnexus.io}]
        session_duration: 24h
        app_launcher_visible: false
        policies: [{id: pol-1, precedence: 1, name: memory-allow-owner}]
        oauth_configuration:
          enabled: true
          dynamic_client_registration:
            enabled: true
            allowed_uris: ["https://claude.ai/*"]
            allow_any_on_localhost: true
            allow_any_on_loopback: true
          grant: {access_token_lifetime: 15m, session_duration: 336h}
      - id: app-s
        name: mcp-server-memory
        type: mcp
        destinations: [{type: via_mcp_server_portal, mcp_server_id: memory}]
        policies: [{id: pol-1, precedence: 1}]
    _k8s_synced:
      id: k8s
      name: k8s
      hostname: "https://k8s-mcp.nwlnexus.io/mcp"
      auth_type: oauth
      status: ready
      tools: [{name: pods_list}, {name: pods_log}, {name: resources_get}]
  tasks:
    # --- wiring ------------------------------------------------------------------------------------
    - name: The playbook targets the same account as the cluster tunnel and hard-codes no owner e-mail
      ansible.builtin.assert:
        that:
          - _playbook[0].vars.cloudflare_access_account_id == _compute_hub.cloudflared_account_id
          - cloudflare_access_tunnel_name == _compute_hub.cloudflared_tunnel_name
          - lookup('ansible.builtin.file', '../../playbooks/push/cloudflare-access.yml') is not search('@gmail|@nwlnexus')
          - lookup('ansible.builtin.file', _role ~ '/defaults/main.yml') is not search('@gmail|@nwlnexus')
        quiet: true

    - name: Every task that talks to the API or 1Password is no_log, and reads run in --check
      vars:
        _nested: "{{ _apply + _application + _token_tasks + (lookup('ansible.builtin.file', _role ~ '/tasks/tunnel.yml') | from_yaml)
                     + (lookup('ansible.builtin.file', _role ~ '/tasks/dns.yml') | from_yaml)
                     + (lookup('ansible.builtin.file', _role ~ '/tasks/policy.yml') | from_yaml)
                     + (lookup('ansible.builtin.file', _role ~ '/tasks/mcp.yml') | from_yaml)
                     + (lookup('ansible.builtin.file', _role ~ '/tasks/mcp-server.yml') | from_yaml)
                     + (lookup('ansible.builtin.file', _role ~ '/tasks/mcp-portal.yml') | from_yaml) }}"
        # Tasks inside a block (application.yml's service tokens) count too.
        _flat: >-
          [{% for t in _nested %}{% for u in (t.block if 'block' in t else [t]) %}{{ u | to_json }},{% endfor %}{% endfor %}null]
        _all: "{{ (_flat | from_json)[:-1] }}"
        _api: >-
          [{% for t in _all if 'ansible.builtin.uri' in t or 'ansible.builtin.command' in t %}{{ t | to_json }},{% endfor %}null]
        _gets: >-
          [{% for t in _all if 'ansible.builtin.uri' in t and t['ansible.builtin.uri'].method == 'GET' %}{{ t | to_json }},{% endfor %}null]
        _api_l: "{{ (_api | from_json)[:-1] }}"
        _gets_l: "{{ (_gets | from_json)[:-1] }}"
      ansible.builtin.assert:
        that:
          - _api_l | length > 15
          - _api_l | map(attribute='no_log', default=false) | reject('equalto', true) | list | length == 0
          - _gets_l | length >= 13
          - _gets_l | map(attribute='check_mode', default=true) | reject('equalto', false) | list | length == 0
        fail_msg: "{{ _api_l | map(attribute='name') | zip(_api_l | map(attribute='no_log', default=false)) | list | to_json }}"
        quiet: true

    # --- applications (olympus-sdk#916) -------------------------------------------------------------
    - name: Fill in the default application list
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-applications.yml"

    - name: memory comes first from the single-application variables; k8s-mcp is owner-only, no tokens
      ansible.builtin.assert:
        that:
          - _cfa_applications | map(attribute='name') | list == ['memory', 'k8s-mcp']
          - _cfa_applications[0].domain == cloudflare_access_app_domain
          - _cfa_applications[0].policy_prefix == cloudflare_access_policy_prefix
          - _cfa_applications[0].tunnel_service == cloudflare_access_tunnel_service
          - _cfa_applications[0].service_token_hosts == cloudflare_access_service_token_hosts
          - _cfa_applications[0].service_token_name_prefix == cloudflare_access_service_token_name_prefix
          - _cfa_applications[0].op_item == cloudflare_access_op_item
          - _cfa_applications[0].oauth_allowed_redirect_uris == ['https://claude.ai/*']
          - _cfa_applications[0].tunnel_enabled
          - _cfa_applications[1].domain == 'k8s-mcp.nwlnexus.io'
          - _cfa_applications[1].policy_prefix == 'k8s-mcp-'
          - _cfa_applications[1].tunnel_service == 'http://k8s-mcp.atlas-system.svc.cluster.local:80'
          - _cfa_applications[1].service_token_hosts == []
          - _cfa_applications[1].oauth_allowed_redirect_uris == ['https://claude.ai/*']
          - _cfa_applications[1].portal_callback_uris == []
          - not _cfa_applications[1].oauth_allow_localhost
          - _cfa_applications[1].dns_zone == 'nwlnexus.io'
          - "_cfa_applications[1].backend_env == {'team_domain': 'ACCESS_TEAM_DOMAIN', 'aud': 'ACCESS_AUD'}"
        fail_msg: "{{ _cfa_applications | to_json }}"
        quiet: true

    - name: Plan the k8s-mcp policies (no service tokens)
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-policies.yml"
      vars:
        cloudflare_access_owner_emails: [Owner@Example.invalid]
        _cfa_a: "{{ _cfa_applications[1] }}"
        _cfa_tokens: {memory-ai-agent-host: tok-1}

    - name: Only k8s-mcp-allow-owner, no service-auth
      ansible.builtin.assert:
        that:
          - "_cfa_policies_desired == [{'name': 'k8s-mcp-allow-owner', 'decision': 'allow',
             'include': [{'email': {'email': 'owner@example.invalid'}}], 'exclude': [], 'require': []}]"
        fail_msg: "{{ _cfa_policies_desired | to_json }}"
        quiet: true

    - name: Plan the k8s-mcp application
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-app.yml"
      vars:
        _cfa_a: "{{ _cfa_applications[1] }}"
        _cfa_apps: []
        _cfa_policy_ids: {k8s-mcp-allow-owner: pol-k}

    - name: One policy, Managed OAuth with the claude.ai redirect
      ansible.builtin.assert:
        that:
          - _cfa_app_action == 'create'
          - "_cfa_app_desired.policies == [{'id': 'pol-k', 'precedence': 1}]"
          - _cfa_app_desired.oauth_configuration.dynamic_client_registration.allowed_uris == ['https://claude.ai/*']
        fail_msg: "{{ _cfa_app_desired | to_json }}"
        quiet: true

    # --- policies ----------------------------------------------------------------------------------
    - name: Plan the policies with two of three tokens present
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-policies.yml"
      vars:
        # Task vars beat vars_files (the role defaults), play vars do not.
        cloudflare_access_owner_emails: [Owner@Example.invalid]
        _cfa_a: "{{ _cfa_applications[0] }}"
        _cfa_tokens: {memory-ai-agent-host: tok-1, memory-nwl-mstudio: tok-2, unrelated: tok-9}

    - name: The allow-owner policy admits the owner only, service-auth exactly the memory tokens, no Bypass
      ansible.builtin.assert:
        that:
          - _cfa_policies_desired | length == 2
          - _cfa_policies_desired[0].name == 'memory-allow-owner'
          - _cfa_policies_desired[0].decision == 'allow'
          - "_cfa_policies_desired[0].include == [{'email': {'email': 'owner@example.invalid'}}]"
          - _cfa_policies_desired[1].name == 'memory-service-auth'
          - _cfa_policies_desired[1].decision == 'non_identity'
          - "_cfa_policies_desired[1].include == [{'service_token': {'token_id': 'tok-1'}}, {'service_token': {'token_id': 'tok-2'}}]"
          - _cfa_policies_desired | map(attribute='decision') | select('equalto', 'bypass') | list == []
        fail_msg: "{{ _cfa_policies_desired | to_json }}"
        quiet: true

    - name: Policy comparison ignores rule order and extra API fields
      vars:
        _api_view:
          id: pol-2
          name: memory-service-auth
          decision: non_identity
          include: [{'service_token': {'token_id': 'tok-2'}}, {'service_token': {'token_id': 'tok-1'}}]
          exclude: []
          require: []
          created_at: "2026-11-04T00:00:00Z"
        _norm_api: "{{ lookup('ansible.builtin.template', _cfa_templates ~ '/policy-norm.j2', template_vars={'p': _api_view}) }}"
        _norm_want: "{{ lookup('ansible.builtin.template', _cfa_templates ~ '/policy-norm.j2', template_vars={'p': _cfa_policies_desired[1]}) }}"
        _bypass: "{{ _api_view | combine({'decision': 'bypass'}) }}"
        _norm_bypass: "{{ lookup('ansible.builtin.template', _cfa_templates ~ '/policy-norm.j2', template_vars={'p': _bypass}) }}"
      ansible.builtin.assert:
        that:
          - _norm_api == _norm_want
          - _norm_bypass != _norm_want
        quiet: true

    # --- application -------------------------------------------------------------------------------
    - name: Plan the application when none exists
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-app.yml"
      vars:
        _cfa_a: "{{ _cfa_applications[0] }}"
        _cfa_apps: [{name: moneta-access, domain: moneta.example.invalid, aud: x}]
        _cfa_policy_ids: {memory-allow-owner: pol-1, memory-service-auth: pol-2}

    - name: A new self-hosted app on the bare host, both policies, Managed OAuth with DCR for claude.ai
      ansible.builtin.assert:
        that:
          - _cfa_app_action == 'create'
          - _cfa_app_desired.type == 'self_hosted'
          - _cfa_app_desired.domain == 'memory.nwlnexus.io'
          - "_cfa_app_desired.destinations == [{'type': 'public', 'uri': 'memory.nwlnexus.io'}]"
          - "_cfa_app_desired.policies == [{'id': 'pol-1', 'precedence': 1}, {'id': 'pol-2', 'precedence': 2}]"
          - _cfa_app_desired.oauth_configuration.enabled
          - _cfa_app_desired.oauth_configuration.dynamic_client_registration.enabled
          - _cfa_app_desired.oauth_configuration.dynamic_client_registration.allowed_uris == ['https://claude.ai/*']
          - not _cfa_app_desired.oauth_configuration.dynamic_client_registration.allow_any_on_localhost
          - _cfa_app_desired.session_duration == '24h'
        fail_msg: "{{ _cfa_app_desired | to_json }}"
        quiet: true

    - name: Plan against an app that already matches (API view with extra fields and omitted falsy ones)
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-app.yml"
      vars:
        _cfa_a: "{{ _cfa_applications[0] }}"
        _cfa_policy_ids: {memory-allow-owner: pol-1, memory-service-auth: pol-2}
        _cfa_apps:
          - id: app-1
            aud: aud-123
            uid: app-1
            name: memory
            type: self_hosted
            domain: memory.nwlnexus.io
            destinations: [{type: public, uri: memory.nwlnexus.io}]
            session_duration: 24h
            app_launcher_visible: false
            allowed_idps: []
            http_only_cookie_attribute: true
            same_site_cookie_attribute: lax
            policies:
              - {id: pol-1, precedence: 1, name: memory-allow-owner, decision: allow, include: []}
              - {id: pol-2, precedence: 2, name: memory-service-auth, decision: non_identity, include: []}
            oauth_configuration:
              enabled: true
              dynamic_client_registration:
                enabled: true
                allowed_uris: ["https://claude.ai/*"]
                allow_any_on_localhost: false
                allow_any_on_loopback: false
              grant: {access_token_lifetime: 15m, session_duration: 336h}
            created_at: "2026-11-04T00:00:00Z"

    - name: A matching app is unchanged (second run changes nothing)
      ansible.builtin.assert:
        that:
          - _cfa_app_action == 'unchanged'
          - _cfa_app_diff_keys == []
          - _cfa_app_current.aud == 'aud-123'
        fail_msg: "{{ _cfa_app_diff_keys | to_json }}"
        quiet: true

    - name: Plan against an app whose policies were changed in the dashboard (a Bypass added)
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-app.yml"
      vars:
        _cfa_a: "{{ _cfa_applications[0] }}"
        _cfa_policy_ids: {memory-allow-owner: pol-1, memory-service-auth: pol-2}
        _cfa_apps:
          - id: app-1
            aud: aud-123
            name: memory
            type: self_hosted
            domain: memory.nwlnexus.io
            destinations: [{type: public, uri: memory.nwlnexus.io}]
            session_duration: 24h
            policies:
              - {id: pol-bypass, precedence: 1, decision: bypass}
              - {id: pol-1, precedence: 2}
              - {id: pol-2, precedence: 3}
            oauth_configuration: {enabled: false}

    - name: It is updated back to exactly the two policies and Managed OAuth
      ansible.builtin.assert:
        that:
          - _cfa_app_action == 'update'
          - "'policies' in _cfa_app_diff_keys"
          - "'oauth_configuration' in _cfa_app_diff_keys"
          - (_cfa_app_current | combine(_cfa_app_desired)).policies == _cfa_app_desired.policies
        fail_msg: "{{ _cfa_app_diff_keys | to_json }}"
        quiet: true

    # --- tunnel ------------------------------------------------------------------------------------
    - name: Plan the tunnel rule on a config with another hostname and the catch-all
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-tunnel.yml"
      vars:
        _cfa_tunnel_apps: "{{ _cfa_applications[:1] }}"
        _cfa_tunnel_config: {ingress: ["{{ _other_rule }}", "{{ _catch_all }}"], warp-routing: {enabled: false}}

    - name: The rule goes first, every other rule is kept, the catch-all stays last
      ansible.builtin.assert:
        that:
          - _cfa_ingress_changed
          - "_cfa_ingress_new == [{'hostname': 'memory.nwlnexus.io', 'service': 'http://memory-gateway.memory.svc.cluster.local:80'}, _other_rule, _catch_all]"
        fail_msg: "{{ _cfa_ingress_new | to_json }}"
        quiet: true

    - name: Plan again on the written config
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-tunnel.yml"
      vars:
        _cfa_tunnel_apps: "{{ _cfa_applications[:1] }}"
        _cfa_tunnel_config: {ingress: "{{ _cfa_ingress_new }}"}

    - name: Second run changes nothing
      ansible.builtin.assert:
        that: not _cfa_ingress_changed
        quiet: true

    - name: Plan the rollback (tunnel disabled)
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-tunnel.yml"
      vars:
        _cfa_tunnel_apps: "{{ [_cfa_applications[0] | combine({'tunnel_enabled': false})] }}"
        _cfa_tunnel_config: {ingress: "{{ _cfa_ingress_new }}"}

    - name: Rollback removes only the memory rule
      ansible.builtin.assert:
        that:
          - _cfa_ingress_changed
          - _cfa_ingress_new == [_other_rule, _catch_all]
        quiet: true

    - name: Plan both applications' rules on a config that has memory's rule after another one
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-tunnel.yml"
      vars:
        _cfa_tunnel_apps: "{{ _cfa_applications }}"
        _cfa_tunnel_config: {ingress: ["{{ _other_rule }}", "{{ _mem_rule }}", "{{ _catch_all }}"]}

    - name: Both rules first, in list order, every other rule kept, catch-all last
      ansible.builtin.assert:
        that:
          - _cfa_ingress_changed
          - _cfa_ingress_new == [_mem_rule, _k8s_rule, _other_rule, _catch_all]
        fail_msg: "{{ _cfa_ingress_new | to_json }}"
        quiet: true

    - name: Plan both again on the written config
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-tunnel.yml"
      vars:
        _cfa_tunnel_apps: "{{ _cfa_applications }}"
        _cfa_tunnel_config: {ingress: "{{ _cfa_ingress_new }}"}

    - name: Second run with both changes nothing
      ansible.builtin.assert:
        that: not _cfa_ingress_changed
        quiet: true

    - name: Plan with k8s-mcp left out of the run (removed from the list, or its application not created yet)
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-tunnel.yml"
      vars:
        _cfa_tunnel_apps: "{{ _cfa_applications[:1] }}"
        _cfa_tunnel_config: {ingress: ["{{ _mem_rule }}", "{{ _k8s_rule }}", "{{ _other_rule }}", "{{ _catch_all }}"]}

    - name: Its rule is kept, not deleted
      ansible.builtin.assert:
        that:
          - not _cfa_ingress_changed
        fail_msg: "{{ _cfa_ingress_new | to_json }}"
        quiet: true

    # --- MCP portal (olympus-sdk#923) --------------------------------------------------------------
    - name: The MCP portal is off by default and leaves the memory app's redirect URIs alone
      ansible.builtin.assert:
        that:
          - not cloudflare_access_mcp_portal_enabled
          - cloudflare_access_mcp_disabled_tools == ['forget']
          - cloudflare_access_mcp_portal_code_mode == 'off'
        quiet: true

    - name: Plan the memory application with the portal on (portal callbacks in its DCR redirect URIs)
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-app.yml"
      vars:
        cloudflare_access_mcp_portal_enabled: true
        cloudflare_access_account_id: "{{ _acct_placeholder }}"
        # The list was filled in with the default (empty) account id; re-read the callbacks with the placeholder.
        _cfa_a: "{{ _cfa_applications[0] | combine({'portal_callback_uris': cloudflare_access_mcp_memory_callback_uris}) }}"
        _cfa_policy_ids: "{{ _owner_ids }}"
        _cfa_apps:
          - id: app-1
            name: memory
            type: self_hosted
            domain: memory.nwlnexus.io
            destinations: [{type: public, uri: memory.nwlnexus.io}]
            session_duration: 24h
            app_launcher_visible: false
            http_only_cookie_attribute: true
            same_site_cookie_attribute: lax
            policies: [{id: pol-1, precedence: 1}, {id: pol-2, precedence: 2}]
            oauth_configuration:
              enabled: true
              dynamic_client_registration:
                enabled: true
                allowed_uris: ["https://claude.ai/*"]
                allow_any_on_localhost: false
                allow_any_on_loopback: false
              grant: {access_token_lifetime: 15m, session_duration: 336h}

    - name: claude.ai is kept first, both callbacks are added, and the existing app is updated (not a second writer)
      ansible.builtin.assert:
        that:
          - _cfa_app_action == 'update'
          - _cfa_app_diff_keys == ['oauth_configuration']
          - >-
            _cfa_app_desired.oauth_configuration.dynamic_client_registration.allowed_uris ==
            ['https://claude.ai/*',
             'https://dash.cloudflare.com/' ~ _acct_placeholder ~ '/one/access-controls/ai-controls/mcp-server/oauth-callback/memory',
             'https://mcp.nwlnexus.io/servers-callback']
        fail_msg: "{{ _cfa_app_desired.oauth_configuration | to_json }}"
        quiet: true

    # --- MCP server and portal lists (olympus-sdk#929) ---------------------------------------------
    - name: Fill in the default MCP lists
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-mcp.yml"

    - name: Servers memory and k8s; portals owner (memory + k8s) and hosts (k8s only, no memory)
      vars:
        _owner: "{{ _cfa_mcp_portal_list[0] }}"
        _hosts: "{{ _cfa_mcp_portal_list[1] }}"
        _k8s_cb: "{{ _playbook[0].vars.cloudflare_access_k8s_mcp_portal_callback_uris }}"
      ansible.builtin.assert:
        that:
          - _cfa_mcp_server_list | map(attribute='id') | list == ['memory', 'k8s']
          - "_cfa_mcp_server_list[0] == {'id': 'memory', 'name': 'memory', 'url': 'https://memory.nwlnexus.io/mcp',
             'app_name': 'mcp-server-memory', 'disabled_tools': ['forget']}"
          - "_cfa_mcp_server_list[1] == {'id': 'k8s', 'name': 'k8s', 'url': 'https://k8s-mcp.nwlnexus.io/mcp',
             'app_name': 'mcp-server-k8s', 'disabled_tools': []}"
          - _cfa_mcp_portal_list | map(attribute='id') | list == ['owner', 'hosts']
          - _owner.hostname == 'mcp.nwlnexus.io'
          - _owner.app_name == 'mcp-portal-owner'
          - _owner.code_mode == 'off'
          - _owner.oauth_allowed_redirect_uris == ['https://claude.ai/*']
          - _owner.dns_comment == 'MCP server portal (olympus-infra roles/cloudflare-access, olympus-sdk#923)'
          - "_owner.servers == [{'server_id': 'memory', 'on_behalf': true, 'default_disabled': false, 'disabled_tools': ['forget']},
                                {'server_id': 'k8s', 'on_behalf': true, 'default_disabled': false, 'disabled_tools': []}]"
          - _hosts.hostname == cloudflare_access_mcp_hosts_portal_hostname
          - _hosts.app_name == 'mcp-portal-hosts'
          - _hosts.code_mode == 'off'
          - _hosts.oauth_allowed_redirect_uris == []
          - _hosts.oauth_allow_localhost and _hosts.oauth_allow_loopback
          - "_hosts.servers == [{'server_id': 'k8s', 'on_behalf': true, 'default_disabled': false, 'disabled_tools': []}]"
          - "'memory' not in _hosts.servers | map(attribute='server_id')"
          # The playbook gives the k8s-mcp backend the dashboard callback and both portals' callbacks.
          - _k8s_cb | length == 3
          - _k8s_cb[0] is search('/mcp-server/oauth-callback/k8s$')
          # Read as raw text: the callbacks follow the portals' hostname variables.
          - _k8s_cb | select('search', '^https://\\{\\{ cloudflare_access_mcp_hosts_portal_hostname \\}\\}/servers-callback$') | list | length == 1
          - _k8s_cb | select('search', '^https://\\{\\{ cloudflare_access_mcp_portal_hostname \\}\\}/servers-callback$') | list | length == 1
        fail_msg: "{{ {'servers': _cfa_mcp_server_list, 'portals': _cfa_mcp_portal_list} | to_json }}"
        quiet: true

    - name: An unguarded server id, an undeclared portal server and a duplicate hostname are refused
      vars:
        _cases:
          - servers: [{id: memory, url: "https://memory.nwlnexus.io/mcp"}, {id: kube, url: "https://k8s-mcp.nwlnexus.io/mcp"}]
            portals: [{id: owner, hostname: mcp.nwlnexus.io, servers: [{server_id: kube}]}]
          - servers: [{id: memory, url: "https://memory.nwlnexus.io/mcp"}]
            portals: [{id: owner, hostname: mcp.nwlnexus.io, servers: [{server_id: k8s}]}]
          - servers: [{id: memory, url: "https://memory.nwlnexus.io/mcp"}]
            portals: [{id: owner, hostname: mcp.nwlnexus.io, servers: [{server_id: memory}]},
                      {id: hosts, hostname: mcp.nwlnexus.io, servers: [{server_id: memory}]}]
          - servers: [{id: memory, url: "https://memory.nwlnexus.io/mcp"}]
            portals: [{id: hosts, hostname: mcp-hosts.example.invalid, servers: [{server_id: memory}]}]
          - servers: [{id: memory, url: "https://memory.nwlnexus.io/mcp"}]
            portals: [{id: hosts, hostname: mcp-hosts.nwlnexus.io, servers: []}]
      ansible.builtin.include_tasks: refuse-mcp.yml
      loop: "{{ _cases }}"
      loop_control:
        loop_var: _case

    - name: Fill in the default MCP lists again (the refused cases overwrote them)
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-mcp.yml"

    - name: Plan the MCP servers when nothing exists yet
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-mcp-server.yml"
      vars:
        _cfa_ms: "{{ _cfa_mcp_server_list[1] }}"
        _cfa_mcp_servers: []
        _cfa_all_apps: [{id: app-1, name: memory, type: self_hosted, domain: memory.nwlnexus.io}]
        _cfa_policy_ids: "{{ _owner_ids }}"

    - name: k8s and its mcp application are created, with memory's allow-owner policy
      ansible.builtin.assert:
        that:
          - _cfa_mcp_server_action == 'create'
          - "_cfa_mcp_server_desired == {'id': 'k8s', 'name': 'k8s', 'hostname': 'https://k8s-mcp.nwlnexus.io/mcp', 'auth_type': 'oauth'}"
          - _cfa_mcp_tools == []
          - _cfa_mcp_server_app_action == 'create'
          - _cfa_mcp_server_app_desired.name == 'mcp-server-k8s'
          - _cfa_mcp_server_app_desired.type == 'mcp'
          - "_cfa_mcp_server_app_desired.destinations == [{'type': 'via_mcp_server_portal', 'mcp_server_id': 'k8s'}]"
          - "_cfa_mcp_server_app_desired.policies == [{'id': 'pol-1', 'precedence': 1}]"
          - _cfa_mcp_server_plan.action == 'create'
        fail_msg: "{{ _cfa_mcp_server_plan | to_json }}"
        quiet: true

    - name: Plan the memory server against the live-like state (authenticated, its app present)
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-mcp-server.yml"
      vars:
        _cfa_ms: "{{ _cfa_mcp_server_list[0] }}"
        _cfa_mcp_servers: "{{ _live_servers }}"
        _cfa_all_apps: "{{ _live_apps }}"
        _cfa_policy_ids: "{{ _owner_ids }}"

    - name: The memory server and its app are unchanged
      ansible.builtin.assert:
        that:
          - _cfa_mcp_server_action == 'unchanged'
          - _cfa_mcp_server_app_action == 'unchanged'
          - _cfa_mcp_tools == ['append', 'digest', 'forget', 'recall', 'status']
        fail_msg: "{{ _cfa_mcp_server_plan | to_json }}"
        quiet: true

    - name: Plan the owner portal when nothing exists yet
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-mcp-portal.yml"
      vars:
        _cfa_mp: "{{ _cfa_mcp_portal_list[0] }}"
        _cfa_mcp_servers: []
        _cfa_mcp_portals: []
        _cfa_all_apps: []
        _cfa_policy_ids: "{{ _owner_ids }}"

    - name: Owner is created with both servers, curation pending for both, and its app allows claude.ai and Claude Code
      ansible.builtin.assert:
        that:
          - _cfa_mcp_portal_action == 'create'
          - _cfa_mcp_curation | map(attribute='state') | list == ['pending', 'pending']
          - "_cfa_mcp_portal_desired == {'name': 'owner', 'hostname': 'mcp.nwlnexus.io', 'code_mode': 'off',
             'servers': [{'server_id': 'memory', 'on_behalf': true, 'default_disabled': false},
                         {'server_id': 'k8s', 'on_behalf': true, 'default_disabled': false}]}"
          - _cfa_mcp_portal_app_action == 'create'
          - _cfa_mcp_portal_app_desired.type == 'mcp_portal'
          - "_cfa_mcp_portal_app_desired.destinations == [{'type': 'public', 'uri': 'mcp.nwlnexus.io'}]"
          - "_cfa_mcp_portal_app_desired.policies == [{'id': 'pol-1', 'precedence': 1}]"
          - _cfa_mcp_portal_app_desired.oauth_configuration.dynamic_client_registration.allowed_uris == ['https://claude.ai/*']
          - _cfa_mcp_portal_app_desired.oauth_configuration.dynamic_client_registration.allow_any_on_localhost
          - _cfa_mcp_portal_app_desired.oauth_configuration.dynamic_client_registration.allow_any_on_loopback
        fail_msg: "{{ _cfa_mcp_portal_plan | to_json }}"
        quiet: true

    - name: Plan the hosts portal when nothing exists yet
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-mcp-portal.yml"
      vars:
        _cfa_mp: "{{ _cfa_mcp_portal_list[1] }}"
        _cfa_mcp_servers: []
        _cfa_mcp_portals: []
        _cfa_all_apps: []
        _cfa_policy_ids: "{{ _owner_ids }}"

    - name: Hosts is created with k8s only; its app allows Claude Code (localhost/loopback) and not claude.ai
      ansible.builtin.assert:
        that:
          - _cfa_mcp_portal_action == 'create'
          - "_cfa_mcp_portal_desired == {'name': 'hosts', 'hostname': cloudflare_access_mcp_hosts_portal_hostname,
             'code_mode': 'off', 'servers': [{'server_id': 'k8s', 'on_behalf': true, 'default_disabled': false}]}"
          - _cfa_mcp_portal_app_desired.name == 'mcp-portal-hosts'
          - _cfa_mcp_portal_app_desired.domain == cloudflare_access_mcp_hosts_portal_hostname
          - "_cfa_mcp_portal_app_desired.policies == [{'id': 'pol-1', 'precedence': 1}]"
          - _cfa_mcp_portal_app_desired.oauth_configuration.dynamic_client_registration.allowed_uris == []
          - _cfa_mcp_portal_app_desired.oauth_configuration.dynamic_client_registration.allow_any_on_localhost
          - _cfa_mcp_portal_app_desired.oauth_configuration.dynamic_client_registration.allow_any_on_loopback
        fail_msg: "{{ _cfa_mcp_portal_plan | to_json }}"
        quiet: true

    - name: Plan the owner portal against the live-like state (memory curated, k8s not in it, k8s not synced)
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-mcp-portal.yml"
      vars:
        _cfa_mp: "{{ _cfa_mcp_portal_list[0] }}"
        _cfa_mcp_servers: "{{ _live_servers + [{'id': 'k8s', 'name': 'k8s', 'hostname': 'https://k8s-mcp.nwlnexus.io/mcp', 'auth_type': 'oauth'}] }}"
        _cfa_mcp_portals: "{{ _live_portals }}"
        _cfa_all_apps: "{{ _live_apps }}"
        _cfa_policy_ids: "{{ _owner_ids }}"

    - name: Existing state unchanged; k8s is added, memory's curation is sent exactly as it is
      ansible.builtin.assert:
        that:
          - _cfa_mcp_portal_action == 'update'
          - _cfa_mcp_portal_diff_keys == ['servers']
          - _cfa_mcp_curation | map(attribute='state') | list == ['applied', 'pending']
          - _cfa_mcp_portal_app_action == 'unchanged'
          - >-
            _cfa_mcp_portal_desired.servers ==
            [{'server_id': 'memory', 'on_behalf': true, 'default_disabled': false,
              'updated_tools': [{'name': 'append', 'enabled': true}, {'name': 'digest', 'enabled': true},
                                {'name': 'forget', 'enabled': false}, {'name': 'recall', 'enabled': true},
                                {'name': 'status', 'enabled': true}]},
             {'server_id': 'k8s', 'on_behalf': true, 'default_disabled': false}]
        fail_msg: "{{ _cfa_mcp_portal_plan | to_json }}"
        quiet: true

    - name: Plan the memory-only owner portal (the configuration before #929) against the live-like state
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-mcp-portal.yml"
      vars:
        _cfa_mp: "{{ _cfa_mcp_portal_list[0] | combine({'servers': _cfa_mcp_portal_list[0].servers[:1]}) }}"
        _cfa_mcp_servers: "{{ _live_servers }}"
        _cfa_mcp_portals: "{{ _live_portals }}"
        _cfa_all_apps: "{{ _live_apps }}"
        _cfa_policy_ids: "{{ _owner_ids }}"

    - name: It is unchanged
      ansible.builtin.assert:
        that:
          - _cfa_mcp_portal_action == 'unchanged'
          - _cfa_mcp_portal_app_action == 'unchanged'
          - _cfa_mcp_curation | map(attribute='state') | list == ['applied']
        fail_msg: "{{ _cfa_mcp_portal_plan | to_json }}"
        quiet: true

    - name: Plan both portals once k8s has synced (shared server) and owner holds both servers
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-mcp-portal.yml"
      vars:
        _cfa_mp: "{{ _cfa_mcp_portal_list[0] }}"
        _cfa_mcp_servers: "{{ _live_servers + [_k8s_synced] }}"
        _cfa_mcp_portals: >-
          {{ [_live_portals[0] | combine({'servers': _live_portals[0].servers
               + [{'server_id': 'k8s', 'on_behalf': true, 'default_disabled': false}]})] }}
        _cfa_all_apps: "{{ _live_apps }}"
        _cfa_policy_ids: "{{ _owner_ids }}"

    - name: Owner needs no write for k8s (nothing of it is turned off), but its body would list every k8s tool on
      ansible.builtin.assert:
        that:
          - _cfa_mcp_portal_action == 'unchanged'
          - _cfa_mcp_curation | map(attribute='state') | list == ['applied', 'applied']
          - _cfa_mcp_portal_desired.servers[1].updated_tools | length == 3
          - _cfa_mcp_portal_desired.servers[1].updated_tools | rejectattr('enabled') | list == []
        fail_msg: "{{ _cfa_mcp_portal_plan | to_json }}"
        quiet: true

    - name: Plan the hosts portal with pods_log off for k8s there only (per-server, per-portal curation)
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-mcp-portal.yml"
      vars:
        _cfa_mp: >-
          {{ _cfa_mcp_portal_list[1] | combine({'servers': [_cfa_mcp_portal_list[1].servers[0]
               | combine({'disabled_tools': ['pods_log']})]}) }}
        _cfa_mcp_servers: "{{ _live_servers + [_k8s_synced] }}"
        _cfa_mcp_portals:
          - {id: hosts, name: hosts, hostname: "{{ cloudflare_access_mcp_hosts_portal_hostname }}", code_mode: "off",
             servers: [{server_id: k8s, on_behalf: true, default_disabled: false}]}
        _cfa_all_apps: "{{ _live_apps }}"
        _cfa_policy_ids: "{{ _owner_ids }}"

    - name: Only that tool is off in hosts, and the portal is updated for curation only
      ansible.builtin.assert:
        that:
          - _cfa_mcp_portal_action == 'update'
          - _cfa_mcp_portal_diff_keys == ['updated_tools']
          - _cfa_mcp_curation[0].state == 'to_apply'
          - _cfa_mcp_curation[0].want_disabled == ['pods_log']
          - >-
            _cfa_mcp_portal_desired.servers[0].updated_tools ==
            [{'name': 'pods_list', 'enabled': true}, {'name': 'pods_log', 'enabled': false},
             {'name': 'resources_get', 'enabled': true}]
        fail_msg: "{{ _cfa_mcp_portal_plan | to_json }}"
        quiet: true

    - name: Plan the owner portal once memory is authenticated and the portal exists uncurated
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-mcp-portal.yml"
      vars:
        _cfa_mp: "{{ _cfa_mcp_portal_list[0] | combine({'servers': _cfa_mcp_portal_list[0].servers[:1]}) }}"
        _cfa_mcp_servers: "{{ _live_servers }}"
        _cfa_mcp_portals:
          - id: owner
            name: owner
            hostname: mcp.nwlnexus.io
            allow_code_mode: false
            servers:
              - {id: memory, server_id: memory, on_behalf: true, tools: "{{ _memory_tools }}", updated_tools: []}
        _cfa_all_apps: "{{ _live_apps }}"
        _cfa_policy_ids: "{{ _owner_ids }}"

    - name: The portal is updated with every memory tool listed and forget off
      ansible.builtin.assert:
        that:
          - _cfa_mcp_curation[0].state == 'to_apply'
          - _cfa_mcp_portal_action == 'update'
          - _cfa_mcp_portal_diff_keys == ['updated_tools']
          - _cfa_mcp_portal_app_action == 'unchanged'
          - >-
            _cfa_mcp_portal_desired.servers[0].updated_tools ==
            [{'name': 'append', 'enabled': true}, {'name': 'digest', 'enabled': true},
             {'name': 'forget', 'enabled': false}, {'name': 'recall', 'enabled': true},
             {'name': 'status', 'enabled': true}]
        fail_msg: "{{ _cfa_mcp_portal_plan | to_json }}"
        quiet: true

    - name: Plan against an owner portal changed in the dashboard (Code Mode on, a tool off, per-user auth off)
      ansible.builtin.include_tasks: "{{ _role }}/tasks/compute-mcp-portal.yml"
      vars:
        _cfa_mp: "{{ _cfa_mcp_portal_list[0] | combine({'servers': _cfa_mcp_portal_list[0].servers[:1]}) }}"
        _cfa_mcp_servers: "{{ _live_servers }}"
        _cfa_mcp_portals:
          - id: owner
            name: owner
            hostname: mcp.nwlnexus.io
            code_mode: default_on
            servers:
              - server_id: memory
                on_behalf: false
                updated_tools: [{name: forget, enabled: false}, {name: recall, enabled: false}]
        _cfa_all_apps: []
        _cfa_policy_ids: "{{ _owner_ids }}"

    - name: It is put back
      ansible.builtin.assert:
        that:
          - _cfa_mcp_portal_action == 'update'
          - _cfa_mcp_portal_diff_keys == ['code_mode', 'servers', 'updated_tools']
          - _cfa_mcp_portal_desired.servers[0].on_behalf
        fail_msg: "{{ _cfa_mcp_portal_diff_keys | to_json }}"
        quiet: true
