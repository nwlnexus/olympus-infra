---
# Renders the inference-server (Ubuntu, systemd) templates with the real
# inventory/group_vars/inference_server.yml and asserts the properties the A9 depends on:
# pins, one unit per instance, sandbox that keeps GPU access, connection caps, watchdog,
# kernel parameters, and that the shipped inventory keeps the host out of every play. Runs on
# the controller; no host needed. shellcheck lints the rendered scripts when on PATH (it is on
# GitHub-hosted runners); `nft -c` runs when nft is present.
#
#   ansible-playbook -i tests/inference-server/inventory.yml tests/inference-server/render.yml
- name: Render inference-server profile
  hosts: all
  gather_facts: false
  vars_files:
    - ../../roles/inference-server/defaults/main.yml
    - ../../inventory/group_vars/inference_server.yml
  vars:
    _role: ../../roles/inference-server
    _out: "{{ lookup('ansible.builtin.env', 'TMPDIR', default='/tmp') }}/inference-server-render"
    _names: "{{ inference_server_instances | map(attribute='name') | list }}"
    _by_name: "{{ dict(_names | zip(inference_server_instances)) }}"
    _kernel_params:
      - "ttm.pages_limit={{ inference_server_ttm_pages_limit }}"
      - "ttm.page_pool_size={{ inference_server_ttm_page_pool_size }}"
  tasks:
    # vars_files outrank play vars, so the test address and state go in as facts. The address is a
    # documentation one (RFC 5737), not a host: tests never render with the real tailnet address.
    - name: Override the shipped placeholders for rendering
      ansible.builtin.set_fact:
        inference_server_tailscale_ip: "192.0.2.10"
        inference_server_state: present
        # the shipped default is off; the cap templates are rendered and checked with it on
        inference_server_connection_limit_enabled: true

    - name: Create output dir
      ansible.builtin.file:
        path: "{{ _out }}"
        state: directory
        mode: "0700"

    # ── The shipped inventory: a9-mega, present, bound to its tailnet address ──
    - name: Shipped inventory names a9-mega, state is present and the tailnet IP is a 100.64.0.0/10 address
      vars:
        _shipped: "{{ lookup('ansible.builtin.file', '../../inventory/group_vars/inference_server.yml') | from_yaml }}"
        _pull: "{{ lookup('ansible.builtin.file', '../../inventory/inference-server.yml') | from_yaml }}"
        _push: "{{ lookup('ansible.builtin.file', '../../inventory/olympus.yml') | from_yaml }}"
      ansible.builtin.assert:
        that:
          - _shipped.inference_server_state == 'present'
          - _shipped.inference_server_tailscale_ip is match('^100\\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\\.[0-9]{1,3}\\.[0-9]{1,3}$')
          - _shipped.ansible_pull_limit == 'a9-mega'
          - _shipped.tailscale_hostname == 'a9-mega'
          - _shipped.tailscale_tags == ['tag:inference']
          - not _shipped.tailscale_accept_dns
          - not _shipped.tailscale_accept_routes
          - _shipped.tailscale_services == ['ssh']
          - _shipped.k3s_primary == false
          - _shipped.ansible_pull_skip_tags == 'common'
          - _shipped.atlas_state == 'present'
          - _shipped.baseline_unattended_auto_reboot == false
          - "'onepassword' in _shipped.tailscale_oauth_client_id"
          - "'onepassword' in _shipped.tailscale_oauth_client_secret"
          - "_pull.all.children.inference_server.hosts == {'a9-mega': {'ansible_host': '127.0.0.1', 'ansible_connection': 'local'}}"
          - "_push.all.children.inference_server.hosts == {'a9-mega': {'ansible_host': '192.168.253.15'}}"
          - (lookup('ansible.builtin.file', _role ~ '/defaults/main.yml') | from_yaml).inference_server_connection_limit_enabled == false
          - (lookup('ansible.builtin.file', _role ~ '/defaults/main.yml') | from_yaml).inference_server_state == 'absent'

    # ── Pins and lists ─────────────────────────────────────────────────────────
    - name: llama.cpp and model pins are well formed and match the instances
      vars:
        _files: "{{ inference_server_models | map(attribute='file') | list }}"
        _used: "{{ inference_server_instances | map(attribute='model') | unique | list }}"
        _ports: "{{ inference_server_instances | map(attribute='port') | list }}"
        _builds: "{{ inference_server_llama_builds.values() | list }}"
      ansible.builtin.assert:
        that:
          - inference_server_backend == 'vulkan'
          - inference_server_llama_tag is match('^b[0-9]+$')
          - inference_server_llama_builds.keys() | sort == ['rocm', 'vulkan']
          - _builds | rejectattr('sha256', 'match', '^[0-9a-f]{64}$') | list | length == 0
          - _builds | map(attribute='size') | select('integer') | select('gt', 0) | list | length == 2
          - inference_server_llama_builds.vulkan.asset == 'llama-' ~ inference_server_llama_tag ~ '-bin-ubuntu-vulkan-x64.tar.gz'
          - inference_server_llama_builds.rocm.asset == 'llama-' ~ inference_server_llama_tag ~ '-bin-ubuntu-rocm-10.0-x64.tar.gz'
          - _files | unique | length == _files | length
          - _used | difference(_files) | length == 0
          - _files | difference(_used) | length == 0
          - inference_server_models | rejectattr('sha256', 'match', '^[0-9a-f]{64}$') | list | length == 0
          - inference_server_models | rejectattr('revision', 'match', '^[0-9a-f]{40}$') | list | length == 0
          - inference_server_models | rejectattr('file', 'match', '^[A-Za-z0-9._-]+\.gguf$') | list | length == 0
          - inference_server_models | map(attribute='size') | select('integer') | select('gt', 0) | list | length == inference_server_models | length
          - _names | sort == ['nomic-embed', 'qwen35-9b', 'qwen36-27b', 'qwen36-27b-coder', 'qwen36-35b-a3b']
          - _ports | sort == [8081, 8082, 8083, 8084, 8085]
          - _ports | unique | length == _ports | length
          - inference_server_instances | map(attribute='alias') | unique | length == _names | length
          # no qwen2.5 for coding (owner rule, July 2026)
          - inference_server_models | map(attribute='file') | select('search', '(?i)qwen2\\.5') | list | length == 0
          - _by_name['qwen36-27b'].model == _by_name['qwen36-27b-coder'].model
          - _by_name['qwen36-27b'].port == 8081
          - _by_name['qwen35-9b'].port == 8082
          - _by_name['qwen36-35b-a3b'].port == 8084
          - _by_name['qwen36-27b-coder'].port == 8085
          - _by_name['nomic-embed'].kind == 'embed'
          - _by_name['nomic-embed'].embed_dim == 768
          - inference_server_bind_host == '192.0.2.10'

    # The A9 is a superset of data-hub since olympus-sdk#460: every instance and model the two share
    # (27B on :8081, the embedder on :8083) must stay identical, so the fallback behaves like the primary.
    - name: Shared model pins and instance args match the data-hub profile (one shared shape)
      vars:
        _dh: "{{ lookup('ansible.builtin.file', '../../inventory/group_vars/data_hub.yml') | from_yaml }}"
        _dh_inst: "{{ dict(_dh.llama_server_instances | map(attribute='name') | zip(_dh.llama_server_instances)) }}"
        _dh_models: "{{ dict(_dh.llama_server_models | map(attribute='file') | zip(_dh.llama_server_models)) }}"
        _a9_models: "{{ dict(inference_server_models | map(attribute='file') | zip(inference_server_models)) }}"
      ansible.builtin.assert:
        that:
          - _dh_inst['qwen36-27b'] == _by_name['qwen36-27b']
          - _dh_inst['nomic-embed'] == _by_name['nomic-embed']
          - _dh_models['Qwen3.6-27B-Q5_K_M.gguf'] == _a9_models['Qwen3.6-27B-Q5_K_M.gguf']
          - _dh_models['nomic-embed-text-v1.5.f16.gguf'] == _a9_models['nomic-embed-text-v1.5.f16.gguf']
          # the A9-only coder instances serve the same 27B family with the same flags apart from context
          - _by_name['qwen36-27b-coder'].args | difference(_by_name['qwen36-27b'].args) == [['-c', 65536]]
          - _by_name['qwen36-35b-a3b'].args == _by_name['qwen36-27b-coder'].args

    # GPU memory budget (olympus-sdk#460): weights of every started instance plus KV, against the 96 GiB GTT
    # limit. 27B twice (two processes, two copies). Estimate 76.6 GiB; this guards against growth, not accuracy.
    - name: Resident weights of all instances stay under 70 GiB of the 96 GiB GTT (KV and compute are the rest)
      vars:
        _sizes: "{{ dict(inference_server_models | map(attribute='file') | zip(inference_server_models | map(attribute='size'))) }}"
        _weights: "{{ inference_server_instances | map(attribute='model') | map('extract', _sizes) | map('int') | sum }}"
      ansible.builtin.assert:
        that:
          - _weights | int < 70 * 1024 * 1024 * 1024
          - inference_server_gpu_memory_gib | int == 96

    # ── Render ─────────────────────────────────────────────────────────────────
    - name: Render wrappers
      ansible.builtin.template:
        src: "{{ _role }}/templates/inference-server-serve.j2"
        dest: "{{ _out }}/inference-server-serve-{{ _instance.name }}"
        mode: "0600"
      loop: "{{ inference_server_instances }}"
      loop_control:
        loop_var: _instance
        label: "{{ _instance.name }}"

    - name: Render units
      ansible.builtin.template:
        src: "{{ _role }}/templates/inference-server.service.j2"
        dest: "{{ _out }}/inference-server-{{ _instance.name }}.service"
        mode: "0600"
      loop: "{{ inference_server_instances }}"
      loop_control:
        loop_var: _instance
        label: "{{ _instance.name }}"

    - name: Render the remaining templates
      ansible.builtin.template:
        src: "{{ _role }}/templates/{{ item.src }}"
        dest: "{{ _out }}/{{ item.dest }}"
        mode: "0600"
      vars:
        _inference_server_kernel_params: "{{ _kernel_params }}"
      loop:
        - {src: inference-server-watchdog.j2, dest: inference-server-watchdog}
        - {src: inference-server-watchdog.service.j2, dest: inference-server-watchdog.service}
        - {src: inference-server-watchdog.timer.j2, dest: inference-server-watchdog.timer}
        - {src: inference-server-limits.nft.j2, dest: inference-server-limits.nft}
        - {src: inference-server-limits.service.j2, dest: inference-server-limits.service}
        - {src: grub-dropin.cfg.j2, dest: grub-dropin.cfg}
      loop_control:
        label: "{{ item.dest }}"

    - name: Slurp rendered files
      ansible.builtin.slurp:
        src: "{{ _out }}/{{ item }}"
      loop: >-
        {{ (_names | map('regex_replace', '^', 'inference-server-serve-') | list)
           + (_names | map('regex_replace', '^(.*)$', 'inference-server-\1.service') | list)
           + ['inference-server-watchdog', 'inference-server-watchdog.service', 'inference-server-watchdog.timer',
              'inference-server-limits.nft', 'inference-server-limits.service', 'grub-dropin.cfg'] }}
      register: _r

    - name: Index rendered content by file name
      ansible.builtin.set_fact:
        _txt: "{{ _txt | default({}) | combine({item.item: item.content | b64decode}) }}"
      loop: "{{ _r.results }}"
      loop_control:
        label: "{{ item.item }}"

    # ── Wrappers ───────────────────────────────────────────────────────────────
    - name: Wrappers bind the tailnet address only, wait for it and exec the pinned build
      vars:
        _w: "{{ _txt['inference-server-serve-' ~ item.name] }}"
        _cmd: "{{ _w.split('exec ')[1] }}"
      ansible.builtin.assert:
        that:
          - "'ip -o -4 addr show' in _w"
          - "'/opt/olympus/llama.cpp/current/llama-server' in _w"
          - "'--host 192.0.2.10' in _w"
          - "'0.0.0.0' not in _cmd"
          - "('--port ' ~ item.port) in _w"
          - "('-m /opt/olympus/models/gguf/' ~ item.model) in _w"
          - "('--alias ' ~ item.alias) in _w"
          - "'--metrics' in _w"
          - "'--no-webui' in _w"
          - "'--api-key' not in _w"
          - "'LD_LIBRARY_PATH' not in _w"
          - _cmd.strip().splitlines()[:-1] | reject('match', '.* \\\\$') | list | length == 0
          - not (_cmd.strip().splitlines()[-1] is match('.*\\\\$'))
      loop: "{{ inference_server_instances }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Instance arguments (27B memory-extract, 9B coder-light, 35B-A3B coder-medium, 27B coder-heavy, embed)
      ansible.builtin.assert:
        that:
          - "'-c 32768' in _txt['inference-server-serve-qwen36-27b']"
          - "'-np 1' in _txt['inference-server-serve-qwen36-27b']"
          - "'-ngl 999' in _txt['inference-server-serve-qwen36-27b']"
          - "'-fa on' in _txt['inference-server-serve-qwen36-27b']"
          - "'--jinja' in _txt['inference-server-serve-qwen36-27b']"
          - "'--reasoning-format deepseek' in _txt['inference-server-serve-qwen36-27b']"
          - >-
            "--chat-template-kwargs '{\"enable_thinking\":false}'" in _txt['inference-server-serve-qwen36-27b']
          - "'--cache-ram 0' in _txt['inference-server-serve-qwen36-27b']"
          - "'--timeout 900' in _txt['inference-server-serve-qwen36-27b']"
          - "'-c 32768' in _txt['inference-server-serve-qwen35-9b']"
          - "'-np 1' in _txt['inference-server-serve-qwen35-9b']"
          - "'--timeout 900' in _txt['inference-server-serve-qwen35-9b']"
          - "'--reasoning-format deepseek' in _txt['inference-server-serve-qwen35-9b']"
          - >-
            "--chat-template-kwargs '{\"enable_thinking\":false}'" in _txt['inference-server-serve-qwen35-9b']
          - "'-c 65536' in _txt['inference-server-serve-qwen36-35b-a3b']"
          - "'-np 1' in _txt['inference-server-serve-qwen36-35b-a3b']"
          - "'-ngl 999' in _txt['inference-server-serve-qwen36-35b-a3b']"
          - "'-fa on' in _txt['inference-server-serve-qwen36-35b-a3b']"
          - "'--jinja' in _txt['inference-server-serve-qwen36-35b-a3b']"
          - "'-m /opt/olympus/models/gguf/Qwen3.6-35B-A3B-UD-Q5_K_M.gguf' in _txt['inference-server-serve-qwen36-35b-a3b']"
          - >-
            "--chat-template-kwargs '{\"enable_thinking\":false}'" in _txt['inference-server-serve-qwen36-35b-a3b']
          - "'-c 65536' in _txt['inference-server-serve-qwen36-27b-coder']"
          - "'-np 1' in _txt['inference-server-serve-qwen36-27b-coder']"
          - "'-m /opt/olympus/models/gguf/Qwen3.6-27B-Q5_K_M.gguf' in _txt['inference-server-serve-qwen36-27b-coder']"
          - "'--timeout 900' in _txt['inference-server-serve-qwen36-27b-coder']"
          - "'--embeddings' in _txt['inference-server-serve-nomic-embed']"
          - "'--pooling mean' in _txt['inference-server-serve-nomic-embed']"
          - "'-np 4' in _txt['inference-server-serve-nomic-embed']"
          - "'--timeout 120' in _txt['inference-server-serve-nomic-embed']"

    - name: A flag in inference_server_drop_flags disappears from every wrapper
      vars:
        _instance: "{{ _by_name['qwen36-27b'] }}"
        inference_server_drop_flags: ['--cache-ram', '--reasoning-format']
        _w: "{{ lookup('ansible.builtin.template', _role ~ '/templates/inference-server-serve.j2') }}"
      ansible.builtin.assert:
        that:
          - "'--cache-ram' not in _w"
          - "'--reasoning-format' not in _w"
          - "'deepseek' not in _w"
          - "'--metrics' in _w"

    - name: ROCm variant puts the host ROCm libraries on LD_LIBRARY_PATH
      vars:
        inference_server_backend: rocm
        _instance: "{{ _by_name['qwen36-27b'] }}"
        _w: "{{ lookup('ansible.builtin.template', _role ~ '/templates/inference-server-serve.j2') }}"
      ansible.builtin.assert:
        that:
          - "'export LD_LIBRARY_PATH=\"/opt/rocm/lib' in _w"

    # ── Units ──────────────────────────────────────────────────────────────────
    - name: Units restart always, run unprivileged with GPU access and a sandbox, log to journald
      vars:
        _u: "{{ _txt['inference-server-' ~ item ~ '.service'] }}"
      ansible.builtin.assert:
        that:
          - "'Restart=always' in _u"
          - "'StartLimitIntervalSec=0' in _u"
          - "'User=llama' in _u"
          - "'SupplementaryGroups=video render' in _u"
          - "('ExecStart=/usr/local/bin/inference-server-serve-' ~ item) in _u"
          - "'StandardOutput=journal' in _u"
          - "('SyslogIdentifier=inference-server-' ~ item) in _u"
          - "'NoNewPrivileges=true' in _u"
          - "'ProtectSystem=strict' in _u"
          - "'ProtectHome=true' in _u"
          - "'CapabilityBoundingSet=\n' in _u"
          - "'DevicePolicy=closed' in _u"
          - "'DeviceAllow=char-drm rw' in _u"
          - "'DeviceAllow=/dev/kfd rw' in _u"
          - "'LimitMEMLOCK=infinity' in _u"
          - "'tailscaled.service' in _u"
          - "'inference-server-limits.service' in _u"
          # these would break GPU access
          - "'\\nPrivateDevices=' not in _u"
          - "'\\nMemoryDenyWriteExecute=' not in _u"
          - "'\\nProtectKernelTunables=' not in _u"
          - "'\\nIPAddressDeny=' not in _u"
      loop: "{{ _names }}"

    # ── Connection caps (bounded queue) ────────────────────────────────────────
    - name: nftables caps admit slots + queue + headroom connections per instance port
      vars:
        _n: "{{ _txt['inference-server-limits.nft'] }}"
      ansible.builtin.assert:
        that:
          - "'table inet olympus_inference' in _n"
          - "'tcp dport 8081 ct state new ct count over 7 reject with tcp reset' in _n"
          - "'tcp dport 8082 ct state new ct count over 7 reject with tcp reset' in _n"
          - "'tcp dport 8084 ct state new ct count over 7 reject with tcp reset' in _n"
          - "'tcp dport 8085 ct state new ct count over 7 reject with tcp reset' in _n"
          - "'tcp dport 8083 ct state new ct count over 10 reject with tcp reset' in _n"
          - "'ExecStart=/usr/sbin/nft -f /etc/olympus/inference-server-limits.nft' in _txt['inference-server-limits.service']"

    - name: A per-instance queue overrides the default
      vars:
        # a fixed copy: a var must not be defined in terms of itself
        inference_server_instances:
          - {name: q, port: 8081, model: m.gguf, alias: q, kind: chat, queue: 0, args: [[-np, 1]]}
        _n: "{{ lookup('ansible.builtin.template', _role ~ '/templates/inference-server-limits.nft.j2') }}"
      ansible.builtin.assert:
        that:
          - "'ct count over 3 reject' in _n"

    # ── Watchdog ───────────────────────────────────────────────────────────────
    - name: Watchdog checks every instance every 60 s with the metric names and restarts through systemd
      vars:
        _s: "{{ _txt['inference-server-watchdog'] }}"
        _t: "{{ _txt['inference-server-watchdog.timer'] }}"
      ansible.builtin.assert:
        that:
          - "\"METRIC_PROCESSING='llamacpp:requests_processing'\" in _s"
          - "\"METRIC_DECODE_TOTAL='llamacpp:n_decode_total'\" in _s"
          - "\"HOST='192.0.2.10'\" in _s"
          - "\"'qwen36-27b|8081|chat|qwen3.6-27b|0'\" in _s"
          - "\"'qwen35-9b|8082|chat|qwen3.5-9b|0'\" in _s"
          - "\"'qwen36-35b-a3b|8084|chat|qwen3.6-35b-a3b|0'\" in _s"
          - "\"'qwen36-27b-coder|8085|chat|qwen3.6-27b-coder|0'\" in _s"
          - "\"'nomic-embed|8083|embed|nomic-embed-text|768'\" in _s"
          - "'FAIL_THRESHOLD=3' in _s"
          - "'STALL_THRESHOLD=3' in _s"
          - "'COOLDOWN=600' in _s"
          - "'/slots' in _s"
          - "'systemctl restart --no-block' in _s"
          - "'unit=\"inference-server-${name}.service\"' in _s"
          - "'RESTART $1 reason=' in _s"
          - "'launchctl' not in _s"
          # every absolute tool path is a real directory path (a /usrawk-style typo made every probe fail on the A9)
          - _s is not search('/usr[^/]')
          - _s is not search('/bin[a-z]')
          - "'OnUnitActiveSec=60s' in _t"
          - "'ExecStart=/usr/local/bin/inference-server-watchdog' in _txt['inference-server-watchdog.service']"
          - "'Type=oneshot' in _txt['inference-server-watchdog.service']"

    # ── Kernel parameters ──────────────────────────────────────────────────────
    - name: 96 GiB of GPU-addressable memory is 25165824 4-KiB pages; the GRUB drop-in appends them
      vars:
        _g: "{{ _txt['grub-dropin.cfg'] }}"
      ansible.builtin.assert:
        that:
          - inference_server_ttm_pages_limit | int == 25165824
          - inference_server_ttm_pages_limit | int * 4096 == 96 * 1024 * 1024 * 1024
          - inference_server_ttm_page_pool_size | int == 25165824
          - "'GRUB_CMDLINE_LINUX_DEFAULT=\"${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }ttm.pages_limit=25165824 ttm.page_pool_size=25165824\"' in _g"
          - "'amdgpu.gttsize' not in _g"

    - name: The legacy amdgpu.gttsize knob is added only when set
      vars:
        inference_server_amdgpu_gttsize_mib: 98304
        _inference_server_kernel_params: "{{ _kernel_params + ['amdgpu.gttsize=98304'] }}"
        _g: "{{ lookup('ansible.builtin.template', _role ~ '/templates/grub-dropin.cfg.j2') }}"
      ansible.builtin.assert:
        that:
          - "'ttm.page_pool_size=25165824 amdgpu.gttsize=98304' in _g"

    # ── Lint the rendered scripts, units and rules ─────────────────────────────
    - name: Look for shellcheck and nft
      ansible.builtin.command: "{{ item.cmd }}"
      register: _tools
      changed_when: false
      failed_when: false
      loop:
        - {name: shellcheck, cmd: shellcheck --version}
        - {name: nft, cmd: nft --version}
      loop_control:
        label: "{{ item.name }}"

    - name: shellcheck the rendered wrappers and watchdog
      ansible.builtin.command:
        argv: >-
          {{ ['shellcheck', '-s', 'bash', '-S', 'warning']
             + (_names | map('regex_replace', '^', _out ~ '/inference-server-serve-') | list)
             + [_out ~ '/inference-server-watchdog'] }}
      changed_when: false
      when: _tools.results[0].rc == 0

    - name: Note that shellcheck was skipped
      ansible.builtin.debug:
        msg: "shellcheck not on PATH: rendered scripts were not linted"
      when: _tools.results[0].rc != 0

    - name: nft syntax check of the connection caps (when nft is installed)
      ansible.builtin.command: nft -c -f {{ _out }}/inference-server-limits.nft
      changed_when: false
      failed_when: false
      register: _nftc
      when: _tools.results[1].rc == 0

    - name: Show the nft check result (informational, -c may need privileges on the runner)
      ansible.builtin.debug:
        msg: "nft -c rc={{ _nftc.rc | default('skipped') }} {{ _nftc.stderr | default('') }}"

    - name: Clean up
      ansible.builtin.file:
        path: "{{ _out }}"
        state: absent
